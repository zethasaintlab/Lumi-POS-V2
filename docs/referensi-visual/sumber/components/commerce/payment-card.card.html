<!-- @dsCard group="Components" viewport="480x340" name="Payment Card" subtitle="One card, method toggle - Tunai shown with live change" -->
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--background);padding:16px;}
  .card{border-radius:12px;border:1px solid var(--border);background:var(--card);overflow:hidden;max-width:440px;}
  .total{padding:16px 20px;background:var(--panel-subtle-bg);border-bottom:1px solid var(--border);}
  .total p:first-child{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);}
  .total p:last-child{margin:4px 0 0;font-size:32px;font-weight:700;}
  .toggle{padding:10px;border-bottom:1px solid var(--border);}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--secondary);border-radius:10px;padding:4px;}
  .seg button{height:36px;border-radius:8px;border:none;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
  .active{background:var(--card);color:var(--primary);box-shadow:var(--shadow-card);}
  .inactive{background:transparent;color:var(--muted-foreground);}
  .body{padding:18px 20px;}
  label{display:block;font-size:15px;margin-bottom:14px;}
  .change{border-radius:12px;background:var(--accent-subtle);padding:16px;}
  .change p:first-child{margin:0;font-size:13px;color:var(--muted-foreground-strong-alt);}
  .change p:last-child{margin:4px 0 0;font-size:32px;font-weight:700;color:var(--primary);}
</style>
<div class="card">
  <div class="total"><p>Total belanja</p><p>Rp 50.600</p></div>
  <div class="toggle"><div class="seg"><button class="active">Tunai</button><button class="inactive">QRIS</button><button class="inactive">Kartu</button><button class="inactive">Transfer</button></div></div>
  <div class="body">
    <label>Nominal diterima</label>
    <div class="change"><p>Kembalian</p><p>Rp 49.400</p></div>
  </div>
</div>
