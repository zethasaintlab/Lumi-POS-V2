<!-- @dsCard group="Components" viewport="700x240" name="Product Card" subtitle="Photographed vs. not-yet-photographed vs. failed to load" -->
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--background);padding:20px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .card{border-radius:12px;border:1px solid var(--card-outline);background:var(--card);overflow:hidden;min-height:56px;}
  .card img{height:72px;width:100%;object-fit:cover;display:block;}
  .body{padding:10px;}
  .name{margin:0;font-size:15px;}
  .price{margin:4px 0 0;font-size:15px;color:var(--primary);}
  .failed{margin:8px;height:60px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px dashed var(--dashed-border);background:var(--dashed-bg);font-size:13px;color:var(--muted-foreground);}
  .caption{font-size:11px;color:var(--muted-foreground);text-align:center;margin-top:6px;text-transform:uppercase;letter-spacing:.06em;}
</style>
<div class="grid">
  <div>
    <div class="card"><img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=300&h=170&fit=crop&auto=format" alt=""><div class="body"><p class="name">Es Kopi Susu</p><p class="price">Rp 18.000</p></div></div>
    <p class="caption">Bergambar</p>
  </div>
  <div>
    <div class="card"><div class="body"><p class="name">Teh Tarik</p><p class="price">Rp 12.000</p></div></div>
    <p class="caption">Belum difoto - no placeholder</p>
  </div>
  <div>
    <div class="card"><div class="failed"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="21" x2="21" y2="3"/></svg>Gambar gagal</div><div class="body"><p class="name">Kentang Goreng</p><p class="price">Rp 17.000</p></div></div>
    <p class="caption">Gagal dimuat</p>
  </div>
</div>
