<!-- @dsCard group="Colors" viewport="700x220" name="Light vs. Dark" subtitle="The 14 tokens that actually change between modes - everything else is shared" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--card);padding:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted-foreground);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--border);}
  td{padding:4px 8px;border-bottom:1px solid var(--row-divider);}
  .sw{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.08);}
</style>
<table>
  <tr><th>Token</th><th>Terang</th><th>Gelap</th></tr>
  <tr><td>background</td><td><span class="sw" style="background:#f0f6f7"></span>#f0f6f7</td><td><span class="sw" style="background:#102224"></span>#102224</td></tr>
  <tr><td>foreground</td><td><span class="sw" style="background:#16282c"></span>#16282c</td><td><span class="sw" style="background:#eaf3f3"></span>#eaf3f3</td></tr>
  <tr><td>card</td><td><span class="sw" style="background:#ffffff"></span>#ffffff</td><td><span class="sw" style="background:#183033"></span>#183033</td></tr>
  <tr><td>primary</td><td><span class="sw" style="background:#14706b"></span>#14706b</td><td><span class="sw" style="background:#57aaa4"></span>#57aaa4</td></tr>
  <tr><td>secondary</td><td><span class="sw" style="background:#f7fafb"></span>#f7fafb</td><td><span class="sw" style="background:#234246"></span>#234246</td></tr>
  <tr><td>muted-foreground</td><td><span class="sw" style="background:#5e747a"></span>#5e747a</td><td><span class="sw" style="background:#b2c7c9"></span>#b2c7c9</td></tr>
  <tr><td>border</td><td><span class="sw" style="background:#e3ecee"></span>#e3ecee</td><td><span class="sw" style="background:#31575a"></span>#31575a</td></tr>
  <tr><td>ring</td><td><span class="sw" style="background:#14706b"></span>#14706b</td><td><span class="sw" style="background:#76c4be"></span>#76c4be</td></tr>
</table>
