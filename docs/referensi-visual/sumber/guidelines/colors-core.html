<!-- @dsCard group="Colors" viewport="700x160" name="Core Palette" subtitle="Background, surfaces, text, one accent" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--card);padding:16px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:8px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:11px;border:1px solid var(--border);}
  .n{font-weight:600;}
</style>
<div class="row">
  <div class="sw" style="background:var(--background);color:var(--foreground)"><span class="n">background</span>#f0f6f7</div>
  <div class="sw" style="background:var(--card);color:var(--foreground)"><span class="n">card</span>#ffffff</div>
  <div class="sw" style="background:var(--secondary);color:var(--foreground)"><span class="n">secondary</span>#f7fafb</div>
  <div class="sw" style="background:var(--foreground);color:#fff"><span class="n">foreground</span>#16282c</div>
  <div class="sw" style="background:var(--primary);color:var(--primary-foreground)"><span class="n">primary</span>#14706b</div>
  <div class="sw" style="background:var(--border);color:var(--foreground)"><span class="n">border</span>#e3ecee</div>
</div>
