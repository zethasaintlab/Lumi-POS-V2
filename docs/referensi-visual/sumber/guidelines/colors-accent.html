<!-- @dsCard group="Colors" viewport="700x140" name="Accent System" subtitle="One accent color across the whole product, plus its two derivatives" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--card);padding:16px;display:flex;gap:10px;}
  .sw{flex:1;border-radius:8px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:11px;}
  .n{font-weight:600;}
</style>
<div class="sw" style="background:var(--primary);color:var(--primary-foreground)"><span class="n">primary</span>#14706b</div>
<div class="sw" style="background:var(--accent-hover);color:#fff"><span class="n">accent-hover</span>#0f5b57</div>
<div class="sw" style="background:var(--accent-subtle);color:var(--primary)"><span class="n">accent-subtle</span>#d9edf0</div>
<div class="sw" style="background:var(--surface-raised);color:var(--foreground);border:1px solid var(--border)"><span class="n">surface-raised</span>#f7fafb</div>
