<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces & Dividers" subtitle="Table rows, cart divider, chart baseline, Lumi-Order's warmer surface" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--card);padding:16px;display:flex;gap:8px;flex-wrap:wrap;}
  .sw{flex:1;min-width:100px;border-radius:8px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10.5px;border:1px solid var(--border);}
  .n{font-weight:600;}
</style>
<div class="sw" style="background:var(--card-outline)"><span class="n">card-outline</span>#e0eaeb</div>
<div class="sw" style="background:var(--row-divider)"><span class="n">row-divider</span>#eef3f3</div>
<div class="sw" style="background:var(--cart-divider)"><span class="n">cart-divider</span>#c3dddc</div>
<div class="sw" style="background:var(--avatar-bg);color:var(--primary)"><span class="n">avatar-bg</span>#d9eceb</div>
<div class="sw" style="background:var(--progress-track)"><span class="n">progress-track</span>#e5eeee</div>
<div class="sw" style="background:var(--guest-background);border-color:var(--guest-border)"><span class="n">guest-background</span>#fffdf9</div>
<div class="sw" style="background:var(--switcher-bg);color:#fff"><span class="n">switcher-bg</span>#1e292b</div>
