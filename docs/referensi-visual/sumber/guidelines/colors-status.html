<!-- @dsCard group="Colors" viewport="700x150" name="Status Colors" subtitle="Five states, used only when they mean something real" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--card);padding:16px;display:flex;gap:10px;flex-wrap:wrap;}
  .sw{flex:1;min-width:110px;border-radius:8px;height:70px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:11px;}
  .n{font-weight:600;}
</style>
<div class="sw" style="background:var(--status-success-bg);color:var(--status-success-text)"><span class="n">success</span>Selesai, lebih</div>
<div class="sw" style="background:var(--status-info-bg);color:var(--status-info-text)"><span class="n">info</span>Berjalan, berikutnya</div>
<div class="sw" style="background:var(--status-pending-bg);color:var(--status-pending-text)"><span class="n">pending</span>Menunggu, netral</div>
<div class="sw" style="background:var(--status-warning-bg);color:var(--status-warning-text)"><span class="n">warning</span>Stok menipis</div>
<div class="sw" style="background:var(--status-danger-bg);color:var(--status-danger-text)"><span class="n">danger</span>Galat, batal, kurang</div>
