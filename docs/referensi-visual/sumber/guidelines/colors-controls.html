<!-- @dsCard group="Colors" viewport="700x160" name="Controls & Forms" subtitle="Input, destructive, ghost, and chip states" -->
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--card);padding:16px;display:flex;gap:8px;flex-wrap:wrap;}
  .sw{flex:1;min-width:96px;border-radius:8px;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10.5px;border:1px solid var(--border);}
  .n{font-weight:600;}
</style>
<div class="sw" style="background:var(--card);border-color:var(--input-border)"><span class="n">input-border</span>#c9dcdf</div>
<div class="sw" style="background:var(--destructive);color:#fff"><span class="n">destructive</span>#b94747</div>
<div class="sw" style="background:var(--ghost-hover-bg);color:var(--ghost-foreground)"><span class="n">ghost-hover-bg</span>#e8f2f2</div>
<div class="sw" style="background:var(--secondary-hover);color:var(--foreground)"><span class="n">secondary-hover</span>#eff6f6</div>
<div class="sw" style="background:var(--chip-hover-bg);color:var(--foreground)"><span class="n">chip-hover-bg</span>#e0eeee</div>
<div class="sw" style="background:var(--keypad-border);color:var(--foreground)"><span class="n">keypad-border</span>#d7e5e6</div>
<div class="sw" style="background:var(--pin-inactive-bg);color:var(--foreground)"><span class="n">pin-inactive-bg</span>#dce7e8</div>
