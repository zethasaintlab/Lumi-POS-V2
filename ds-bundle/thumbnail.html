<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { margin: 0; height: 100%; }
  .tile { display: flex; width: 1280px; height: 854px; }
  .main { flex: 1; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .mark { font-family: var(--font-sans); font-weight: 600; font-size: 168px; letter-spacing: -0.04em; color: var(--on-accent); }
  .mark b { font-weight: 600; color: #8FD0D4; }
  .strip { width: 240px; display: flex; flex-direction: column; }
  .strip > div { flex: 1; }
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="mark">Lumi<b>·</b>POS</div></div>
  <div class="strip">
    <div style="background:#B45309"></div>
    <div style="background:#137535"></div>
    <div style="background:#B91C1C"></div>
  </div>
</div>
</body>
</html>
