<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface)}.cols{display:flex;gap:48px}.col>.t-caption{margin-bottom:8px}.ln{display:flex;justify-content:space-between;width:200px;padding:3px 0}</style></head>
<body><div class="cols">
<div class="col"><div class="t-caption">✔ .num — tabular, rata</div>
<div class="ln num"><span>Subtotal</span><span>Rp 1.847.000</span></div>
<div class="ln num"><span>Diskon</span><span>− Rp 33.000</span></div>
<div class="ln num" style="font-weight:600"><span>Total</span><span>Rp 1.814.000</span></div>
</div>
<div class="col"><div class="t-caption">✘ proporsional — digit bergoyang</div>
<div class="ln" style="font-variant-numeric:normal"><span>Subtotal</span><span>Rp 1.847.000</span></div>
<div class="ln" style="font-variant-numeric:normal"><span>Diskon</span><span>− Rp 33.000</span></div>
<div class="ln" style="font-variant-numeric:normal;font-weight:600"><span>Total</span><span>Rp 1.814.000</span></div>
</div>
</div></body></html>
