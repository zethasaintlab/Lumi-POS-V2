<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-sunk)}.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.box{width:80px;height:60px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center}.lbl{text-align:center}.lbl .t-caption{margin-top:6px}</style></head>
<body><div class="row">
<div class="lbl"><div class="box" style="border-radius:var(--radius-control)"></div><div class="t-caption">control · 8</div></div>
<div class="lbl"><div class="box" style="border-radius:var(--radius-card)"></div><div class="t-caption">card · 12</div></div>
<div class="lbl"><div class="box" style="border-radius:var(--radius-card);box-shadow:var(--shadow-card);border-color:var(--border)"></div><div class="t-caption">shadow-card</div></div>
<div class="lbl"><div class="box" style="border-radius:var(--radius-card);box-shadow:var(--shadow-sheet)"></div><div class="t-caption">shadow-sheet</div></div>
</div></body></html>
