<!-- @dsCard group="Components" viewport="760x460" name="Navigation — AppShell & Tabs" subtitle="Kerangka admin sidebar + tab pill/underline" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%;margin:0}#root{height:460px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { AppShell, Tabs, StatCard, Icon } = window.LumiPOSDesignSystem_dae7d1;
function Demo(){
  const [active,setActive]=React.useState('dashboard');
  const [tab,setTab]=React.useState('roster');
  const [t2,setT2]=React.useState('Users');
  return (
    <AppShell brand={{name:'The Cafe by ORIGEN'}} user={{name:'Super Admin User',role:'Super Admin'}}
      active={active} onNavigate={setActive} breadcrumb="Dashboard"
      nav={[
        {items:[{id:'dashboard',label:'Dashboard',icon:'dashboard'}]},
        {group:'Operations',items:[{id:'pos',label:'Open Register (POS)',icon:'register'},{id:'kds',label:'Kitchen Display',icon:'chef'}]},
        {group:'Tables',items:[{id:'table-mon',label:'Table Monitoring',icon:'table'},{id:'table-mgmt',label:'Table Management',icon:'table'}]},
      ]}>
      <div className="stack" style={{gap:16}}>
        <Tabs value={tab} onChange={setTab} tabs={[{value:'roster',label:'Roster Board'},{value:'swap',label:'Swap Requests',badge:0}]} />
        <Tabs variant="underline" value={t2} onChange={setT2} tabs={['Users','Roles','Permissions']} />
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
          <StatCard label="Today" value="0" tone="violet" icon={<Icon name="calendar" size={16}/>} hint="Bookings for today" />
          <StatCard label="Seated" value="0" tone="success" icon={<Icon name="users" size={16}/>} hint="Currently at tables" />
          <StatCard label="Deposit" value="Rp 0" tone="accent" icon={<Icon name="receipt" size={16}/>} hint="Collected" />
        </div>
      </div>
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
