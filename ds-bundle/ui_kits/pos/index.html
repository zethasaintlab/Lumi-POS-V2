<!-- @dsCard group="POS App" viewport="1024x720" name="Lumi POS — kit interaktif (Kasir · KDS · Tutup Kas · Laporan)" subtitle="Empat konteks fisik, satu codebase" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumi POS — UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; }
  .kit { display: flex; flex-direction: column; height: 100vh; }
  .nav { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); background: var(--surface); border-bottom: 1px solid var(--border); flex: none; }
  .nav .brand { font-weight: 600; letter-spacing: -0.02em; color: var(--accent); margin-right: var(--space-2); }
  .nav .brand span { color: var(--ink); }
  .nav button { min-height: 38px; padding: 0 var(--space-3); border: 1px solid var(--border); background: var(--surface); border-radius: 999px; font-family: inherit; font-size: var(--text-body); color: var(--ink-muted); cursor: pointer; white-space: nowrap; }
  .nav button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .nav .vp { margin-left: auto; }
  .stage { flex: 1; min-height: 0; overflow: auto; background: var(--surface-sunk); }
  /* Laporan responsive grid */
  .lap-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); }
  .lap-grid2 { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
  @media (min-width: 720px) { .lap-kpis { grid-template-columns: repeat(4, 1fr); } .lap-grid2 { grid-template-columns: 3fr 2fr; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="KasirScreen.jsx"></script>
<script type="text/babel" src="KdsScreen.jsx"></script>
<script type="text/babel" src="TutupKasScreen.jsx"></script>
<script type="text/babel" src="LaporanScreen.jsx"></script>
<script type="text/babel">
const SCREENS = [
  { id: 'kasir', label: 'Kasir', vp: 'Tablet counter · 1024×768', Comp: () => window.KasirScreen },
  { id: 'kds', label: 'Kitchen Display', vp: 'Monitor dapur · 1920×1080', Comp: () => window.KdsScreen },
  { id: 'tutup', label: 'Tutup Kas', vp: 'Tablet & HP', Comp: () => window.TutupKasScreen },
  { id: 'laporan', label: 'Laporan', vp: 'HP owner · 390×844', Comp: () => window.LaporanScreen },
];
function Kit() {
  const [active, setActive] = React.useState('kasir');
  const cur = SCREENS.find((s) => s.id === active);
  const Screen = cur.Comp();
  return (
    <div className="kit">
      <nav className="nav">
        <span className="brand">Lumi<span> POS</span></span>
        {SCREENS.map((s) => (
          <button key={s.id} aria-pressed={active === s.id} onClick={() => setActive(s.id)}>{s.label}</button>
        ))}
        <span className="vp t-caption">{cur.vp}</span>
      </nav>
      <div className="stage">{Screen ? <Screen /> : null}</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Kit />);
</script>
</body>
</html>
