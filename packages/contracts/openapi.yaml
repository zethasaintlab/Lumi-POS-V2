                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModifierList'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists/{modifierListId}:
    get:
      operationId: getModifierList
      parameters:
        - name: modifierListId
          in: path
