openapi: 3.0.0
info:
  title: Lumi POS API
  version: 0.0.1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer }
                colorHint: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang, atau parentId tidak valid (mis. string kosong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: parentId merujuk ke kategori yang tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Kategori tingkat ketiga ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listCategories
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}:
    get:
      operationId: getCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer }
                colorHint: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang, atau parentId tidak valid (mis. string kosong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Kategori tingkat ketiga ditolak, atau kategori dijadikan induk dirinya sendiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/archive:
    post:
      operationId: archiveCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/restore:
    post:
      operationId: restoreCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Category:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        sortOrder: { type: integer }
        colorHint: { type: string, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
