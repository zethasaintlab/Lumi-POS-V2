        lineTotal: { type: integer }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        # bigint 57-bit -- lihat komentar hlc di createOrder request body.
        hlc: { type: string }
