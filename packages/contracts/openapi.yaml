openapi: 3.0.0
info:
  title: Lumi POS API
  version: 0.0.1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string

  /tenants:
    post:
      operationId: registerTenant
      summary: >-
        F5 -- pendaftaran merchant mandiri. Membuat tenant, profil vertikal
        default, outlet pertama, dan pengguna owner beserta passwordnya dalam
        SATU transaksi.
      description: >-
        Endpoint KEDUA di API ini yang tidak menuntut `X-Tenant-Id`, setelah
        webhook Midtrans -- dan alasannya berbeda: tenantnya belum ada, jadi
        tidak ada nilai yang benar untuk header itu. `X-Actor-Id` juga tidak
        diminta; aktor pertama adalah owner yang dibuat request ini.


        Seluruh penulisan tetap terjadi di dalam transaksi ber-`SET LOCAL
        app.tenant_id` -- invariant #8 tidak dilonggarkan. `tenant` adalah
        satu-satunya tabel yang dikecualikan RLS, dan itulah yang membuat
        baris pertama dapat ditulis sebelum ada apa pun untuk di-scope.


        ⛔ Belum ada rate limit maupun verifikasi email. Keduanya wajib
        ditutup sebelum merchant berbayar pertama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, outlet, owner]
              properties:
                tenant:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: string
                      minLength: 1
                      description: >-
                        Di-generate klien (konvensi ID repo ini). Ia sekaligus
                        satu-satunya idempotensi endpoint ini: id yang sama
                        diulang menjawab 409, bukan tenant kedua.
                    name: { type: string, minLength: 1 }
                outlet:
                  type: object
                  required: [id, name, timezone]
                  properties:
                    id: { type: string, minLength: 1 }
                    name: { type: string, minLength: 1 }
                    timezone:
                      type: string
                      enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
                    address: { type: string, nullable: true }
                owner:
                  type: object
                  required: [id, name, email, password]
                  properties:
                    id: { type: string, minLength: 1 }
                    name: { type: string, minLength: 1 }
                    email:
                      type: string
                      minLength: 1
                      description: >-
                        Dipakai `POST /auth/login`. Tidak diverifikasi
                        kepemilikannya -- utang yang dicatat, bukan yang
                        didiamkan.
                    password:
                      type: string
                      description: >-
                        FR-F2b -- minimal 10 karakter, ditolak bila ada di
                        daftar bocor yang di-bundle. Aturannya SATU, dibagi
                        dengan `PATCH /users/{userId}/password` lewat
                        `packages/domain/src/password.ts`.
      responses:
        '201':
          description: Tenant, outlet, dan owner tercipta.
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, outletId, ownerId, plan, kuota]
                properties:
                  tenantId: { type: string }
                  outletId: { type: string }
                  ownerId: { type: string }
                  plan:
                    type: string
                    description: >-
                      SELALU `free`. Paket TIDAK diterima dari body -- endpoint
                      ini tidak terautentikasi, jadi paket yang dapat dipilih
                      pemanggil berarti siapa pun memberi dirinya kuota tanpa
                      batas lewat satu field JSON.
                  kuota:
                    type: object
                    description: >-
                      Kuota yang berlaku, dikembalikan supaya merchant melihat
                      batasnya di layar pertama -- bukan saat operasi ditolak.
                      `null` berarti tanpa batas.
                    properties:
                      maxOutlets: { type: integer, nullable: true }
                      maxDevices: { type: integer, nullable: true }
                      maxUsers: { type: integer, nullable: true }
                      maxProducts: { type: integer, nullable: true }
        '400':
          description: >-
            Payload tidak valid, atau password tidak memenuhi FR-F2b
            (PASSWORD_TOO_SHORT / PASSWORD_BREACHED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            id tenant, outlet, atau owner sudah dipakai (ID_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tenants/usage:
    get:
      operationId: getTenantUsage
      summary: >-
        Pemakaian nyata versus kuota. Data untuk layar B-29 "Langganan &
        Batas" (IA:169).
      description: >-
        `research/09` § "Implikasi untuk IA": peringatan kuota mendekati batas
        harus muncul di dashboard owner, BUKAN hanya saat operasi ditolak.


        ⛔ Setiap angka `terpakai` dihitung fungsi yang SAMA PERSIS dengan
        yang dipakai titik penegakannya. Salinan query akan menyimpang pada
        aturan arsip, dan gejalanya adalah merchant yang melihat "12 dari 200"
        lalu ditolak karena kuota penuh.


        Owner-only: `spec-f:52` menandai "Billing & langganan" hanya untuk
        Owner.
      responses:
        '200':
          description: Pemakaian dan batas per dimensi kuota.
          content:
            application/json:
              schema:
                type: object
                required: [plan, status, kuota]
                properties:
                  plan:
                    type: string
                    enum: [free, standard, pro, enterprise]
                  status:
                    type: string
                    enum: [active, suspended, cancelled]
                  kuota:
                    type: object
                    description: >-
                      Satu entri per dimensi di `DIMENSI_KUOTA`. Nama
                      dimensinya sengaja SAMA dengan yang dipakai penegakan,
                      supaya layar dan server tidak punya dua kosakata.
                      `batas: null` berarti tanpa batas -- bukan nol, dan
                      bukan angka besar.
                    properties:
                      outlet: { $ref: '#/components/schemas/PemakaianKuota' }
                      device: { $ref: '#/components/schemas/PemakaianKuota' }
                      pengguna: { $ref: '#/components/schemas/PemakaianKuota' }
                      produk: { $ref: '#/components/schemas/PemakaianKuota' }
        '403':
          description: Aktor bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /outlets:
    post:
      operationId: createOutlet
      summary: >-
        Outlet kedua dan seterusnya. Outlet PERTAMA lahir bersama tenant di
        `POST /tenants` -- tenant tanpa outlet tidak dapat berjualan sama
        sekali, jadi ia tidak pernah ada sebagai keadaan yang sah.
      description: >-
        Titik penegakan `max_outlets` (research/09 § 6). Owner-only:
        `spec-f:29` memberi Owner "membuat outlet" dan `spec-f:30` menaruhnya
        di kolom yang TIDAK BOLEH milik Manajer Area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, timezone]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                timezone:
                  type: string
                  enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
                address: { type: string, nullable: true }
                verticalProfileId:
                  type: string
                  nullable: true
                  description: >-
                    Dikosongkan berarti mewarisi default tenant (OQ-09,
                    resolusi `COALESCE(profil_outlet, default_tenant)`).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  timezone: { type: string }
        '400':
          description: Payload tidak valid, atau zona waktu di luar daftar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Aktor bukan Owner (FORBIDDEN), atau kuota `max_outlets` paket ini
            sudah penuh (QUOTA_EXCEEDED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau profil vertikal tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: id sudah dipakai (ID_ALREADY_EXISTS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                colorHint: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: >-
            Header X-Tenant-Id hilang, parentId tidak valid (mis. string
            kosong), atau X-Tenant-Id tidak dikenal (UNKNOWN_TENANT -- FK ke
            tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: parentId merujuk ke kategori yang tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Kategori tingkat ketiga ditolak, atau id sudah dipakai kategori
            lain (ID_ALREADY_EXISTS -- retry offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listCategories
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}:
    get:
      operationId: getCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                colorHint: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang, atau parentId tidak valid (mis. string kosong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Kategori tingkat ketiga ditolak, atau kategori dijadikan induk dirinya sendiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/archive:
    post:
      operationId: archiveCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/restore:
    post:
      operationId: restoreCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # FR-A8 — impor katalog. `spec-a:254`: fitur AKUISISI, bukan utilitas admin.
  #
  # SATU operasi dengan `dryRun`, bukan dua endpoint. Alurnya di `spec-a:261`
  # menuntut pratinjau SEBELUM impor dijalankan, dan pratinjau yang memakai
  # endpoint berbeda dapat menyimpang dari yang benar-benar dijalankan —
  # merchant menyetujui satu hasil lalu menerima hasil lain.
  /catalog/import:
    post:
      operationId: importCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  description: Isi berkas CSV apa adanya, termasuk baris header.
                dryRun:
                  type: boolean
                  default: true
                  description: >-
                    `true` (bawaan) hanya menghitung dan melaporkan; tidak satu
                    baris pun ditulis. Bawaannya sengaja aman: impor yang
                    berjalan karena field lupa diisi tidak dapat dibatalkan.
                bilaSudahAda:
                  type: string
                  enum: [lewati, perbarui]
                  default: lewati
                  description: >-
                    Ditanyakan SEKALI di awal (spec-a:280), bukan per baris.
      responses:
        '200':
          description: >-
            Pratinjau atau ringkasan impor. Selalu 200 walau ada baris
            bermasalah -- baris bermasalah adalah HASIL yang dilaporkan, bukan
            kegagalan permintaan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: >-
            Berkas tidak dapat dibaca sama sekali (IMPORT_FILE_INVALID) --
            misalnya kolom nama/harga tidak ditemukan di baris pertama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aktor pada X-Actor-Id tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, variations]
              properties:
                id: { type: string }
                name: { type: string }
                categoryId: { type: string, nullable: true }
                description: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                variations:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ItemVariationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: >-
            Header X-Tenant-Id hilang, item tanpa variation (ITEM_NO_VARIATION),
            harga/cost variation tidak valid (VALIDATION_ERROR), atau
            X-Tenant-Id tidak dikenal (UNKNOWN_TENANT -- FK ke tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            categoryId tidak ditemukan atau bukan milik tenant pemanggil (RLS
            menyembunyikan kategori tenant lain, bukan hanya menolak akses)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Barcode duplikat, batas 250 variation per item tercapai, atau id
            (item atau variation pertamanya) sudah dipakai (ID_ALREADY_EXISTS
            -- retry offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listItems
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
        - name: categoryId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                categoryId: { type: string, nullable: true }
                description: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Item tidak ditemukan, atau categoryId tidak ditemukan/bukan milik
            tenant pemanggil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/archive:
    post:
      operationId: archiveItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/restore:
    post:
      operationId: restoreItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations:
    post:
      operationId: createItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemVariationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVariation'
        '400':
          description: Header X-Tenant-Id hilang, atau harga/cost tidak valid (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Item tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Batas 250 variation per item tercapai, barcode duplikat, atau id
            sudah dipakai variation lain (ID_ALREADY_EXISTS -- retry offline
            dengan id yang sama, dibedakan dari BARCODE_DUPLICATE lewat
            err.constraint di server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}:
    patch:
      operationId: updateItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                sku: { type: string, nullable: true }
                barcode: { type: string, nullable: true }
                trackStock: { type: boolean }
                stockingUnit: { type: string }
                sellingUnit: { type: string }
                conversionFactor: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVariation'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Barcode duplikat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}/archive:
    post:
      operationId: archiveItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVariation'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}/restore:
    post:
      operationId: restoreItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
