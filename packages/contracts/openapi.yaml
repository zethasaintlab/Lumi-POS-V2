              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists/{modifierListId}/modifiers/{modifierId}/archive:
    post:
      operationId: archiveModifier
      parameters:
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
        - name: modifierId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modifier'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists/{modifierListId}/modifiers/{modifierId}/restore:
    post:
      operationId: restoreModifier
      parameters:
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
        - name: modifierId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modifier'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/modifier-lists/{modifierListId}:
    post:
      operationId: attachModifierList
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, itemId, modifierListId, sortOrder]
                properties:
                  # Surrogate key yang dituntut PowerSync untuk raw table
                  # (migrasi 0018). Di-generate server -- tabel ini tidak
                  # pernah ditulis offline. Kunci alaminya tetap pasangan
                  # (itemId, modifierListId), dan URL endpoint ini tetap
                  # di-key oleh pasangan itu, bukan oleh id.
                  #
                  # Attach ulang mengembalikan id yang SAMA.
                  id: { type: string }
                  itemId: { type: string }
                  modifierListId: { type: string }
                  sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Item atau ModifierList tidak ditemukan atau bukan milik tenant
            pemanggil (RLS menyembunyikan baris tenant lain, bukan hanya
            menolak akses -- FK ke item(id)/modifier_list(id) tidak tunduk
            RLS, jadi visibilitas dicek eksplisit sebelum INSERT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: detachModifierList
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: >-
            No content. Dikembalikan tanpa syarat -- pasangan ada atau tidak,
            milik tenant pemanggil atau tenant lain -- supaya tidak jadi
            oracle keberadaan lintas tenant. RLS (tenant_delete policy) sudah
            memastikan DELETE hanya pernah mengenai baris milik tenant
            pemanggil.
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: login
      summary: >-
        FR-F2b. Email + password untuk back-office. Kasir TIDAK dilayani di
        sini (spec-f:150) -- pencarian menyaring password_hash IS NOT NULL,
        jadi PIN tidak dapat dipakai sebagai password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, nullable: true }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt, userId, nama, tenantId, roles]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
                  userId: { type: string }
                  # ⛔ WAJIB ada di sini, bukan hanya di handler. Skema respons
                  # OpenAPI MEMBUANG properti yang tidak terdaftar — persis
                  # cacat yang membuat `margin` tiba `undefined` di B-17. Tanpa
                  # baris ini, `nama` dikirim server dan hilang di kabel.
                  #
                  # Tanpa `nama`, back-office menampilkan UUID mentah sebagai
                  # nama pengguna di pojok layar ("fee9f9b5-5b0a-40..."), di
                  # setiap layar, sepanjang hari.
                  nama: { type: string }
                  tenantId:
                    type: string
                    description: >-
                      Tenant yang DIPAKAI sesi ini -- dari header bila dikirim,
                      hasil resolusi email bila tidak. Klien yang menghilangkan
                      `X-Tenant-Id` tidak punya cara lain mengetahuinya, dan ia
                      membutuhkannya di setiap permintaan berikutnya.
                  roles: { type: array, items: { type: string } }
        '401':
          description: >-
            Email atau password salah. SATU pesan untuk semua sebab --
            selisih apa pun adalah oracle enumerasi email (spec-f:148).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Sesi diakhiri. Barisnya dihapus, bukan ditandai.
        '401':
          description: Sesi tidak sah atau sudah berakhir
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}/password:
    put:
      operationId: setUserPassword
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204':
          description: Password diperbarui
        '400':
          description: >-
            Kurang dari 10 karakter (PASSWORD_TOO_SHORT) atau ada di daftar
            bocor yang di-bundle (PASSWORD_BREACHED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users:
    get:
      operationId: listUsers
      summary: Daftar pengguna tenant ini, untuk layar B-27 Pengguna & Peran.
      description: >-
        Pengguna yang DINONAKTIFKAN ikut, dengan isActive false -- baris
        "user" tidak pernah dihapus karena audit trail menunjuknya.


        hasPin menyatakan APAKAH PIN sudah disetel, bukan nilainya. Tanpa PIN,
        pengguna tidak dapat membuka aplikasi kasir sama sekali.
      responses:
        '200':
          description: Daftar pengguna, aktif lebih dulu lalu urut nama.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, isActive, hasPin, roles, outletIds]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    email: { type: string, nullable: true }
                    isActive: { type: boolean }
                    hasPin: { type: boolean }
                    roles: { type: array, items: { type: string } }
                    outletIds: { type: array, items: { type: string } }
        '403':
          description: Aktor tidak berhak mengelola pengguna.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createUser
      summary: >-
        FR-F2 -- membuat pengguna beserta peran dan keanggotaan outletnya.
        Ketiganya SATU transaksi: pengguna tanpa peran dan tanpa outlet tidak
        dapat melakukan apa pun dan tidak terlihat perangkat mana pun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, roles, outletIds]
              properties:
                id: { type: string }
                name: { type: string, minLength: 1 }
                email: { type: string, nullable: true }
                birthDate:
                  type: string
                  nullable: true
                  description: >-
                    YYYY-MM-DD. Dipakai menolak PIN berupa tanggal lahir
                    (spec-f:135). Aturannya bersyarat -- tanpa nilai ini,
                    pemeriksaan itu tidak berjalan.
                roles:
                  type: array
                  items:
                    type: object
                    required: [role, scopeType, scopeId]
                    properties:
                      role:
                        type: string
                        enum: [owner, area_manager, outlet_manager, cashier, accountant]
                      scopeType: { type: string, enum: [tenant, outlet] }
                      scopeId: { type: string }
                outletIds:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: >-
            Header X-Tenant-Id / X-Actor-Id hilang, payload tidak valid, atau
            cakupan peran dilampaui (ROLE_SCOPE_TOO_WIDE).


            spec-f:31 dan spec-f:32 memberi Manajer Outlet dan Kasir cakupan
            "Satu outlet". Lebih dari satu outletId untuk peran itu ditolak
            SEBELUM transaksi dibuka -- kasir yang terdaftar di dua outlet
            muncul di layar login kedua tablet dan penjualannya dapat
            dinisbatkan ke outlet yang tidak pernah ia tempati.


            outletId duplikat dihitung SEKALI; `[o1, o1]` adalah satu outlet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Aktor tidak berhak mengelola peran yang diminta. Manajer Outlet
            hanya boleh mengelola Kasir (spec-f:50).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            outletId tidak ditemukan atau bukan milik tenant pemanggil
            (OUTLET_NOT_FOUND) -- divalidasi lewat SELECT tunduk RLS, bukan FK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: id sudah dipakai (ID_ALREADY_EXISTS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}:
    patch:
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, nullable: true }
                isActive: { type: boolean }
                roles:
                  type: array
                  description: >-
                    FR-F1. Diganti SELURUHNYA bila dikirim; tidak dikirim
                    berarti tidak diubah. Sampai 24 Agustus 2026 peran hanya
                    dapat diberikan saat pengguna DIBUAT -- merchant tidak
                    dapat menaikkan kasir menjadi manajer outlet sama sekali.


                    ⛔ Penjaga yang sama dengan createUser berlaku, DITAMBAH
                    satu yang hanya ada di sini: peran LAMA target ikut
                    diperiksa. Tanpa itu, Manajer Outlet -- yang matriks
                    izinkan mengelola "kasir saja" -- dapat menurunkan seorang
                    Owner menjadi kasir, dan pemisahan tugas spec-f:91 runtuh
                    tanpa satu pun aturan terlihat dilanggar.
                  items:
                    type: object
                    required: [role, scopeType, scopeId]
                    properties:
                      role:
                        type: string
                        enum: [owner, area_manager, outlet_manager, cashier, accountant]
                      scopeType: { type: string, enum: [tenant, outlet] }
                      scopeId: { type: string }
                outletIds:
                  type: array
                  description: >-
                    Diganti seluruhnya bila dikirim. Cakupan peran diperiksa
                    terhadap daftar ini -- peran bercakupan satu outlet dengan
                    dua outlet ditolak ROLE_SCOPE_TOO_WIDE.
                  items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: >-
            Cakupan peran terlalu luas (ROLE_SCOPE_TOO_WIDE, spec-f:31).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Tidak berhak mengelola peran ini (FORBIDDEN, spec-f:50) -- berlaku
            untuk peran LAMA maupun BARU.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            Owner terakhir tidak dapat dinonaktifkan MAUPUN dicabut peran
            ownernya (LAST_OWNER, spec-f:425).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}/pin:
    put:
      operationId: setUserPin
      summary: >-
        FR-F2. PIN di-hash Argon2id dan disimpan dalam format PHC. Keunikan PIN
        per outlet ditegakkan APLIKASI -- UNIQUE(outlet_id, pin_hash) di ERD
        §3 mustahil, karena salt per pengguna membuat PIN identik menghasilkan
        hash berbeda (lihat migrasi 0019).
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
                isReset:
                  type: boolean
                  default: false
                  description: >-
                    Reset oleh manajer. Menyalakan pin_must_change: PIN yang
                    diketahui manajer tidak boleh berlaku selamanya
                    (spec-f:420).
      responses:
        '204':
          description: PIN diperbarui. Tanpa body -- tidak ada apa pun tentang PIN yang aman dikembalikan.
        '400':
          description: >-
            Bukan 6 digit (PIN_INVALID_SHAPE) atau termasuk pola lemah
            (PIN_TOO_WEAK -- pesan menyebut pola mana, spec-f:144)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            PIN sudah dipakai pengguna lain di outlet yang sama (PIN_TAKEN).
            Pesan TIDAK menyebut siapa -- itu akan memberi tahu pemanggil PIN
            siapa yang baru saja ia tebak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}/pin-attempts:
    post:
      operationId: recordPinAttempt
      summary: >-
        FR-F4. Perangkat melaporkan hasil percobaan PIN yang diverifikasinya
        secara LOKAL. Server memegang hitungan dan eskalasi supaya penguncian
        berlaku di seluruh perangkat outlet, bukan hanya di perangkat tempat
        PIN salah diketik.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [failed, succeeded] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [failedAttempts, lockedUntil, lockSeconds]
                properties:
                  failedAttempts: { type: integer }
                  lockedUntil: { type: string, format: date-time, nullable: true }
                  lockSeconds:
                    type: integer
                    nullable: true
                    description: 60 detik, atau 900 pada penguncian ketiga dalam satu jam (spec-f:229)
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /devices:
    get:
      operationId: listDevices
      summary: >-
        Daftar perangkat tenant ini, untuk layar B-28 Perangkat.
      description: >-
        Perangkat yang DICABUT tetap ikut, dengan `revokedAt` terisi.
        Perangkat tidak pernah dihapus -- `order.device_id` menunjuknya, dan
        riwayat penjualan harus tetap dapat menyebut perangkat mana yang
        membuatnya.


        ⛔ `token_hash` TIDAK PERNAH dikirim. Layar hanya perlu tahu APAKAH
        kredensial sudah diterbitkan (`adaKredensial`), bukan nilainya.
      responses:
        '200':
          description: Daftar perangkat, aktif lebih dulu lalu urut kode.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceRingkas' }
        '403':
          description: Aktor tidak berhak mengelola perangkat (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, code]
              properties:
                id: { type: string }
                outletId: { type: string }
                code: { type: string }
                name: { type: string, nullable: true }
                platform: { type: string, nullable: true }
                appVersion: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan atau bukan milik tenant pemanggil
            (OUTLET_NOT_FOUND) -- divalidasi lewat SELECT yang tunduk RLS,
            bukan FK (FK PostgreSQL tidak tunduk RLS, temuan F1 di CLAUDE.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Kode device sudah dipakai device aktif lain di outlet yang sama
            (CODE_TAKEN -- pesan menyebut device pemakai kode, dari SELECT
            tunduk RLS bukan detail error PostgreSQL), atau id sudah dipakai
            device lain (ID_ALREADY_EXISTS -- retry offline dengan id yang
            sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/credentials:
    post:
      operationId: issueDeviceCredentials
      summary: >-
        FR-F12 -- menerbitkan kredensial perangkat. Secret dikembalikan SEKALI;
        yang tersimpan hanya SHA-256-nya. Menerbitkan ulang mematikan yang lama.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, secret, expiresAt]
                properties:
                  deviceId: { type: string }
                  secret:
                    type: string
                    description: Rahasia perangkat. Tidak dapat dibaca lagi setelah respons ini.
                  expiresAt: { type: string, format: date-time }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Device tidak ditemukan atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/sync-token:
    post:
      operationId: issueSyncToken
      summary: >-
        FR-F12 -- menukar kredensial perangkat dengan JWT RS256 berumur pendek
        untuk PowerSync. `tenant_id` dan `outlet_id` adalah klaim TOP-LEVEL:
        `auth.parameter('x')` di sync rules membaca `payload.x`.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: Authorization
          in: header
          required: false
          description: >-
            'Bearer <secret perangkat>'. SENGAJA tidak `required` di skema:
            validator akan menjawab 400 untuk header yang hilang, dan 400
            berarti "permintaan cacat" sementara kredensial yang hilang
            berarti "buktikan siapa kamu". Handler yang menegakkannya, dengan
            401 -- pesan yang sama persis dengan secret yang salah, supaya
            tidak ada yang dapat menebak id perangkat dari beda respons.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, token]
                properties:
                  endpoint: { type: string }
                  token: { type: string }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Kredensial tidak sah, perangkat dicabut, atau kredensial kedaluwarsa
            (DEVICE_CREDENTIALS_EXPIRED). Satu pesan untuk semua sebab kecuali
            kedaluwarsa -- membedakannya memberi tahu penebak bahwa id-nya benar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Kunci penandatangan belum diatur di server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/features:
    get:
      operationId: getDeviceFeatures
      summary: >-
        `ARCH:358` -- fitur mana yang menyala untuk perangkat ini. Feature flag
        dan kill switch, per fitur per merchant, tanpa rilis.
      description: >-
        Dijawab sebagai BOOLEAN per fitur, bukan sebagai baris `feature_flag`.
        Perangkat tidak perlu tahu apakah keadaannya datang dari penyimpangan
        global, penyimpangan merchantnya, atau bawaan kode -- dan mengirimkan
        barisnya berarti mengirimkan `tenant_id` merchant lain ke perangkat.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: Authorization
          in: header
          required: false
          description: "'Bearer <secret perangkat>'. Tidak `required` -- kredensial hilang berarti 401, bukan 400."
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [fitur]
                properties:
                  fitur:
                    type: object
                    additionalProperties: { type: boolean }
                    description: >-
                      Kunci dari `packages/domain/src/fitur.ts`. Fitur yang
                      dihapus dari daftar berhenti muncul di sini; perangkat
                      yang belum diperbarui membacanya lewat bawaan kodenya
                      sendiri.
        '401':
          description: Kredensial perangkat tidak sah, dicabut, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/update:
    get:
      operationId: getDeviceUpdate
      summary: >-
        F6 -- versi mana yang seharusnya dipakai perangkat ini, dan boleh
        dipasang sekarang atau tidak (`ARCH:§12`, KEP-36). Ia MEMUTUSKAN,
        tidak memasang: pemasangannya menuntut shell Tauri (utang F4).
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: Authorization
          in: header
          required: false
          description: "'Bearer <secret perangkat>'. Tidak `required` -- kredensial hilang berarti 401, bukan 400."
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [versi, pasangSekarang, bolehTunda, alasan]
                properties:
                  versi:
                    type: string
                    nullable: true
                    description: Versi yang seharusnya, atau null.
                  pasangSekarang: { type: boolean }
                  bolehTunda: { type: boolean }
                  alasan:
                    type: string
                    enum:
                      - tidak_ada_rilis
                      - sudah_terbaru
                      - belum_giliran
                      - di_luar_jendela
                      - wajib_segera
                      - terjadwal
                    description: >-
                      Kode, bukan kalimat. Layar yang menerjemahkannya --
                      kalimat yang lahir di server tidak dapat diterjemahkan
                      ulang.
                  sisaTunda: { type: integer }
                  jamLokal:
                    type: integer
                    description: Jam lokal outlet dari jam DATABASE, bukan jam Node.
                  jendela:
                    type: object
                    properties:
                      mulaiJam: { type: integer }
                      selesaiJam: { type: integer }
        '401':
          description: Kredensial perangkat tidak sah, dicabut, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Outlet perangkat tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/update/defer:
    post:
      operationId: deferDeviceUpdate
      summary: >-
        Merchant menekan "nanti saja". Maksimal 2x per versi (KEP-36);
        pembaruan wajib segera tidak dapat ditunda sama sekali.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: Authorization
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Penundaan tercatat
          content:
            application/json:
              schema:
                type: object
                required: [versi, sudahTunda, sisaTunda]
                properties:
                  versi: { type: string }
                  sudahTunda: { type: integer }
                  sisaTunda: { type: integer }
        '401':
          description: Kredensial perangkat tidak sah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Tidak ada rilis aktif (NO_ACTIVE_RELEASE), jatah penundaan habis,
            atau pembaruan wajib segera (DEFERRAL_NOT_ALLOWED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/telemetry:
    post:
      operationId: ingestDeviceTelemetry
      summary: >-
        F6 -- ingest telemetri klien (`ARCH:294` § 10). Lima dari delapan
        metrik `ARCH:296` tidak dapat dihasilkan server; ini jalan masuknya.
        BATAS ETIS `ARCH:309` ditegakkan di skema ini: daftar event TERTUTUP,
        nilai wajib angka, dan tidak ada satu pun properti bebas.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: Authorization
          in: header
          required: false
          description: >-
            'Bearer <secret perangkat>'. SENGAJA tidak `required`: validator
            akan menjawab 400 untuk header yang hilang, dan kredensial yang
            hilang berarti 401.
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windowStart, windowEnd, events]
              additionalProperties: false
              properties:
                appVersion:
                  type: string
                  description: >-
                    Versi aplikasi saat jendela ini DIUKUR -- bukan versi
                    perangkat sekarang. `ARCH:302` memakai crash rate per
                    versi sebagai gate rollout.
                windowStart: { type: string, format: date-time }
                windowEnd: { type: string, format: date-time }
                events:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [event, count, total, min, max, p95]
                    additionalProperties: false
                    properties:
                      event:
                        type: string
                        enum:
                          - latensi_keranjang_ms
                          - umur_antrean_jam
                          - antrean_gagal
                          - cetak_percobaan
                          - offline_detik
                          - selisih_jam_detik
                          - crash
                      type:
                        type: string
                        nullable: true
                        description: >-
                          Tipe error, BUKAN pesannya. SENGAJA tanpa `maxLength`:
                          server MEMOTONG di 64 karakter alih-alih menolak, dan
                          `maxLength` di sini akan menolak seluruh muatan --
                          membuang metrik yang baik bersama satu label yang
                          kepanjangan.
                      count: { type: integer, minimum: 1 }
                      total: { type: number }
                      min: { type: number }
                      max: { type: number }
                      p95: { type: number }
      responses:
        '202':
          description: >-
            Diterima dan disimpan. 202 dan bukan 201 -- barisnya agregat,
            bukan entitas yang punya alamat.
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, diterima]
                properties:
                  deviceId: { type: string }
                  diterima: { type: integer }
        '400':
          description: Muatan cacat, atau Idempotency-Key hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Kredensial perangkat tidak sah, dicabut, atau kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Idempotency-Key sedang diproses permintaan lain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: getDeviceTelemetry
      summary: >-
        Ringkasan telemetri satu perangkat (B-28). TIDAK lintas-tenant --
        ambang alarm operasional menuntut pembaca ber-BYPASSRLS, lihat
        `apps/server/src/metrik.ts`.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: sejak
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, events]
                properties:
                  deviceId: { type: string }
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event: { type: string }
                        type: { type: string, nullable: true }
                        count: { type: integer }
                        total: { type: number }
                        min: { type: number }
                        max: { type: number }
                        p95Terburuk:
                          type: number
                          description: >-
                            MAX dari p95 tiap jendela, bukan p95 dari p95 --
                            persentil tidak dapat dirata-ratakan.
                        terakhirPada: { type: string, format: date-time }
        '404':
          description: Perangkat tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: >-
        Kunci publik untuk memverifikasi token sinkronisasi. Dilayani tanpa
        tenant dan tanpa kredensial -- ia memang publik.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }
        '503':
          description: Kunci penandatangan belum diatur di server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      parameters:
