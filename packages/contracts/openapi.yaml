          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}/pin:
    put:
      operationId: setUserPin
      summary: >-
        FR-F2. PIN di-hash Argon2id dan disimpan dalam format PHC. Keunikan PIN
        per outlet ditegakkan APLIKASI -- UNIQUE(outlet_id, pin_hash) di ERD
        §3 mustahil, karena salt per pengguna membuat PIN identik menghasilkan
        hash berbeda (lihat migrasi 0019).
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
                isReset:
                  type: boolean
                  default: false
                  description: >-
                    Reset oleh manajer. Menyalakan pin_must_change: PIN yang
                    diketahui manajer tidak boleh berlaku selamanya
                    (spec-f:420).
      responses:
        '204':
          description: PIN diperbarui. Tanpa body -- tidak ada apa pun tentang PIN yang aman dikembalikan.
        '400':
          description: >-
            Bukan 6 digit (PIN_INVALID_SHAPE) atau termasuk pola lemah
            (PIN_TOO_WEAK -- pesan menyebut pola mana, spec-f:144)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            PIN sudah dipakai pengguna lain di outlet yang sama (PIN_TAKEN).
            Pesan TIDAK menyebut siapa -- itu akan memberi tahu pemanggil PIN
            siapa yang baru saja ia tebak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}/pin-attempts:
    post:
      operationId: recordPinAttempt
      summary: >-
        FR-F4. Perangkat melaporkan hasil percobaan PIN yang diverifikasinya
        secara LOKAL. Server memegang hitungan dan eskalasi supaya penguncian
        berlaku di seluruh perangkat outlet, bukan hanya di perangkat tempat
        PIN salah diketik.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [failed, succeeded] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [failedAttempts, lockedUntil, lockSeconds]
                properties:
                  failedAttempts: { type: integer }
                  lockedUntil: { type: string, format: date-time, nullable: true }
                  lockSeconds:
                    type: integer
                    nullable: true
                    description: 60 detik, atau 900 pada penguncian ketiga dalam satu jam (spec-f:229)
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /devices:
    get:
      operationId: listDevices
      summary: >-
        Daftar perangkat tenant ini, untuk layar B-28 Perangkat.
      description: >-
        Perangkat yang DICABUT tetap ikut, dengan `revokedAt` terisi.
        Perangkat tidak pernah dihapus -- `order.device_id` menunjuknya, dan
        riwayat penjualan harus tetap dapat menyebut perangkat mana yang
        membuatnya.


        ⛔ `token_hash` TIDAK PERNAH dikirim. Layar hanya perlu tahu APAKAH
        kredensial sudah diterbitkan (`adaKredensial`), bukan nilainya.
      responses:
        '200':
          description: Daftar perangkat, aktif lebih dulu lalu urut kode.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceRingkas' }
        '403':
          description: Aktor tidak berhak mengelola perangkat (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, code]
              properties:
                id: { type: string }
                outletId: { type: string }
                code: { type: string }
                name: { type: string, nullable: true }
                platform: { type: string, nullable: true }
                appVersion: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan atau bukan milik tenant pemanggil
            (OUTLET_NOT_FOUND) -- divalidasi lewat SELECT yang tunduk RLS,
            bukan FK (FK PostgreSQL tidak tunduk RLS, temuan F1 di CLAUDE.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Kode device sudah dipakai device aktif lain di outlet yang sama
            (CODE_TAKEN -- pesan menyebut device pemakai kode, dari SELECT
            tunduk RLS bukan detail error PostgreSQL), atau id sudah dipakai
            device lain (ID_ALREADY_EXISTS -- retry offline dengan id yang
            sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/credentials:
    post:
      operationId: issueDeviceCredentials
      summary: >-
        FR-F12 -- menerbitkan kredensial perangkat. Secret dikembalikan SEKALI;
        yang tersimpan hanya SHA-256-nya. Menerbitkan ulang mematikan yang lama.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, secret, expiresAt]
                properties:
                  deviceId: { type: string }
                  secret:
                    type: string
                    description: Rahasia perangkat. Tidak dapat dibaca lagi setelah respons ini.
                  expiresAt: { type: string, format: date-time }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Device tidak ditemukan atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/sync-token:
    post:
      operationId: issueSyncToken
      summary: >-
        FR-F12 -- menukar kredensial perangkat dengan JWT RS256 berumur pendek
        untuk PowerSync. `tenant_id` dan `outlet_id` adalah klaim TOP-LEVEL:
        `auth.parameter('x')` di sync rules membaca `payload.x`.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: Authorization
          in: header
          required: false
          description: >-
            'Bearer <secret perangkat>'. SENGAJA tidak `required` di skema:
            validator akan menjawab 400 untuk header yang hilang, dan 400
            berarti "permintaan cacat" sementara kredensial yang hilang
            berarti "buktikan siapa kamu". Handler yang menegakkannya, dengan
            401 -- pesan yang sama persis dengan secret yang salah, supaya
            tidak ada yang dapat menebak id perangkat dari beda respons.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, token]
                properties:
                  endpoint: { type: string }
                  token: { type: string }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Kredensial tidak sah, perangkat dicabut, atau kredensial kedaluwarsa
            (DEVICE_CREDENTIALS_EXPIRED). Satu pesan untuk semua sebab kecuali
            kedaluwarsa -- membedakannya memberi tahu penebak bahwa id-nya benar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Kunci penandatangan belum diatur di server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: >-
        Kunci publik untuk memverifikasi token sinkronisasi. Dilayani tanpa
        tenant dan tanpa kredensial -- ia memang publik.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }
        '503':
          description: Kunci penandatangan belum diatur di server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Device tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /shifts:
    post:
      operationId: openShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, deviceId, businessDate, openingFloat]
              properties:
                id: { type: string }
                outletId: { type: string }
                deviceId: { type: string }
                businessDate: { type: string, format: date }
                # openingFloat SENGAJA tidak diberi `type`/`minimum` -- sama
                # seperti PriceInput.price di catalog, assertOpeningFloatValid
                # (apps/server/src/modules/cash/handlers/shifts.ts) adalah
                # satu-satunya sumber kebenaran untuk kode error ini.
                openingFloat: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          description: >-
            Header X-Tenant-Id atau X-Actor-Id hilang, atau openingFloat
            tidak valid (bilangan bulat rupiah >= 0, tidak melebihi
            Number.MAX_SAFE_INTEGER -- VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan (OUTLET_NOT_FOUND), deviceId tidak
            ditemukan atau sudah dicabut (DEVICE_NOT_FOUND), atau aktor
            tidak ditemukan/tidak aktif (ACTOR_NOT_FOUND) -- ketiganya
            divalidasi lewat SELECT yang tunduk RLS, bukan FK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Device ini sudah punya shift yang masih terbuka
            (SHIFT_ALREADY_OPEN -- ux_shift_one_open_per_device), atau id
            sudah dipakai shift lain (ID_ALREADY_EXISTS -- retry offline
            dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, deviceId, shiftId, receiptNumber, businessDate, sequence, channel, checkId, lines]
              properties:
                id: { type: string }
                outletId: { type: string }
                deviceId: { type: string }
                shiftId: { type: string }
                receiptNumber:
                  type: string
                  pattern: '^[A-Za-z0-9]+-\d{8}-\d+$'
                businessDate: { type: string, format: date }
                sequence: { type: integer, minimum: 1 }
                channel: { type: string, enum: [dine_in, takeaway] }
                # hlc SENGAJA type: string, bukan integer -- ia bilangan
                # 57-bit (packages/domain/src/hlc.ts) yang melebihi presisi
                # double JSON/JS. assertHlcValid (handlers/orders.ts) adalah
                # satu-satunya sumber kebenaran untuk bentuknya.
                hlc: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time, nullable: true }
                checkId: { type: string }
                # FR-H6 -- total yang DIHITUNG KLIEN. Opsional, dan tidak
                # pernah dipercaya: server tetap menghitung sendiri dan
                # menyimpan hitungannya. Nilai ini hanya dibandingkan, dan
                # selisihnya ditandai. Sengaja tanpa `type` --
                # assertClientTotalValid (handlers/orders.ts) satu-satunya
                # sumber kebenaran, pola sama dengan quantityMilli.
                #
                # Klien versi N-1 tidak mengirimnya, dan tidak boleh patah.
                total: {}
                lines:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OrderLineInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: >-
            Header X-Tenant-Id atau X-Actor-Id hilang; lines kosong (order
            DRAFT tidak pernah tersimpan, minItems: 1); quantityMilli,
            discountAmount, atau harga/quantityMilli modifier tidak valid;
            hlc bukan string bilangan bulat desimal; receiptNumber tidak
            cocok format PREFIX-YYYYMMDD-URUTAN; atau sequence bukan
            bilangan bulat positif (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan (OUTLET_NOT_FOUND), deviceId tidak
            ditemukan/sudah dicabut (DEVICE_NOT_FOUND), aktor tidak
            ditemukan/tidak aktif (ACTOR_NOT_FOUND), shiftId tidak ditemukan
            (SHIFT_NOT_FOUND), atau variationId salah satu baris tidak
            ditemukan (VARIATION_NOT_FOUND) -- kelimanya divalidasi lewat
            SELECT yang tunduk RLS, bukan FK (FK PostgreSQL tidak tunduk
            RLS, temuan F1 di CLAUDE.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            shiftId ditemukan tapi sudah tidak berstatus open
            (SHIFT_NOT_OPEN), shiftId bukan milik deviceId yang dikirim
            (SHIFT_DEVICE_MISMATCH), nomor struk bentrok untuk device dan
            tanggal bisnis yang sama (RECEIPT_SEQUENCE_TAKEN), atau id
            (order/check/salah satu line/salah satu modifier) sudah dipakai
            baris lain (ID_ALREADY_EXISTS -- termasuk checkId yang sudah
            dipakai order lain, FR-B12)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Order beserta check, seluruh order_line (snapshot item_name/
            variation_name/unit_price/cost_at_sale -- FR-B3, tidak
            terpengaruh perubahan katalog setelahnya), dan modifier
            bertingkat per line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/midtrans:
    post:
      operationId: midtransNotification
      summary: Notifikasi pembayaran dari Midtrans
      description: >-
        FR-C14. Satu-satunya endpoint di API ini yang TIDAK membawa
        `X-Tenant-Id` — Midtrans tidak tahu apa-apa soal tenant kami, dan
        tidak boleh tahu.


        Signature diverifikasi LEBIH DULU, sebelum satu query pun dijalankan:
        `SHA512(order_id + status_code + gross_amount + ServerKey)`. Tanpa itu
        siapa pun yang menemukan URL ini dapat menandai order mana pun lunas.


        Tenant dibaca dari `custom_field1` yang kami titipkan sendiri saat
        charge, lalu dipakai sebagai `app.tenant_id` — sehingga pencarian
        payment tetap tunduk RLS dan tenant yang dipalsukan tidak menemukan
        apa pun.


        Selalu dijawab `200` bila notifikasinya sah, termasuk saat tidak
        mengubah apa pun: Midtrans mengirim ulang notifikasi yang tidak
        dijawab 200, jadi menjawab error hanya membuatnya mengulang tanpa
        akhir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status_code, gross_amount, signature_key]
              properties:
                # `order_id` di Midtrans adalah id PAYMENT kami, bukan id
                # order: satu order dapat dibayar beberapa kali, dan memakai id
                # order akan membuat pembayaran kedua ditolak sebagai duplikat.
                order_id: { type: string }
                status_code: { type: string }
                gross_amount: { type: string }
                signature_key: { type: string }
                transaction_status: { type: string }
                custom_field1: { type: string }
      responses:
        '200':
          description: Notifikasi sah dan diproses (atau sudah pernah diproses).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        '401':
          description: >-
            Signature tidak sah (INVALID_SIGNATURE). Pesannya sengaja tidak
            menjelaskan bagian mana yang tidak cocok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Pembayaran tidak ditemukan (PAYMENT_NOT_FOUND). Termasuk
            notifikasi bertanda tangan sah yang tenant-nya tidak cocok —
            pencariannya tunduk RLS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            Kunci webhook tidak dikonfigurasi (WEBHOOK_NOT_CONFIGURED).
            Endpoint yang menerima notifikasi tanpa verifikasi jauh lebih
            berbahaya daripada endpoint yang mati.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}/check-status:
    post:
      operationId: checkPaymentStatus
      summary: Tanyakan status pembayaran ke gateway
      description: >-
        FR-C14. Ini SATU-SATUNYA jalan sebuah payment QRIS menjadi
        `confirmed` — spec-c:320 melarang sistem menandai lunas tanpa
        konfirmasi gateway, dan tidak ada jalur lain yang boleh melakukannya.


        POST, bukan GET: memanggilnya mengubah keadaan (status payment, dan
        — bila pembayaran melunasi — status order).


        Penjadwalan polling (tiap 2 detik, maksimal 5 menit) adalah perilaku
        KLIEN. Server hanya menyediakan pintunya. Payment yang statusnya sudah
        final dijawab tanpa menyentuh gateway sama sekali.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Keadaan payment setelah ditanyakan. `gatewayStatus` adalah jawaban
            gateway apa adanya dan `null` bila gateway tidak ditanyai;
            `expired` dan `failed` sama-sama tersimpan sebagai payment
            `failed`, jadi field ini yang memungkinkan klien mengatakan "QR
            kedaluwarsa" alih-alih "pembayaran gagal".
          content:
            application/json:
              schema:
                type: object
                required: [payment, order, outstanding]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  gatewayStatus:
                    type: string
                    nullable: true
                    enum: [pending, confirmed, failed, expired]
                  order:
                    type: object
                    required: [id, status, total]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      total: { type: integer }
                  outstanding: { type: integer }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            paymentId tidak ditemukan (PAYMENT_NOT_FOUND) — lewat SELECT yang
            tunduk RLS, jadi payment milik tenant lain juga menjawab ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Payment bukan metode gateway (PAYMENT_NOT_GATEWAY). Pembayaran
            tunai tidak punya gateway untuk ditanyai.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Batalkan transaksi — sistem menentukan void atau refund
      description: >-
        FR-B7. Kasir tidak memilih "void" atau "refund" (spec-b:235) —
        body TIDAK memuat nama operasi sama sekali. Server membacanya dari
        status order lewat `decideCancellation` (packages/domain), dan
        menyebutkan hasilnya di field `operation` supaya UI dapat
        menjelaskannya ke kasir.


        Order asli TIDAK di-UPDATE (AC FR-B7 pertama). Void menambah baris
        `order` berstatus `voided` yang `voidedByOrderId`-nya menunjuk order
        yang dibatalkan.


        Void berjalan TANPA X-Approver-Id — keputusan produk 1 Agustus 2026,
        override eksplisit terhadap research/08 §3. Header itu diabaikan bila
        dikirim. Refund (order CLOSED) akan menuntutnya, dan belum tersedia.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Hanya `id` dan `reasonCode` yang wajib di KONTRAK. Field mana
              # lagi yang wajib bergantung pada operasi yang DIPILIH SERVER
              # dari status order, dan JSON Schema tidak bisa menyatakan
              # "wajib bila server memutuskan X". Void menuntut
              # receiptNumber + sequence; refund menuntut amount + header
              # X-Approver-Id. Keduanya divalidasi di handler, pola yang sama
              # dengan seluruh validasi uang/kuantitas di repo ini.
              required: [id, reasonCode]
              properties:
                id:
                  type: string
                  description: >-
                    Id order PEMBATAL (void) atau id baris `refund` (refund),
                    di-generate klien (ULID/UUIDv7).
                receiptNumber:
                  type: string
                  pattern: '^[A-Za-z0-9]+-\d{8}-\d+$'
                  description: Void saja.
                sequence: { type: integer, minimum: 1, description: Void saja. }
                amount:
                  description: >-
                    Refund saja — nominal rupiah utuh yang dikembalikan.
                    Sengaja tanpa `type`: assertRefundAmountValid (handler)
                    satu-satunya sumber kebenaran, sama seperti
                    quantityMilli/discountAmount di POST /orders.
                lines:
                  type: array
                  description: >-
                    Refund parsial — baris mana yang dikembalikan stoknya
                    (spec-b:233). Dikosongkan berarti seluruh order.
                  items:
                    type: object
                    required: [lineId, quantityMilli]
                    properties:
                      lineId: { type: string }
                      quantityMilli: {}
                # Daftar TERTUTUP (spec-b:290) -- free text tidak dapat
                # diagregasi menjadi laporan fraud.
                #
                # Enum di sini adalah GABUNGAN daftar void dan refund, dan itu
                # sengaja lebih longgar daripada aturan sebenarnya: endpoint-nya
                # satu, sementara operasinya baru diketahui server dari status
                # order. Yang menolak `barang_rusak` pada void dan
                # `salah_input` pada refund adalah assertCancellationReason
                # (packages/domain) -- satu-satunya sumber kebenaran, dan yang
                # juga berlaku saat klien offline.
                reasonCode:
                  type: string
                  enum:
                    - salah_input
                    - pelanggan_batal
                    - item_habis
                    - uji_coba
                    - barang_rusak
                    - pesanan_salah
                    - pelanggan_tidak_puas
                    - kelebihan_bayar
                    - lainnya
                # Wajib >= 10 karakter bila reasonCode = lainnya (spec-b:296).
                # Aturan bersyarat itu tidak dinyatakan di sini -- ia ada di
                # domain, sama seperti seluruh validasi uang/kuantitas di repo
                # ini.
                reasonNote: { type: string, nullable: true }
                hlc: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: >-
            Order pembatal dibuat. `operation` menyebut operasi yang
            DIPILIH SERVER.
          content:
            application/json:
              schema:
                type: object
                required: [operation, cancelledOrderId]
                properties:
                  # `operation` menentukan field mana yang ada: `order` untuk
                  # void (baris order pembatal), `refund` untuk refund (baris
                  # refund). Refund TIDAK membuat order baru, dan TIDAK
                  # membuat payment negatif -- keputusan user 7 Agu 2026.
                  operation: { type: string, enum: [void, refund] }
                  cancelledOrderId: { type: string }
                  order: { $ref: '#/components/schemas/CancelledOrder' }
                  refund: { $ref: '#/components/schemas/Refund' }
        '400':
          description: >-
            Header X-Tenant-Id/X-Actor-Id atau Idempotency-Key hilang;
            reasonCode di luar daftar tertutup; reasonCode `lainnya` tanpa
            catatan minimal 10 karakter; atau hlc bukan string bilangan bulat
            desimal (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            orderId tidak ditemukan (NOT_FOUND) atau aktor tidak
            ditemukan/tidak aktif (ACTOR_NOT_FOUND) — keduanya lewat SELECT
            yang tunduk RLS, bukan FK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Order sudah pernah dibatalkan (ORDER_ALREADY_VOIDED); status
            order tidak mengizinkan pembatalan (ORDER_NOT_CANCELLABLE);
            nomor struk pembatal bentrok (RECEIPT_SEQUENCE_TAKEN); id
            pembatal sudah dipakai (ID_ALREADY_EXISTS); atau request dengan
            Idempotency-Key yang sama sedang diproses (IDEMPOTENCY_KEY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Idempotency-Key sudah dipakai untuk body yang berbeda
            (IDEMPOTENCY_KEY_HASH_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Order berstatus CLOSED, jadi operasinya refund — belum tersedia
            (NOT_IMPLEMENTED). Menolak lebih baik daripada mem-void
            penjualan sah dan mengeluarkannya dari omzet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/payments:
    post:
      operationId: createPayment
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Hanya `id` yang wajib di KONTRAK. Field mana lagi yang wajib
              # bergantung pada METODE, dan JSON Schema tidak bisa menyatakan
              # "wajib bila method = X" tanpa oneOf yang justru mengaburkan
              # pesan errornya. Tunai menuntut tenderedAmount; QRIS dinamis
              # menuntut amount. Keduanya divalidasi di handler, pola yang
              # sama dengan POST /orders/{orderId}/cancel.
              required: [id]
              properties:
                id: { type: string }
                method:
                  type: string
                  # Daftar TERTUTUP. `other` (voucher fisik, transfer) belum
                  # dibangun -- FR-C2 menuntut catatan wajib untuknya, dan
                  # menerimanya sebelum itu ada berarti membangun separuh
                  # FR-C2 tanpa pengaman yang menyertainya.
                  enum: [cash, qris_dynamic, qris_static, card_edc]
                  default: cash
                # tenderedAmount = uang yang DISERAHKAN pelanggan (tunai
                # saja), bukan yang terpakai. Server yang menghitung amount
                # dan changeAmount, karena keduanya bergantung pada pembulatan
                # tunai (FR-C9) yang ditentukan rounding_increment/
                # rounding_mode outlet. Tanpa `type` -- assertTenderedAmountValid
                # satu-satunya sumber kebenaran, pola sama dengan
                # PriceInput.price.
                tenderedAmount: {}
                # amount = nominal yang diminta ke gateway (QRIS dinamis).
                # Tidak ada uang yang diserahkan di tangan, jadi tidak ada
                # tendered maupun kembalian.
                amount: {}
                # --- QRIS statis (FR-C2) ---
                # WAJIB. Kontrol anti-fraud, bukan formalitas: QRIS statis
                # dikonfirmasi kasir TANPA verifikasi sistem apa pun, dan
                # berfungsi offline. Isinya nominal + 4 digit terakhir nomor
                # referensi, atau catatan.
                #
                # Ditolak bila memuat 13-19 digit berurutan (AC FR-C5 keempat)
                # -- itu bentuk nomor kartu.
                reference: { type: string, nullable: true }
                # --- EDC (FR-C4) ---
                # approvalCode WAJIB; cardLast4 opsional dan maksimal 4 DIGIT.
                # Tidak ada field mana pun di kontrak ini yang menerima nomor
                # kartu lengkap, dan itu permanen.
                approvalCode: { type: string, nullable: true }
                cardLast4: { type: string, nullable: true, maxLength: 4 }
                acquirer: { type: string, nullable: true }
                terminalReference: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time }
                hlc: { type: string }
      responses:
        '201':
          description: >-
            Pembayaran tercatat. Order berpindah ke CLOSED bila lunas
            (OPEN -> PAID -> CLOSED); tetap OPEN bila kurang bayar, dengan
            sisa tagihan di .
          content:
            application/json:
              schema:
                type: object
                required: [payment, order, outstanding]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  order:
                    type: object
                    required: [id, status, total, taxAmount, roundingAdjustment, amountDue]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      total: { type: integer }
                      taxAmount: { type: integer }
                      roundingAdjustment: { type: integer }
                      amountDue: { type: integer }
                  outstanding: { type: integer }
                  # --- QRIS dinamis saja (FR-C2, FR-C14) ---
                  # Wajib dideklarasikan di sini: serializer Fastify MEMBUANG
                  # properti yang tidak ada di skema, jadi field yang lupa
                  # ditulis akan hilang diam-diam dari respons -- bukan gagal,
                  # yang jauh lebih sulit dilacak.
                  #
                  # Kosong untuk pembayaran tunai.
                  qrString:
                    type: string
                    nullable: true
                    description: >-
                      Isi QR untuk dirender klien. `null` bila gateway tidak
                      dapat dihubungi — payment tetap tercatat
                      `pending_confirmation` (FR-C14).
                  expiresAt: { type: string, nullable: true }
                  # `false` berarti QR gagal diambil, BUKAN berarti pembayaran
                  # gagal. Pelanggan mungkin sudah membayar; klien menampilkan
                  # "Cek status", bukan "pembayaran gagal".
                  gatewayReachable: { type: boolean }
        '400':
          description: Validation error, metode belum didukung, atau Idempotency-Key hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Order tidak dalam status yang bisa dibayar, id sudah ada, atau key sedang diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tax-rates:
    post:
      operationId: createTaxRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRateInput'
      responses:
        '201':
          description: >-
            Tarif pajak dibuat. FR-C6 -- tarif adalah entitas berdata, bukan
            konstanta; perubahan perda menghasilkan record baru, yang lama
            diakhiri lewat POST /tax-rates/{id}/end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Outlet, item, atau kategori yang dirujuk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Id sudah ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listTaxRates
      responses:
        '200':
          description: Seluruh tarif pajak tenant, termasuk yang sudah diakhiri
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxRate'

  /tax-rates/{taxRateId}/end:
    post:
      operationId: endTaxRate
      parameters:
        - name: taxRateId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            effective_to diisi. Barisnya TIDAK dihapus (invariant #2) --
            transaksi historis tetap benar lewat snapshot di order_line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Payment:
      type: object
      required: [id, orderId, checkId, method, amount, status]
      properties:
        id: { type: string }
        orderId: { type: string }
        checkId: { type: string }
        method: { type: string }
        amount: { type: integer }
        tenderedAmount: { type: integer, nullable: true }
        changeAmount: { type: integer, nullable: true }
        status: { type: string }
        confirmedManually: { type: boolean }
        # Terisi hanya untuk metode yang lewat gateway (QRIS dinamis).
        # `providerReference` bisa NULL walau provider terisi: payment ditulis
        # SEBELUM gateway dipanggil, supaya ia tetap ada bila gateway tidak
        # menjawab (FR-C14).
        provider: { type: string, nullable: true }
        providerReference: { type: string, nullable: true }
        tenderedAt: { type: string, format: date-time }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        hlc: { type: string }
    TaxRate:
      type: object
      required: [id, name, type, rate, isInclusive, phase, channel, appliesTo, appliesToIds, effectiveFrom]
      properties:
        id: { type: string }
        outletId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string, enum: [pbjt, ppn, service_charge, none] }
        # `rate` adalah STRING desimal, bukan number. numeric(6,4) dikirim dan
        # diterima sebagai teks supaya tidak pernah melewati IEEE754 double di
        # sisi klien maupun server -- lihat packages/domain/src/numeric.ts.
        rate: { type: string }
        isInclusive: { type: boolean }
        phase: { type: string, enum: [subtotal, total] }
        jurisdiction: { type: string, nullable: true }
        channel: { type: string, enum: [all, dine_in, takeaway] }
        appliesTo: { type: string, enum: [all_items, category, item] }
        appliesToIds:
          type: array
          items: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
    TaxRateInput:
      type: object
      required: [id, name, type, rate]
      properties:
        id: { type: string }
        outletId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string }
        # SENGAJA tanpa `type` di sini: assertRateValid (lewat
        # parseRateToScaled) adalah satu-satunya sumber kebenaran, dan ia harus
        # bisa MENOLAK number. Mendeklarasikan `type: string` membuat AJV
        # menolaknya lebih dulu dengan jalur error yang berbeda; pola sama
        # dengan PriceInput.price.
        rate: {}
        isInclusive: { type: boolean }
        phase: { type: string }
        jurisdiction: { type: string, nullable: true }
        channel: { type: string }
        appliesTo: { type: string }
        appliesToIds:
          type: array
          items: { type: string }
        effectiveFrom: { type: string, format: date-time }
    User:
      type: object
      required: [id, name, isActive, roles, outletIds]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        isActive: { type: boolean }
        pinMustChange: { type: boolean }
        hasPin:
          type: boolean
          description: >-
            Apakah pengguna punya PIN. Hash-nya sendiri TIDAK pernah keluar
            lewat endpoint ini -- ia hanya turun lewat replikasi ke perangkat
            outlet tempat pengguna terdaftar (spec-f:124).
        roles:
          type: array
          items:
            type: object
            required: [role, scopeType, scopeId]
            properties:
              role: { type: string }
              scopeType: { type: string }
              scopeId: { type: string }
        outletIds:
          type: array
          items: { type: string }
    Device:
      type: object
      required: [id, outletId, code]
      properties:
        id: { type: string }
        outletId: { type: string }
        code: { type: string }
        name: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    Shift:
      type: object
      required: [id, outletId, deviceId, businessDate, status, openingFloat, openedBy, openedAt]
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [open, counting, closed] }
        openingFloat: { type: integer, minimum: 0 }
        openedBy: { type: string }
        openedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        colorHint: { type: string, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true }
    ItemVariation:
      type: object
      required: [id, itemId, name, price, sortOrder]
      properties:
        id: { type: string }
        itemId: { type: string }
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0 }
        stockingUnit: { type: string }
        sellingUnit: { type: string }
        conversionFactor: { type: number }
        trackStock: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
    Item:
      type: object
      required: [id, name, variations, modifierLists]
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string, nullable: true }
        description: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
        variations:
          type: array
          items:
            $ref: '#/components/schemas/ItemVariation'
        # FIX 5 (whole-branch review): attachModifierList/detachModifierList
        # existed with no way to read the relation back. Nests the full
        # ModifierList shape (including its own `modifiers`) -- K-04 "Pilih
        # Modifier (modal)" needs both which lists apply AND what each list's
        # choices are. Archived attached lists are not filtered out (same as
        # `variations` on this schema and `modifiers` on ModifierList) -- they
        # carry their own archivedAt instead of disappearing from this array.
        modifierLists:
          type: array
          items:
            $ref: '#/components/schemas/ModifierList'
    ImportResult:
      type: object
      required: [dryRun, jumlahBaris, diimpor, dilewati, masalah, kategoriBaru]
      properties:
        dryRun: { type: boolean }
        jumlahBaris:
          type: integer
          description: >-
            Baris DATA yang dibaca. `diimpor + dilewati + masalah` harus sama
            dengan angka ini -- tidak ada impor parsial diam-diam (spec-a:287).
        diimpor: { type: integer }
        dilewati: { type: integer }
        kategoriBaru:
          type: array
          items: { type: string }
        masalah:
          type: array
          items:
            type: object
            required: [baris, alasan]
            properties:
              baris:
                type: integer
                description: Nomor baris di BERKAS, 1-based, header terhitung.
              alasan: { type: string }
    ItemVariationInput:
      type: object
      required: [id, price]
      properties:
        id: { type: string }
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0 }
        stockingUnit: { type: string }
        sellingUnit: { type: string }
        conversionFactor: { type: number }
        trackStock: { type: boolean }
    Price:
      type: object
      required: [id, variationId, price, effectiveFrom, changedBy]
      properties:
        id: { type: string }
        variationId: { type: string }
        outletId: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        changedBy: { type: string }
        reason: { type: string, nullable: true }
    PriceInput:
      type: object
      required: [id, price]
      properties:
        id: { type: string }
        # price SENGAJA tidak diberi `type`/`minimum` di sini -- assertPriceValid
        # (apps/server/src/modules/catalog/handlers/prices.ts) adalah
        # satu-satunya sumber kebenaran untuk kode error ini, termasuk kasus
        # yang tidak bisa dinyatakan lewat JSON Schema (di atas
        # Number.MAX_SAFE_INTEGER). Pola sama dengan selectionType di
        # modifier-lists.ts: AJV/fastify-openapi-glue tidak diam-diam
        # menolak nilai salah lebih dulu lewat jalur error yang tidak
        # menghasilkan envelope {error:{code,message}} yang konsisten.
        price: {}
        outletId: { type: string, nullable: true }
        effectiveFrom: { type: string, format: date-time }
        reason: { type: string, nullable: true }
    ResolvedPrice:
      type: object
      required: [price, source, outletId, at]
      properties:
        price: { type: integer, minimum: 0 }
        # anak tangga yang menghasilkan `price` -- 'outlet' (tangga 1),
        # 'tenant' (tangga 2, default tenant/outlet=NULL), 'variation'
        # (tangga 3, item_variation.price beku). Lihat resolvePrice di
        # apps/server/src/modules/catalog/handlers/prices.ts.
        source: { type: string, enum: [outlet, tenant, variation] }
        outletId: { type: string, nullable: true }
        at: { type: string, format: date-time }
    OutletResolvedPrice:
      allOf:
        - $ref: '#/components/schemas/ResolvedPrice'
        - type: object
          required: [variationId]
          properties:
            variationId: { type: string }
    ModifierList:
      type: object
      required: [id, name, selectionType, minSelections, modifiers]
      properties:
        id: { type: string }
        name: { type: string }
        selectionType: { type: string, enum: [single, multi] }
        minSelections: { type: integer }
        maxSelections: { type: integer, nullable: true }
        allowDuplicate: { type: boolean }
        isRequired: { type: boolean }
        archivedAt: { type: string, format: date-time, nullable: true }
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/Modifier'
    Modifier:
      type: object
      required: [id, modifierListId, name, price, sortOrder]
      properties:
        id: { type: string }
        modifierListId: { type: string }
        name: { type: string }
        price: { type: integer, minimum: 0 }
        isDefault: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
    OrderLineModifierInput:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        modifierId: { type: string, nullable: true }
        name: { type: string }
        # price/quantityMilli SENGAJA tanpa `type` -- assertModifierPriceValid/
        # assertModifierQuantityMilliValid (handlers/orders.ts) satu-satunya
        # sumber kebenaran, pola sama dengan PriceInput.price.
        price: {}
        quantityMilli: {}
    OrderLineInput:
      type: object
      required: [id, variationId, quantityMilli]
      properties:
        id: { type: string }
        variationId: { type: string }
        quantityMilli: {}
        discountAmount: {}
        # FR-H6 -- harga yang DIPAKAI KLIEN saat penjualan terjadi. Opsional.
        # Ia bukan input perhitungan: server meresolusi harganya sendiri pada
        # `occurred_at`. Gunanya hanya satu -- membedakan klien yang belum
        # tersinkron (memakai harga yang PERNAH berlaku) dari selisih yang
        # tidak dapat dijelaskan.
        unitPrice: {}
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineModifierInput'
    OrderLineModifier:
      type: object
      required: [id, name, price, quantityMilli]
      properties:
        id: { type: string }
        modifierId: { type: string, nullable: true }
        name: { type: string }
        price: { type: integer }
        quantityMilli: { type: integer }
    OrderLine:
      type: object
      required:
        - id
        - variationId
        - itemName
        - variationName
        - unitPrice
        - quantityMilli
        - modifierSnapshot
        - discountAmount
        - taxRate
        - taxAmount
        - isTaxInclusive
        - costAtSale
        - lineTotal
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
        - modifiers
      properties:
        id: { type: string }
        variationId: { type: string }
        # SALINAN NILAI (FR-B3) -- item_name/variation_name/unitPrice/
        # costAtSale diambil saat order dibuat lewat getVariationSnapshot +
        # resolvePrice (catalog/index.ts), TIDAK diperbarui lagi meski
        # katalog berubah setelahnya.
        itemName: { type: string }
        variationName: { type: string }
        unitPrice: { type: integer }
        quantityMilli: { type: integer }
        modifierSnapshot:
          type: array
          items: {}
        discountAmount: { type: integer }
        taxRateId: { type: string, nullable: true }
        taxRate: { type: string }
        taxAmount: { type: integer }
        isTaxInclusive: { type: boolean }
        costAtSale: { type: integer }
        lineTotal: { type: integer }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        # bigint 57-bit -- lihat komentar hlc di createOrder request body.
        hlc: { type: string }
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineModifier'
    # Baris `refund` (FR-B7). Ia yang menyatakan arah berlawanan dari sebuah
    # penjualan — BUKAN payment negatif. `payment.amount` punya
    # CHECK (amount > 0) dan itu dipertahankan (keputusan user 7 Agu 2026),
    # sehingga laporan keuangan tidak perlu membedakan payment yang menambah
    # dari yang mengurangi.
    Refund:
      type: object
      required:
        - id
        - orderId
        - amount
        - reasonCode
        - reasonNote
        - createdBy
        - approvedBy
        - occurredAt
        - recordedAt
        - hlc
      properties:
        id: { type: string }
        orderId: { type: string }
        amount: { type: integer }
        reasonCode:
          type: string
          enum: [barang_rusak, pesanan_salah, pelanggan_tidak_puas, kelebihan_bayar, lainnya]
        reasonNote: { type: string, nullable: true }
        createdBy: { type: string }
        # Selalu terisi dan selalu BERBEDA dari createdBy — refund menuntut
        # persetujuan manajer (spec-b:278, tidak dapat diubah). Yang menegakkan
        # perbedaannya adalah CHECK di audit_event, bukan aplikasi.
        approvedBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }

    # Order PEMBATAL (FR-B7). Bentuknya sengaja BUKAN $ref ke Order: ia tidak
    # punya `checkId` maupun `lines`, karena void tidak menjual apa pun. Nilai
    # uangnya disalin dari order yang dibatalkan supaya baris ini terbaca
    # sendirian ("penjualan sebesar sekian dibatalkan"); laporan penjualan
    # mengecualikannya lewat status = voided, bukan lewat nilai nol.
    CancelledOrder:
      type: object
      required:
        - id
        - outletId
        - deviceId
        - shiftId
        - receiptNumber
        - businessDate
        - sequence
        - status
        - channel
        - subtotal
        - orderDiscount
        - serviceChargeAmount
        - taxAmount
        - roundingAdjustment
        - total
        - amountDue
        - voidedByOrderId
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        shiftId: { type: string }
        receiptNumber: { type: string }
        businessDate: { type: string, format: date }
        sequence: { type: integer }
        status: { type: string, enum: [voided, refunded] }
        channel: { type: string, enum: [dine_in, takeaway] }
        subtotal: { type: integer }
        orderDiscount: { type: integer }
        serviceChargeAmount: { type: integer }
        taxAmount: { type: integer }
        roundingAdjustment: { type: integer }
        total: { type: integer }
        amountDue: { type: integer }
        # Menunjuk order yang DIBATALKAN. Arah ini dipaksa AC FR-B7 pertama:
        # kolom di order asli menunjuk pembatalnya menuntut UPDATE pada order
        # asli, dan itu dilarang. Namanya terbaca terbalik untuk pembacaan yang
        # tersisa ini -- lihat HANDOFF.md.
        voidedByOrderId: { type: string }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }

    Order:
      type: object
      required:
        - id
        - outletId
        - deviceId
        - shiftId
        - receiptNumber
        - businessDate
        - sequence
        - status
        - channel
        - subtotal
        - orderDiscount
        - serviceChargeAmount
        - taxAmount
        - roundingAdjustment
        - total
        - amountDue
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
        - checkId
        - lines
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        shiftId: { type: string }
        receiptNumber: { type: string }
        businessDate: { type: string, format: date }
        sequence: { type: integer }
        status: { type: string, enum: [open, paid, closed, voided, refunded, abandoned] }
        channel: { type: string, enum: [dine_in, takeaway] }
        subtotal: { type: integer }
        orderDiscount: { type: integer }
        serviceChargeAmount: { type: integer }
        # Selalu 0 di sub-project ini -- invariant #7, TaxCalculator adalah
        # Modul C dan belum ada (keputusan Q5, PLAN-ordering-fondasi.md §8.0).
        taxAmount: { type: integer }
        roundingAdjustment: { type: integer }
        total: { type: integer }
        amountDue: { type: integer }
        # FR-H6 -- true bila total klien berbeda dari hitungan server DAN
        # selisihnya tidak dapat dijelaskan riwayat harga. Transaksinya tetap
        # diterima: menolaknya berarti kehilangan penjualan yang uangnya sudah
        # diterima merchant (spec-h:95).
        hasCalculationVariance: { type: boolean }
        varianceAmount: { type: integer, nullable: true }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }
        checkId: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    DeviceRingkas:
      type: object
      required: [id, outletId, code, revokedAt, adaKredensial]
      properties:
        id: { type: string }
        outletId: { type: string }
        code: { type: string }
        name: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        lastSeenAt: { type: string, nullable: true }
        revokedAt:
          type: string
          nullable: true
          description: Terisi berarti perangkat dicabut dan tidak dapat lagi menukar token.
        adaKredensial:
          type: boolean
          description: >-
            Apakah kredensial sudah pernah diterbitkan. BUKAN nilainya --
            secret hanya dapat dibaca sekali, pada respons yang menerbitkannya.
        credentialsExpireAt: { type: string, nullable: true }
    PemakaianKuota:
      type: object
      required: [terpakai, batas]
      properties:
        terpakai:
          type: integer
          description: >-
            Jumlah yang sudah dipakai SEKARANG, dengan aturan arsip milik
            modul pemilik tabelnya: produk & outlet mengecualikan yang
            diarsipkan, pengguna mengecualikan yang nonaktif, device
            mengecualikan yang dicabut.
        batas:
          type: integer
          nullable: true
          description: '`null` = tanpa batas.'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
