openapi: 3.0.0
info:
  title: Lumi POS API
  version: 0.0.1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                colorHint: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: >-
            Header X-Tenant-Id hilang, parentId tidak valid (mis. string
            kosong), atau X-Tenant-Id tidak dikenal (UNKNOWN_TENANT -- FK ke
            tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: parentId merujuk ke kategori yang tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Kategori tingkat ketiga ditolak, atau id sudah dipakai kategori
            lain (ID_ALREADY_EXISTS -- retry offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listCategories
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}:
    get:
      operationId: getCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                colorHint: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang, atau parentId tidak valid (mis. string kosong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Kategori tingkat ketiga ditolak, atau kategori dijadikan induk dirinya sendiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/archive:
    post:
      operationId: archiveCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/restore:
    post:
      operationId: restoreCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, variations]
              properties:
                id: { type: string }
                name: { type: string }
                categoryId: { type: string, nullable: true }
                description: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                variations:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ItemVariationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: >-
            Header X-Tenant-Id hilang, item tanpa variation (ITEM_NO_VARIATION),
            harga/cost variation tidak valid (VALIDATION_ERROR), atau
            X-Tenant-Id tidak dikenal (UNKNOWN_TENANT -- FK ke tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            categoryId tidak ditemukan atau bukan milik tenant pemanggil (RLS
            menyembunyikan kategori tenant lain, bukan hanya menolak akses)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Barcode duplikat, batas 250 variation per item tercapai, atau id
            (item atau variation pertamanya) sudah dipakai (ID_ALREADY_EXISTS
            -- retry offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listItems
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
        - name: categoryId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                categoryId: { type: string, nullable: true }
                description: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Item tidak ditemukan, atau categoryId tidak ditemukan/bukan milik
            tenant pemanggil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/archive:
    post:
      operationId: archiveItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/restore:
    post:
      operationId: restoreItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations:
    post:
      operationId: createItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemVariationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVariation'
        '400':
          description: Header X-Tenant-Id hilang, atau harga/cost tidak valid (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Item tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Batas 250 variation per item tercapai, barcode duplikat, atau id
            sudah dipakai variation lain (ID_ALREADY_EXISTS -- retry offline
            dengan id yang sama, dibedakan dari BARCODE_DUPLICATE lewat
            err.constraint di server)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}:
    patch:
      operationId: updateItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                sku: { type: string, nullable: true }
                barcode: { type: string, nullable: true }
                trackStock: { type: boolean }
                stockingUnit: { type: string }
                sellingUnit: { type: string }
                conversionFactor: { type: number }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVariation'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Barcode duplikat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}/archive:
    post:
      operationId: archiveItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVariation'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}/restore:
    post:
      operationId: restoreItemVariation
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemVariation'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}/prices:
    post:
      operationId: createPrice
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
        '400':
          description: >-
            Header X-Tenant-Id atau X-Actor-Id hilang, atau price tidak valid
            (bilangan bulat rupiah >= 0, tidak melebihi
            Number.MAX_SAFE_INTEGER -- VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Variation tidak ditemukan (NOT_FOUND), aktor tidak ditemukan atau
            tidak aktif (ACTOR_NOT_FOUND), atau outlet tidak ditemukan
            (OUTLET_NOT_FOUND) -- ketiganya divalidasi lewat SELECT yang
            tunduk RLS, bukan FK (FK PostgreSQL tidak tunduk RLS, temuan F1
            di CLAUDE.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            id sudah dipakai baris riwayat harga lain (ID_ALREADY_EXISTS --
            retry offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listPrices
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Riwayat harga, terurut effectiveFrom DESC lalu id DESC
            (tie-breaker deterministic)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Price'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Variation tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}/variations/{variationId}/price:
    get:
      operationId: getResolvedPrice
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: variationId
          in: path
          required: true
          schema: { type: string }
        - name: outletId
          in: query
          schema: { type: string }
        - name: at
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: >-
            Harga terselesaikan lewat tangga tiga tingkat
            (spec-a-katalog.md:202-209): (variation, outlet) terbaru <= at,
            lalu (variation, outlet=NULL), lalu item_variation.price.
            `source` menyebutkan anak tangga mana yang dipakai --
            diagnosabilitas di lapangan tanpa membaca database langsung.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPrice'
        '400':
          description: >-
            Header X-Tenant-Id hilang, atau parameter at bukan timestamp
            ISO 8601 valid (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Variation tidak ditemukan (NOT_FOUND), atau outlet tidak
            ditemukan (OUTLET_NOT_FOUND) kalau outletId dikirim -- keduanya
            divalidasi lewat SELECT yang tunduk RLS, bukan FK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /outlets/{outletId}/prices:
    get:
      operationId: listOutletPrices
      parameters:
        - name: outletId
          in: path
          required: true
          schema: { type: string }
        - name: at
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: >-
            Harga efektif seluruh item_variation aktif (archived_at IS NULL)
            di tenant, diselesaikan untuk outlet ini dalam satu query --
            dibutuhkan klien POS saat sinkron turun. Urutan deterministik
            (variationId ASC).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutletResolvedPrice'
        '400':
          description: >-
            Header X-Tenant-Id hilang, atau parameter at bukan timestamp
            ISO 8601 valid (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Outlet tidak ditemukan (OUTLET_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists:
    post:
      operationId: createModifierList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, selectionType]
              properties:
                id: { type: string }
                name: { type: string }
                selectionType: { type: string, enum: [single, multi] }
                minSelections: { type: integer }
                maxSelections: { type: integer, nullable: true }
                allowDuplicate: { type: boolean }
                isRequired: { type: boolean }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierList'
        '400':
          description: >-
            Header X-Tenant-Id hilang, selectionType tidak valid (harus
            'single' atau 'multi', VALIDATION_ERROR), atau X-Tenant-Id tidak
            dikenal (UNKNOWN_TENANT -- FK ke tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            id sudah dipakai ModifierList lain (ID_ALREADY_EXISTS -- retry
            offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listModifierLists
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModifierList'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists/{modifierListId}:
    get:
      operationId: getModifierList
      parameters:
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierList'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateModifierList
      parameters:
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                selectionType: { type: string, enum: [single, multi] }
                minSelections: { type: integer }
                maxSelections: { type: integer, nullable: true }
                allowDuplicate: { type: boolean }
                isRequired: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierList'
        '400':
          description: >-
            Header X-Tenant-Id hilang, atau selectionType tidak valid (harus
            'single' atau 'multi', VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists/{modifierListId}/archive:
    post:
      operationId: archiveModifierList
      parameters:
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierList'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists/{modifierListId}/restore:
    post:
      operationId: restoreModifierList
      parameters:
        - name: modifierListId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierList'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists/{modifierListId}/modifiers:
    post:
      operationId: createModifier
      parameters:
        - name: modifierListId
          in: path
          required: true
