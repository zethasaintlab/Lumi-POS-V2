              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Device tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /shifts:
    post:
      operationId: openShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, deviceId, businessDate, openingFloat]
              properties:
                id: { type: string }
                outletId: { type: string }
                deviceId: { type: string }
                businessDate: { type: string, format: date }
                # openingFloat SENGAJA tidak diberi `type`/`minimum` -- sama
                # seperti PriceInput.price di catalog, assertOpeningFloatValid
                # (apps/server/src/modules/cash/handlers/shifts.ts) adalah
                # satu-satunya sumber kebenaran untuk kode error ini.
                openingFloat: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          description: >-
            Header X-Tenant-Id atau X-Actor-Id hilang, atau openingFloat
            tidak valid (bilangan bulat rupiah >= 0, tidak melebihi
            Number.MAX_SAFE_INTEGER -- VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan (OUTLET_NOT_FOUND), deviceId tidak
            ditemukan atau sudah dicabut (DEVICE_NOT_FOUND), atau aktor
            tidak ditemukan/tidak aktif (ACTOR_NOT_FOUND) -- ketiganya
            divalidasi lewat SELECT yang tunduk RLS, bukan FK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Device ini sudah punya shift yang masih terbuka
            (SHIFT_ALREADY_OPEN -- ux_shift_one_open_per_device), atau id
            sudah dipakai shift lain (ID_ALREADY_EXISTS -- retry offline
            dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders:
    get:
      operationId: listOrders
      summary: B-02 -- daftar transaksi pada rentang tanggal bisnis.
      description: >-
        Satu baris per TRANSAKSI, bukan per baris tabel. Penjualan yang
        dibatalkan menghasilkan dua baris di tabel order (yang asli tetap
        berstatus open selamanya karena AC FR-B7 melarang UPDATE padanya, dan
        pembatalnya baris tersendiri ber-status voided yang nilainya salinan).
        Yang dikembalikan di sini order aslinya, ber-status turunan
        "dibatalkan", dengan penunjuk ke pembatalnya.


        Keranjang yang belum dibayar disembunyikan -- ia bukan transaksi, dan
        belum ada jalan menutupnya. Status yang mungkin muncul hanya terjual,
        dibatalkan, dan direfund.


        Paginasi KEYSET. Order dari perangkat yang baru tersambung membawa
        tanggal bisnis historis dan menyisip di TENGAH urutan; dengan OFFSET
        satu sisipan membuat satu transaksi terlewat tanpa error. Kirim
        cursorBerikut dari respons sebelumnya apa adanya -- ia buram dan tidak
        untuk disusun klien.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: created_by
          in: query
          required: false
          description: Id kasir pembuat order.
          schema: { type: string }
        - name: receipt_number
          in: query
          required: false
          description: >-
            Pencarian SEBAGIAN dan tidak peka huruf besar-kecil. Karakter
            wildcard yang diketik pengguna dicari harfiah.
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: 'terjual | dibatalkan | direfund'
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          description: cursorBerikut dari respons sebelumnya, apa adanya.
          schema: { type: string }
      responses:
        '200':
          description: Satu halaman transaksi, terbaru lebih dulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarTransaksi'
        '400':
          description: Rentang, limit, status, atau cursor tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, deviceId, shiftId, receiptNumber, businessDate, sequence, channel, checkId, lines]
              properties:
                id: { type: string }
                outletId: { type: string }
                deviceId: { type: string }
                shiftId: { type: string }
                receiptNumber:
                  type: string
                  pattern: '^[A-Za-z0-9]+-\d{8}-\d+$'
                businessDate: { type: string, format: date }
                sequence: { type: integer, minimum: 1 }
                channel: { type: string, enum: [dine_in, takeaway] }
                # hlc SENGAJA type: string, bukan integer -- ia bilangan
                # 57-bit (packages/domain/src/hlc.ts) yang melebihi presisi
                # double JSON/JS. assertHlcValid (handlers/orders.ts) adalah
                # satu-satunya sumber kebenaran untuk bentuknya.
                hlc: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time, nullable: true }
                checkId: { type: string }
                # FR-H6 -- total yang DIHITUNG KLIEN. Opsional, dan tidak
                # pernah dipercaya: server tetap menghitung sendiri dan
                # menyimpan hitungannya. Nilai ini hanya dibandingkan, dan
                # selisihnya ditandai. Sengaja tanpa `type` --
                # assertClientTotalValid (handlers/orders.ts) satu-satunya
                # sumber kebenaran, pola sama dengan quantityMilli.
                #
                # Klien versi N-1 tidak mengirimnya, dan tidak boleh patah.
                total: {}
                # FR-B8 -- diskon tingkat order. SENGAJA tanpa `type` di
                # dalamnya: `bacaPermintaanDiskon` (handlers/orders.ts) adalah
                # satu-satunya sumber kebenaran, pola sama dengan
                # quantityMilli dan total. Klien versi N-1 tidak mengirimnya.
                #
                # `nilai` berskala 10.000 untuk `persen` (1500 = 15%), rupiah
                # utuh untuk `nominal`.
                discount:
                  type: object
                  nullable: true
                  properties:
                    tipe: { type: string, enum: [persen, nominal] }
                    nilai: {}
                # Daftar TERTUTUP; "lainnya" wajib catatan >= 10 karakter.
                # Dituntut untuk SETIAP diskon, bukan hanya yang melewati
                # ambang: yang di bawah ambang tetap masuk laporan exception
                # FR-G5, dan baris tanpa alasan tidak dapat diagregasi.
                discountReasonCode:
                  type: string
                  enum:
                    - promo_berjalan
                    - karyawan
                    - pelanggan_langganan
                    - kompensasi_keluhan
                    - lainnya
                discountReasonNote: { type: string, nullable: true }
                lines:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OrderLineInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: >-
            Header X-Tenant-Id atau X-Actor-Id hilang; lines kosong (order
            DRAFT tidak pernah tersimpan, minItems: 1); quantityMilli,
            discountAmount, atau harga/quantityMilli modifier tidak valid;
            hlc bukan string bilangan bulat desimal; receiptNumber tidak
            cocok format PREFIX-YYYYMMDD-URUTAN; atau sequence bukan
            bilangan bulat positif (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan (OUTLET_NOT_FOUND), deviceId tidak
            ditemukan/sudah dicabut (DEVICE_NOT_FOUND), aktor tidak
            ditemukan/tidak aktif (ACTOR_NOT_FOUND), shiftId tidak ditemukan
            (SHIFT_NOT_FOUND), atau variationId salah satu baris tidak
            ditemukan (VARIATION_NOT_FOUND) -- kelimanya divalidasi lewat
            SELECT yang tunduk RLS, bukan FK (FK PostgreSQL tidak tunduk
            RLS, temuan F1 di CLAUDE.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            shiftId ditemukan tapi sudah tidak berstatus open
            (SHIFT_NOT_OPEN), shiftId bukan milik deviceId yang dikirim
            (SHIFT_DEVICE_MISMATCH), nomor struk bentrok untuk device dan
            tanggal bisnis yang sama (RECEIPT_SEQUENCE_TAKEN), atau id
            (order/check/salah satu line/salah satu modifier) sudah dipakai
            baris lain (ID_ALREADY_EXISTS -- termasuk checkId yang sudah
            dipakai order lain, FR-B12)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Order beserta check, seluruh order_line (snapshot item_name/
            variation_name/unit_price/cost_at_sale -- FR-B3, tidak
            terpengaruh perubahan katalog setelahnya), dan modifier
            bertingkat per line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/midtrans:
    post:
      operationId: midtransNotification
      summary: Notifikasi pembayaran dari Midtrans
      description: >-
        FR-C14. Satu-satunya endpoint di API ini yang TIDAK membawa
        `X-Tenant-Id` — Midtrans tidak tahu apa-apa soal tenant kami, dan
        tidak boleh tahu.


        Signature diverifikasi LEBIH DULU, sebelum satu query pun dijalankan:
        `SHA512(order_id + status_code + gross_amount + ServerKey)`. Tanpa itu
        siapa pun yang menemukan URL ini dapat menandai order mana pun lunas.


        Tenant dibaca dari `custom_field1` yang kami titipkan sendiri saat
        charge, lalu dipakai sebagai `app.tenant_id` — sehingga pencarian
        payment tetap tunduk RLS dan tenant yang dipalsukan tidak menemukan
        apa pun.


        Selalu dijawab `200` bila notifikasinya sah, termasuk saat tidak
        mengubah apa pun: Midtrans mengirim ulang notifikasi yang tidak
        dijawab 200, jadi menjawab error hanya membuatnya mengulang tanpa
        akhir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status_code, gross_amount, signature_key]
              properties:
                # `order_id` di Midtrans adalah id PAYMENT kami, bukan id
                # order: satu order dapat dibayar beberapa kali, dan memakai id
                # order akan membuat pembayaran kedua ditolak sebagai duplikat.
                order_id: { type: string }
                status_code: { type: string }
                gross_amount: { type: string }
                signature_key: { type: string }
                transaction_status: { type: string }
                custom_field1: { type: string }
      responses:
        '200':
          description: Notifikasi sah dan diproses (atau sudah pernah diproses).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        '401':
          description: >-
            Signature tidak sah (INVALID_SIGNATURE). Pesannya sengaja tidak
            menjelaskan bagian mana yang tidak cocok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Pembayaran tidak ditemukan (PAYMENT_NOT_FOUND). Termasuk
            notifikasi bertanda tangan sah yang tenant-nya tidak cocok —
            pencariannya tunduk RLS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            Kunci webhook tidak dikonfigurasi (WEBHOOK_NOT_CONFIGURED).
            Endpoint yang menerima notifikasi tanpa verifikasi jauh lebih
            berbahaya daripada endpoint yang mati.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}/check-status:
    post:
      operationId: checkPaymentStatus
      summary: Tanyakan status pembayaran ke gateway
      description: >-
        FR-C14. Ini SATU-SATUNYA jalan sebuah payment QRIS menjadi
        `confirmed` — spec-c:320 melarang sistem menandai lunas tanpa
        konfirmasi gateway, dan tidak ada jalur lain yang boleh melakukannya.


        POST, bukan GET: memanggilnya mengubah keadaan (status payment, dan
        — bila pembayaran melunasi — status order).


        Penjadwalan polling (tiap 2 detik, maksimal 5 menit) adalah perilaku
        KLIEN. Server hanya menyediakan pintunya. Payment yang statusnya sudah
        final dijawab tanpa menyentuh gateway sama sekali.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Keadaan payment setelah ditanyakan. `gatewayStatus` adalah jawaban
            gateway apa adanya dan `null` bila gateway tidak ditanyai;
            `expired` dan `failed` sama-sama tersimpan sebagai payment
            `failed`, jadi field ini yang memungkinkan klien mengatakan "QR
            kedaluwarsa" alih-alih "pembayaran gagal".
          content:
            application/json:
              schema:
                type: object
                required: [payment, order, outstanding]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  gatewayStatus:
                    type: string
                    nullable: true
                    enum: [pending, confirmed, failed, expired]
                  order:
                    type: object
                    required: [id, status, total]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      total: { type: integer }
                  outstanding: { type: integer }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            paymentId tidak ditemukan (PAYMENT_NOT_FOUND) — lewat SELECT yang
            tunduk RLS, jadi payment milik tenant lain juga menjawab ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Payment bukan metode gateway (PAYMENT_NOT_GATEWAY). Pembayaran
            tunai tidak punya gateway untuk ditanyai.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/abandon:
    post:
      operationId: abandonOrder
      summary: FR-C3 -- kasir membatalkan satu draf pembayaran, stok dibebaskan seketika.
      description: >-
        Jalur QRIS dinamis menulis order ke server SEBELUM pelanggan membayar
        (spec-c:320 melarang menandai lunas tanpa konfirmasi gateway).
        Pelanggan yang batal membayar meninggalkan order `open` yang memegang
        stok -- movement `sale` ditulis saat order DIBUAT, bukan saat dibayar.


        ⛔ Pembersihan massal (`POST /orders/cleanup-abandoned`) baru
        menyentuhnya setelah 24 JAM dan menuntut peran `stock_adjust`. Kasir
        yang membatalkan di depan pelanggan tidak dapat menunggu keduanya, dan
        stok yang terkunci sehari membuat produk berikutnya terlihat habis.


        ⛔ Ordernya TIDAK dihapus, dan nomor struknya tetap melekat padanya.
        Nomor yang terpakai untuk order yang dibatalkan jauh lebih baik
        daripada LUBANG di urutan struk -- 41 dan 43 ada sementara 42 tidak
        pernah ada di mana pun tidak dapat dijelaskan siapa pun saat diperiksa.


        ⛔ Order yang SUDAH dibayar ditolak 409. Membatalkan transaksi lunas
        adalah void/refund, dengan restock, alasan daftar tertutup, dan baris
        pembatalnya sendiri; jalan kedua ke sana tidak punya satu pun dari itu.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonCode: { type: string }
      responses:
        "200": { description: "Draf ditinggalkan, stok dibebaskan" }
        "403": { description: "Tidak berhak" }
        "404": { description: "Order tidak ditemukan" }
        "409": { description: "Order tidak berstatus open" }

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Batalkan transaksi — sistem menentukan void atau refund
      description: >-
        FR-B7. Kasir tidak memilih "void" atau "refund" (spec-b:235) —
        body TIDAK memuat nama operasi sama sekali. Server membacanya dari
        status order lewat `decideCancellation` (packages/domain), dan
        menyebutkan hasilnya di field `operation` supaya UI dapat
        menjelaskannya ke kasir.


        Order asli TIDAK di-UPDATE (AC FR-B7 pertama). Void menambah baris
        `order` berstatus `voided` yang `voidedByOrderId`-nya menunjuk order
        yang dibatalkan.


        Void berjalan TANPA X-Approver-Id — keputusan produk 1 Agustus 2026,
        override eksplisit terhadap research/08 §3. Header itu diabaikan bila
        dikirim. Refund (order CLOSED) akan menuntutnya, dan belum tersedia.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Hanya `id` dan `reasonCode` yang wajib di KONTRAK. Field mana
              # lagi yang wajib bergantung pada operasi yang DIPILIH SERVER
              # dari status order, dan JSON Schema tidak bisa menyatakan
              # "wajib bila server memutuskan X". Void menuntut
              # receiptNumber + sequence; refund menuntut amount + header
              # X-Approver-Id. Keduanya divalidasi di handler, pola yang sama
              # dengan seluruh validasi uang/kuantitas di repo ini.
              required: [id, reasonCode]
              properties:
                id:
                  type: string
                  description: >-
                    Id order PEMBATAL (void) atau id baris `refund` (refund),
                    di-generate klien (ULID/UUIDv7).
                receiptNumber:
                  type: string
                  pattern: '^[A-Za-z0-9]+-\d{8}-\d+$'
                  description: Void saja.
                sequence: { type: integer, minimum: 1, description: Void saja. }
                amount:
                  description: >-
                    Refund saja — nominal rupiah utuh yang dikembalikan.
                    Sengaja tanpa `type`: assertRefundAmountValid (handler)
                    satu-satunya sumber kebenaran, sama seperti
                    quantityMilli/discountAmount di POST /orders.
                lines:
                  type: array
                  description: >-
                    Refund parsial — baris mana yang dikembalikan stoknya
                    (spec-b:233). Dikosongkan berarti seluruh order.
                  items:
                    type: object
                    required: [lineId, quantityMilli]
                    properties:
                      lineId: { type: string }
                      quantityMilli: {}
                # Daftar TERTUTUP (spec-b:290) -- free text tidak dapat
                # diagregasi menjadi laporan fraud.
                #
                # Enum di sini adalah GABUNGAN daftar void dan refund, dan itu
                # sengaja lebih longgar daripada aturan sebenarnya: endpoint-nya
                # satu, sementara operasinya baru diketahui server dari status
                # order. Yang menolak `barang_rusak` pada void dan
                # `salah_input` pada refund adalah assertCancellationReason
                # (packages/domain) -- satu-satunya sumber kebenaran, dan yang
                # juga berlaku saat klien offline.
                reasonCode:
                  type: string
                  enum:
                    - salah_input
                    - pelanggan_batal
                    - item_habis
                    - uji_coba
                    - barang_rusak
                    - pesanan_salah
                    - pelanggan_tidak_puas
                    - kelebihan_bayar
                    - lainnya
                # Wajib >= 10 karakter bila reasonCode = lainnya (spec-b:296).
                # Aturan bersyarat itu tidak dinyatakan di sini -- ia ada di
                # domain, sama seperti seluruh validasi uang/kuantitas di repo
                # ini.
                reasonNote: { type: string, nullable: true }
                hlc: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: >-
            Order pembatal dibuat. `operation` menyebut operasi yang
            DIPILIH SERVER.
          content:
            application/json:
              schema:
                type: object
                required: [operation, cancelledOrderId]
                properties:
                  # `operation` menentukan field mana yang ada: `order` untuk
                  # void (baris order pembatal), `refund` untuk refund (baris
                  # refund). Refund TIDAK membuat order baru, dan TIDAK
                  # membuat payment negatif -- keputusan user 7 Agu 2026.
                  operation: { type: string, enum: [void, refund] }
                  cancelledOrderId: { type: string }
                  order: { $ref: '#/components/schemas/CancelledOrder' }
                  refund: { $ref: '#/components/schemas/Refund' }
        '400':
          description: >-
            Header X-Tenant-Id/X-Actor-Id atau Idempotency-Key hilang;
            reasonCode di luar daftar tertutup; reasonCode `lainnya` tanpa
            catatan minimal 10 karakter; atau hlc bukan string bilangan bulat
            desimal (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            orderId tidak ditemukan (NOT_FOUND) atau aktor tidak
            ditemukan/tidak aktif (ACTOR_NOT_FOUND) — keduanya lewat SELECT
            yang tunduk RLS, bukan FK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Order sudah pernah dibatalkan (ORDER_ALREADY_VOIDED); status
            order tidak mengizinkan pembatalan (ORDER_NOT_CANCELLABLE);
            nomor struk pembatal bentrok (RECEIPT_SEQUENCE_TAKEN); id
            pembatal sudah dipakai (ID_ALREADY_EXISTS); atau request dengan
            Idempotency-Key yang sama sedang diproses (IDEMPOTENCY_KEY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Idempotency-Key sudah dipakai untuk body yang berbeda
            (IDEMPOTENCY_KEY_HASH_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Order berstatus CLOSED, jadi operasinya refund — belum tersedia
            (NOT_IMPLEMENTED). Menolak lebih baik daripada mem-void
            penjualan sah dan mengeluarkannya dari omzet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/payments:
    post:
      operationId: createPayment
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Hanya `id` yang wajib di KONTRAK. Field mana lagi yang wajib
              # bergantung pada METODE, dan JSON Schema tidak bisa menyatakan
              # "wajib bila method = X" tanpa oneOf yang justru mengaburkan
              # pesan errornya. Tunai menuntut tenderedAmount; QRIS dinamis
              # menuntut amount. Keduanya divalidasi di handler, pola yang
              # sama dengan POST /orders/{orderId}/cancel.
              required: [id]
              properties:
                id: { type: string }
                method:
                  type: string
                  # Daftar TERTUTUP. `other` (voucher fisik, transfer) belum
                  # dibangun -- FR-C2 menuntut catatan wajib untuknya, dan
                  # menerimanya sebelum itu ada berarti membangun separuh
                  # FR-C2 tanpa pengaman yang menyertainya.
                  enum: [cash, qris_dynamic, qris_static, card_edc]
                  default: cash
                # tenderedAmount = uang yang DISERAHKAN pelanggan (tunai
                # saja), bukan yang terpakai. Server yang menghitung amount
                # dan changeAmount, karena keduanya bergantung pada pembulatan
                # tunai (FR-C9) yang ditentukan rounding_increment/
                # rounding_mode outlet. Tanpa `type` -- assertTenderedAmountValid
                # satu-satunya sumber kebenaran, pola sama dengan
                # PriceInput.price.
                tenderedAmount: {}
                # amount = nominal yang diminta ke gateway (QRIS dinamis).
                # Tidak ada uang yang diserahkan di tangan, jadi tidak ada
                # tendered maupun kembalian.
                amount: {}
                # --- QRIS statis (FR-C2) ---
                # WAJIB. Kontrol anti-fraud, bukan formalitas: QRIS statis
                # dikonfirmasi kasir TANPA verifikasi sistem apa pun, dan
                # berfungsi offline. Isinya nominal + 4 digit terakhir nomor
                # referensi, atau catatan.
                #
                # Ditolak bila memuat 13-19 digit berurutan (AC FR-C5 keempat)
                # -- itu bentuk nomor kartu.
                reference: { type: string, nullable: true }
                # --- EDC (FR-C4) ---
                # approvalCode WAJIB; cardLast4 opsional dan maksimal 4 DIGIT.
                # Tidak ada field mana pun di kontrak ini yang menerima nomor
                # kartu lengkap, dan itu permanen.
                approvalCode: { type: string, nullable: true }
                cardLast4: { type: string, nullable: true, maxLength: 4 }
                acquirer: { type: string, nullable: true }
                terminalReference: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time }
                hlc: { type: string }
      responses:
        '201':
          description: >-
            Pembayaran tercatat. Order berpindah ke CLOSED bila lunas
            (OPEN -> PAID -> CLOSED); tetap OPEN bila kurang bayar, dengan
            sisa tagihan di .
          content:
            application/json:
              schema:
                type: object
                required: [payment, order, outstanding]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  order:
                    type: object
                    required: [id, status, total, taxAmount, roundingAdjustment, amountDue]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      total: { type: integer }
                      taxAmount: { type: integer }
                      roundingAdjustment: { type: integer }
                      amountDue: { type: integer }
                  outstanding: { type: integer }
                  # --- QRIS dinamis saja (FR-C2, FR-C14) ---
                  # Wajib dideklarasikan di sini: serializer Fastify MEMBUANG
                  # properti yang tidak ada di skema, jadi field yang lupa
                  # ditulis akan hilang diam-diam dari respons -- bukan gagal,
                  # yang jauh lebih sulit dilacak.
                  #
                  # Kosong untuk pembayaran tunai.
                  qrString:
                    type: string
                    nullable: true
                    description: >-
                      Isi QR untuk dirender klien. `null` bila gateway tidak
                      dapat dihubungi — payment tetap tercatat
                      `pending_confirmation` (FR-C14).
                  expiresAt: { type: string, nullable: true }
                  # `false` berarti QR gagal diambil, BUKAN berarti pembayaran
                  # gagal. Pelanggan mungkin sudah membayar; klien menampilkan
                  # "Cek status", bukan "pembayaran gagal".
                  gatewayReachable: { type: boolean }
        '400':
          description: Validation error, metode belum didukung, atau Idempotency-Key hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Order tidak dalam status yang bisa dibayar, id sudah ada, atau key sedang diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tax-rates:
    post:
      operationId: createTaxRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRateInput'
      responses:
        '201':
          description: >-
            Tarif pajak dibuat. FR-C6 -- tarif adalah entitas berdata, bukan
            konstanta; perubahan perda menghasilkan record baru, yang lama
            diakhiri lewat POST /tax-rates/{id}/end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Outlet, item, atau kategori yang dirujuk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Id sudah ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listTaxRates
      responses:
        '200':
          description: Seluruh tarif pajak tenant, termasuk yang sudah diakhiri
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxRate'

  /tax-rates/{taxRateId}/end:
    post:
      operationId: endTaxRate
      parameters:
        - name: taxRateId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            effective_to diisi. Barisnya TIDAK dihapus (invariant #2) --
            transaksi historis tetap benar lewat snapshot di order_line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxRate'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reports/sales:
    get:
      operationId: getSalesReport
      summary: >-
        FR-G3/FR-G7 -- posisi penjualan untuk rentang tanggal bisnis. Satu
        endpoint untuk seluruh laporan penjualan back-office.
      description: >-
        ## Rentang memakai `business_date`, BUKAN `occurred_at`


        `order.business_date` dihitung SEKALI saat penjualan, dari zona waktu
        outletnya, dan sejak itu hanya DIBACA (CLAUDE.md -- "Tanggal bisnis
        dibaca dari order.business_date, tidak dihitung ulang dari
        occurred_at"). Memfilter `occurred_at` di sini akan menjadikan laporan
        tempat KEDUA yang memutuskan tanggal sebuah penjualan, dan untuk outlet
        di WITA/WIT jawabannya akan berbeda dari tutup kas di outlet itu
        sendiri.


        Tanggal bisnis juga tidak berakhir tengah malam melainkan saat tutup
        shift (default 04:00), jadi `occurred_at` pukul 01:00 milik tanggal
        bisnis SEBELUMNYA.


        ## Angkanya dihitung fungsi yang sama dengan aplikasi kasir


        Handler mengambil baris lalu memanggil `posisiPenjualan()`
        (`packages/domain/src/posisi-penjualan.ts`) -- fungsi yang sama persis
        yang dipakai laporan harian kasir di atas SQLite lokal. Itu yang membuat
        AC FR-G4 ("angka laporan lokal cocok dengan laporan server") dapat
        dipenuhi, dan penjaga `tests/domain/satu-sumber-omzet.test.js` menolak
        agregasi `SUM(...)` atas tabel `order` di berkas mana pun selain
        fungsi itu.


        ## Order pembatal ikut terbawa rentang


        Order pembatal MENYALIN `business_date` order aslinya (`cancel.ts`),
        jadi rentang yang memuat order asli selalu memuat pembatalnya juga --
        dan deteksi "sudah dibatalkan" tidak pernah meleset karena batas
        rentang.


        Refund diambil lewat `business_date` ORDER-nya, sama seperti laporan
        harian kasir. Refund atas transaksi hari lalu karena itu mengurangi
        omzet pada hari transaksi ASLINYA, bukan hari refundnya.
      parameters:
        - name: from
          in: query
          required: true
          description: Tanggal bisnis awal, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: to
          in: query
          required: true
          description: Tanggal bisnis akhir, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          description: >-
            Dikosongkan berarti SELURUH outlet tenant. Lintas-outlet
            diagregasi berdasarkan tanggal bisnis lokal masing-masing outlet --
            itulah yang `business_date` sudah simpan.
          schema: { type: string }
      responses:
        '200':
          description: Posisi penjualan untuk rentang tersebut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanPenjualan'
        '400':
          description: >-
            Header X-Tenant-Id hilang, `from`/`to` bukan YYYY-MM-DD, atau
            `from` lebih besar dari `to` (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Aktor tidak berhak melihat laporan (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            Aktor tidak ditemukan, atau `outlet_id` bukan milik tenant
            pemanggil (OUTLET_NOT_FOUND) -- divalidasi lewat SELECT yang tunduk
            RLS, bukan FK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/products:
    get:
      operationId: getProductReport
      summary: >-
        FR-G1 -- laporan produk: BARANG yang keluar pada rentang tanggal
        bisnis. Operasional, bukan finansial.
      description: >-
        ## ⛔ Ini BUKAN laporan uang, dan istilahnya sengaja berbeda


        Metriknya `kuantitas` dan `nilaiKotor` -- bukan "omzet". Omzet punya
        satu definisi tunggal di `packages/domain/src/posisi-penjualan.ts`
        (FR-G3), dan angka di sini TIDAK sama dengannya: ia mengagregasi
        `order_line`, tidak mengurangkan refund, dan tidak memakai
        `order.total`.


        `CLAUDE.md`: *"basis laporan per produk adalah sebelum void & refund,
        dan itu bukan kelalaian: baris produk menyatakan barang apa yang
        keluar, dan refund uang tidak selalu mengembalikan barang"*.


        ## Void diabaikan, refund TIDAK


        Pesanan yang dibatalkan tidak pernah menghasilkan barang keluar -- ia
        dikeluarkan. Pesanan yang direfund SUDAH menghasilkan barang keluar;
        uangnya kembali, barangnya belum tentu (`lines: []` pada refund
        berarti uang kembali tanpa barang kembali). Ia tetap dihitung.


        ## ⛔ Dilaporkan per VARIATION, bukan per produk


        `order_line` tidak punya `item_id` sama sekali -- hanya
        `variation_id` beserta snapshot `item_name` dan `variation_name`.
        Menambahkan id produk menuntut join ke `item_variation` yang dimiliki
        modul catalog, dan invariant #4 melarang modul ordering meng-query
        tabel milik modul lain.


        Nama yang dikembalikan adalah SNAPSHOT saat penjualan, bukan nama
        katalog hari ini -- produk yang berganti nama tetap dapat dijelaskan
        di laporan lama.


        ## Kuantitas berskala x1000


        Konvensi repo: `order_line.quantity` adalah INTEGER x1000
        (`0.5 kg` -> `500`). `kuantitas` di sini dikirim apa adanya dalam
        skala itu; `kuantitasTampil` adalah bentuk desimalnya sebagai string.
      parameters:
        - name: from
          in: query
          required: true
          description: Tanggal bisnis awal, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: to
          in: query
          required: true
          description: Tanggal bisnis akhir, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          description: Dikosongkan berarti seluruh outlet tenant.
          schema: { type: string }
      responses:
        '200':
          description: >-
            Baris per variation, terurut kuantitas menurun lalu nama --
            deterministik.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanProduk'
        '400':
          description: >-
            Header X-Tenant-Id hilang, `from`/`to` bukan YYYY-MM-DD, atau
            `from` lebih besar dari `to` (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            Aktor tidak ditemukan, atau `outlet_id` bukan milik tenant
            pemanggil (OUTLET_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/cashiers:
    get:
      operationId: getCashierReport
      summary: FR-G1 -- posisi penjualan per kasir, pada rentang tanggal bisnis.
      description: >-
        Setiap kasir dihitung lewat `posisiPenjualan()` yang sama dengan
        laporan global (FR-G3), bukan lewat SUM tersendiri. Sifat yang dijaga:
        jumlah seluruh kasir SAMA dengan angka laporan global.


        ⛔ Order pembatal dimasukkan ke kelompok pemilik order ASLINYA, bukan
        pemilik pembatal. Pembatal punya `created_by` sendiri -- orang yang
        menekan tombol void, yang sering bukan kasir yang menjual. Tanpa itu,
        kelompok kasir penjual tidak memuat pembatalnya dan penjualan yang
        sudah dibatalkan tetap masuk omzetnya.


        Konsekuensinya disengaja: `voidAmount` melekat pada kasir yang
        PENJUALANNYA dibatalkan, bukan pada yang menekan tombolnya. Manajer
        yang membatalkan sepuluh transaksi kasir lain tidak muncul dengan void
        sepuluh. Penyalahgunaan void dilacak laporan exception FR-G5 lewat
        `audit_event`, yang memang menyimpan aktornya.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Baris per kasir, terurut omzet bersih menurun lalu nama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKasir'
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/payments:
    get:
      operationId: getPaymentReport
      summary: FR-G1 -- uang masuk per metode pembayaran, dengan rekonsiliasi MDR.
      description: >-
        Sejak Modul C-3, setiap baris membawa PERKIRAAN potongan dan perkiraan
        settlement di samping nilai transaksinya (FR-C12). Nilainya dibaca dari
        `payment.mdr_estimated` -- SNAPSHOT saat transaksi, bukan dihitung
        ulang saat laporan dibuat.


        ⛔ `perkiraanMdr` null BERBEDA dari "0": null berarti metode itu tidak
        punya perkiraan sama sekali.


        ⛔ Hanya payment `confirmed` (spec-c:223). Yang masih
        `pending_confirmation` (QRIS dinamis) belum boleh dianggap uang
        masuk, dan `failed` jelas bukan.


        ⛔ Ini BERBEDA dari laporan harian di aplikasi kasir
        (`apps/kasir/src/laporan/harian.ts`), yang menjumlahkan payment tanpa
        menyaring status. Selisihnya muncul hanya bila ada payment
        non-confirmed pada hari itu -- dan bila itu terjadi, angka yang benar
        adalah yang di sini.


        `totalDiterima` BUKAN omzet: omzet bersih mengurangkan refund, dan
        refund tidak menghasilkan baris payment negatif (payment.amount punya
        CHECK amount > 0).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Baris per metode, terurut total menurun.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanPembayaran'
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/recap:
    get:
      operationId: getRecapReport
      summary: FR-C13 -- rekapitulasi penjualan untuk pelaporan pajak.
      description: >-
        Menggantikan integrasi API Coretax (OQ-04). Merchant atau akuntannya
        memakai hasil ini untuk pelaporan.


        ⛔ Angka kepalanya datang dari `rekapPenjualan`, yang memanggil
        `posisiPenjualan` -- fungsi yang SAMA dengan `GET /reports/sales`.
        AC FR-C13 kedua menuntut totalnya cocok dengan laporan penjualan pada
        periode yang sama, dan memakai fungsi yang sama membuat itu benar
        menurut konstruksi, bukan menurut kehati-hatian.


        ⛔ Pajak dipisah per NAMA TARIF dan per YURISDIKSI, dari kolom
        SNAPSHOT `order_line.tax_rate_name` dan `order_line.tax_jurisdiction`.
        Meresolusinya lewat JOIN ke `tax_rate` membuat tarif yang di-rename
        mengubah rekapitulasi periode yang sudah dilaporkan. Baris lama yang
        belum punya snapshot dikelompokkan sebagai null -- jujur, bukan
        ditebak.


        ⛔ `perkiraanMdr` dan `perkiraanSettlement` adalah PERKIRAAN
        (FR-C12), bukan nilai final. Yang menentukan potongan sebenarnya
        adalah penyelenggara, per settlement. `null` berarti metode itu tidak
        punya perkiraan sama sekali -- kartu EDC tidak punya, karena
        tarifnya per-acquirer dan spec tidak memberikan satu pun angkanya.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Rekapitulasi periode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanRekap'
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/export:
    get:
      operationId: getReportExport
      summary: FR-G1 -- keempat laporan sebagai CSV.
      description: >-
        Angkanya datang dari FUNGSI yang sama dengan endpoint JSON
        (`ambilPenjualan`, `ambilProduk`, `ambilKasir`,
        `ambilPembayaran`) -- tidak ada query yang ditulis ulang. CSV adalah
        berkas yang merchant bawa ke akuntannya, dan CSV yang berbeda dari
        layar adalah bentuk terburuk perbedaan angka.


        ⛔ Sel yang diawali `=`, `+`, `-`, `@`, tab, atau CR diawali
        kutip tunggal: Excel dan Google Sheets mengeksekusinya sebagai RUMUS,
        dan nama produk berasal dari input merchant. Korbannya bukan yang
        mengetiknya melainkan akuntan yang membuka berkasnya.


        ⛔ Diawali BOM UTF-8. Tanpanya Excel di Windows membaca CSV sebagai
        ANSI dan setiap nama ber-aksen rusak.


        Uang ditulis apa adanya dari bigint -- tanpa pemisah ribuan dan tanpa
        simbol mata uang, supaya kolomnya dapat dijumlahkan spreadsheet.
      parameters:
        - name: type
          in: query
          required: true
          # SENGAJA tanpa `enum`: handler adalah satu-satunya sumber
          # kebenaran untuk penolakan ini, dan pesannya MENYEBUT pilihan
          # yang sah. AJV menolak lebih dulu dengan "must be equal to one
          # of the allowed values" -- benar, tapi tidak dapat
          # ditindaklanjuti. Pola sama dengan PriceInput.price,
          # TaxRateInput.rate, dan selectionType.
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Berkas CSV. `content-disposition` memuat jenis dan rentangnya.
          content:
            text/csv:
              schema: { type: string }
        '400':
          description: >-
            Parameter `type` atau rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/exceptions/shift-end-voids:
    get:
      operationId: getShiftEndVoidReport
      summary: >-
        FR-G5 X2 -- void mendekati atau sesudah tutup shift.
      description: >-
        ⛔ Yang dibandingkan `audit_event.occurred_at` dengan `shift.closed_at`,
        BUKAN dengan jam sekarang. Shift yang belum ditutup tidak punya "60
        menit terakhir": menghitungnya dari sekarang membuat setiap void pada
        shift berjalan tertandai selama satu jam lalu berhenti tertandai
        sendiri -- laporan yang jawabannya berubah tanpa satu pun data
        berubah.


        Void `sesudah_tutup` selalu di atas: ia keadaan yang BERBEDA, bukan
        sekadar lebih dekat ke penutupan.


        RBAC-nya sama dengan seluruh laporan exception: `report_exception`, dan
        kasir tidak dapat membukanya. Tanpa bahasa menuduh -- tidak ada skor,
        tidak ada label; yang dikembalikan angka dan konteks.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Terurut tingkat anomali -- baris teratas paling layak diselidiki.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, void]
                properties:
                  from: { type: string }
                  to: { type: string }
                  outletId: { type: string, nullable: true }
                  void:
                    type: array
                    items:
                      type: object
                      required: [auditId, occurredAt, posisi, aktorId, orderId, nilai]
                      properties:
                        auditId: { type: string }
                        occurredAt: { type: string }
                        posisi:
                          type: string
                          enum: [akhir_shift, sesudah_tutup]
                        menitKeTutup:
                          type: integer
                          nullable: true
                          description: Menit sebelum tutup; NEGATIF berarti sesudah tutup.
                        aktorId: { type: string }
                        aktorNama: { type: string }
                        orderId: { type: string }
                        receiptNumber: { type: string }
                        nilai: { type: string, description: 'STRING -- bigint rupiah.' }
                        shiftId: { type: string }
                        outletId: { type: string, nullable: true }
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak melihat laporan exception (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/exceptions/high-refunds:
    get:
      operationId: getHighRefundReport
      summary: >-
        FR-G5 X3 -- refund di atas persentil 90, dengan alasan dan penyetujunya.
      description: >-
        ⛔ Persentil, bukan ambang rupiah tetap. Kafe yang omzetnya besar punya
        refund besar; ambang tetap menandai seluruh kasirnya sementara kafe
        kecil tidak pernah menandai siapa pun. spec-g:153 menyebut prinsipnya:
        yang dicari VARIASI, bukan nilai absolut.


        Ambangnya dihitung dari periode YANG DIMINTA dan ikut dikembalikan --
        daftar tanpa ambangnya tidak dapat dijelaskan kepada kasir yang
        namanya ada di sana.


        RBAC-nya sama dengan seluruh laporan exception: `report_exception`, dan
        kasir tidak dapat membukanya. Tanpa bahasa menuduh -- tidak ada skor,
        tidak ada label; yang dikembalikan angka dan konteks.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Terurut tingkat anomali -- baris teratas paling layak diselidiki.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, laporan]
                properties:
                  from: { type: string }
                  to: { type: string }
                  outletId: { type: string, nullable: true }
                  laporan:
                    type: object
                    required: [ambang, jumlahSeluruhRefund, refund]
                    properties:
                      ambang:
                        type: string
                        description: 'Nilai p90 pada periode ini, STRING rupiah.'
                      jumlahSeluruhRefund: { type: integer }
                      refund:
                        type: array
                        items:
                          type: object
                          required: [refundId, occurredAt, nilai, reasonCode, aktorId, penyetujuId]
                          properties:
                            refundId: { type: string }
                            occurredAt: { type: string }
                            nilai: { type: string }
                            reasonCode: { type: string }
                            reasonNote: { type: string, nullable: true }
                            aktorId: { type: string }
                            aktorNama: { type: string }
                            penyetujuId: { type: string }
                            penyetujuNama: { type: string }
                            orderId: { type: string }
                            receiptNumber: { type: string }
                            outletId: { type: string, nullable: true }
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak melihat laporan exception (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/exceptions/no-sales:
    get:
      operationId: getNoSaleExceptionReport
      summary: >-
        FR-G5 X4 -- frekuensi pembukaan laci tanpa transaksi, per kasir per shift.
      description: >-
        Sinyal yang dicari: frekuensi jauh di atas rekan kerja. Dihitung dari
        `audit_event`, bukan dari kolom hitungan -- kolom hitungan adalah angka
        kedua yang harus dijaga sepakat dengan jejaknya, dan yang menyimpang di
        antaranya tidak dapat diputuskan mana yang benar.


        RBAC-nya sama dengan seluruh laporan exception: `report_exception`, dan
        kasir tidak dapat membukanya. Tanpa bahasa menuduh -- tidak ada skor,
        tidak ada label; yang dikembalikan angka dan konteks.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Terurut tingkat anomali -- baris teratas paling layak diselidiki.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, perKasir]
                properties:
                  from: { type: string }
                  to: { type: string }
                  outletId: { type: string, nullable: true }
                  perKasir:
                    type: array
                    items:
                      type: object
                      required: [userId, name, jumlah, jumlahShift, perShift, rasio]
                      properties:
                        userId: { type: string }
                        name: { type: string }
                        jumlah: { type: integer }
                        jumlahShift: { type: integer }
                        perShift: { type: string, description: 'Rata-rata per shift, satu desimal.' }
                        rasio: { type: string, description: 'Terhadap rata-rata seluruh kasir.' }
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak melihat laporan exception (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/exceptions/discounts:
    get:
      operationId: getDiscountExceptionReport
      summary: >-
        FR-G5 X5 -- diskon manual per kasir: nilai, frekuensi, sebaran alasan.
      description: >-
        Sinyal yang dicari bukan diskon besar melainkan diskon yang selalu
        beralasan sama -- karena itu `alasan` ikut, terurut dari yang tersering.


        ⛔ Nilai potongan dibaca dari `audit_event.after.orderDiscount`, BUKAN
        dari `order.order_discount`. Keduanya sama hari ini, tapi audit adalah
        yang mencatat SIAPA yang menekannya, dan itu pertanyaan laporan ini.


        RBAC-nya sama dengan seluruh laporan exception: `report_exception`, dan
        kasir tidak dapat membukanya. Tanpa bahasa menuduh -- tidak ada skor,
        tidak ada label; yang dikembalikan angka dan konteks.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Terurut tingkat anomali -- baris teratas paling layak diselidiki.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, perKasir]
                properties:
                  from: { type: string }
                  to: { type: string }
                  outletId: { type: string, nullable: true }
                  perKasir:
                    type: array
                    items:
                      type: object
                      required: [userId, name, jumlah, nilai, rasio, alasan]
                      properties:
                        userId: { type: string }
                        name: { type: string }
                        jumlah: { type: integer }
                        nilai: { type: string, description: 'STRING -- total rupiah potongan.' }
                        jumlahBerpenyetuju:
                          type: integer
                          description: 'Berapa kali diskonnya menuntut PIN manajer.'
                        rasio: { type: string }
                        alasan:
                          type: array
                          items:
                            type: object
                            required: [reasonCode, jumlah]
                            properties:
                              reasonCode: { type: string }
                              jumlah: { type: integer }
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak melihat laporan exception (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/exceptions/cash-variance:
    get:
      operationId: getCashVarianceExceptionReport
      summary: >-
        FR-G5 X7 -- selisih kas per kasir, dengan trennya.
      description: >-
        Sinyal yang dicari: selisih KONSISTEN SATU ARAH. Kasir yang kurang
        Rp 5.000 sekali adalah manusia; kasir yang kurang setiap shift adalah
        pola.


        ⛔ `totalSelisih` DAN `totalMutlak` keduanya dikembalikan, dan itu
        bukan kelebihan data: kasir yang kurang Rp 50.000 lalu lebih Rp 50.000
        punya total nol dan mutlak Rp 100.000 -- dua angka yang menceritakan
        hal yang sangat berbeda.


        Selisih TIDAK di-clamp ke positif; arahnya adalah informasinya.


        RBAC-nya sama dengan seluruh laporan exception: `report_exception`, dan
        kasir tidak dapat membukanya. Tanpa bahasa menuduh -- tidak ada skor,
        tidak ada label; yang dikembalikan angka dan konteks.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Terurut tingkat anomali -- baris teratas paling layak diselidiki.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, perKasir]
                properties:
                  from: { type: string }
                  to: { type: string }
                  outletId: { type: string, nullable: true }
                  perKasir:
                    type: array
                    items:
                      type: object
                      required: [userId, name, jumlahShift, totalSelisih, totalMutlak, tren]
                      properties:
                        userId: { type: string }
                        name: { type: string }
                        jumlahShift: { type: integer }
                        totalSelisih: { type: string, description: 'STRING -- boleh NEGATIF.' }
                        totalMutlak: { type: string }
                        jumlahKurang: { type: integer }
                        jumlahLebih: { type: integer }
                        tren:
                          type: string
                          enum: [naik, turun, datar]
                          description: >-
                            `datar` juga berarti deretnya terlalu pendek untuk
                            menunjukkan kecenderungan -- dua shift tidak
                            menunjukkan apa pun.
                        deret:
                          type: array
                          items: { type: string }
                          description: Selisih per shift, terurut waktu.
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak melihat laporan exception (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/exceptions/clock:
    get:
      operationId: getClockExceptionReport
      summary: >-
        FR-G5 X8 -- anomali waktu: perangkat yang jamnya menyimpang dari jam
        server (FR-F8).
      description: >-
        ⛔ Membaca `audit_event` bertipe `clock_drift_detected`, BUKAN selisih
        `occurred_at` vs `recorded_at`. spec-g:164 menggambarkan X8 sebagai
        selisih besar keduanya "DI LUAR DURASI OFFLINE YANG WAJAR", dan
        kalimat terakhir itu yang menentukan: selisih keduanya adalah durasi
        offline pada hampir setiap penjualan yang produk ini ada untuk
        mendukung. Melaporkannya apa adanya menghasilkan daftar yang seluruh
        isinya penjualan sehat, dan daftar semacam itu berhenti dibaca pada
        minggu pertama.


        Yang tidak dapat dijelaskan durasi offline adalah dua jam yang
        sama-sama mengaku "sekarang" tapi berbeda -- dicatat saat perangkat
        me-relay penjualan, dibatasi satu per perangkat per jam supaya satu
        tablet yang salah setel tidak mengubur seluruh audit trail.


        ⛔ Diurutkan berdasarkan BESAR selisih, bukan waktu (spec-g:166:
        "baris teratas adalah yang paling layak diselidiki").


        ⛔ Tanpa bahasa menuduh. Jam yang meleset jauh lebih sering berarti
        baterai RTC tablet habis daripada berarti seseorang memanipulasinya.


        RBAC-nya sama dengan X1: `report_exception`, dan kasir tidak dapat
        membukanya.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Daftar anomali, terurut dari selisih terbesar.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, ambangDetik, anomali]
                properties:
                  from: { type: string }
                  to: { type: string }
                  outletId: { type: string, nullable: true }
                  ambangDetik:
                    type: integer
                    description: >-
                      spec-f:354 -- selisih di atas ini yang dicatat. Ikut di
                      respons supaya layar tidak menyalinnya.
                  anomali:
                    type: array
                    items:
                      type: object
                      required: [auditId, occurredAt, deviceId, aktorId, skewDetik]
                      properties:
                        auditId: { type: string }
                        occurredAt: { type: string }
                        deviceId: { type: string }
                        deviceCode: { type: string, nullable: true }
                        outletId: { type: string, nullable: true }
                        aktorId: { type: string }
                        aktorNama: { type: string }
                        skewDetik:
                          type: integer
                          description: Positif = jam perangkat MAJU terhadap server.
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak melihat laporan exception (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/daily-summary:
    get:
      operationId: getDailySummary
      summary: FR-G6 -- ringkasan satu hari untuk HP (M-01).
      description: >-
        `spec-g:212`: *"Persona P3 membuka aplikasi pukul 23:00 di HP 390x844
        untuk satu pertanyaan: hari ini bagaimana, dan apakah ada yang aneh."*


        ⛔ Angkanya dari `ambilPenjualan` dan `ambilPembayaran` -- fungsi yang
        SAMA yang /reports/sales dan /reports/payments pakai. Owner yang
        melihat omzet berbeda tergantung layar mana yang ia buka akan
        mempercayai yang ia lihat pukul 23:00, dan itu yang paling jarang
        diperiksa ulang.


        ⛔ Delta dibandingkan rata-rata HARI YANG SAMA empat minggu terakhir
        (spec-g:243), bukan hari sebelumnya. Omzet kafe pada Sabtu dan Selasa
        berbeda jauh dan itu normal; delta terhadap hari sebelumnya membuat
        SETIAP SENIN terlihat seperti bencana dan setiap Jumat seperti rekor --
        dua sinyal palsu setiap minggu, selamanya.


        ⛔ `tren.deltaPersen` bernilai `null` bila belum ada cukup hari
        pembanding, dan itu BUKAN nol. Merchant yang baru dua minggu berjualan
        tidak punya empat Senin sebelumnya; "0%" untuknya adalah pernyataan
        yang salah -- ia mengaku omzet hari ini persis sama dengan
        kebiasaannya, dan kebiasaan itu belum ada. `basisMinggu` menyatakan
        seberapa kasar pembandingnya.


        ⛔ `rataRataPerTransaksi` bernilai `null` untuk NOL transaksi, bukan
        "Rp 0 per transaksi" -- yang kedua mengaku ada transaksi bernilai nol.


        ⛔ `perOutlet` (AC FR-G6 keempat) bernilai `null` saat `outlet_id`
        DISEBUT, bukan larik berisi satu baris -- rincian dari satu outlet
        mengulang angka yang sudah tertera di atasnya, dan pengulangan itu
        membuat pembacanya mencari perbedaan yang tidak ada. Outlet tanpa
        transaksi tidak muncul sebagai baris nol. Barisnya dihitung
        `posisiPenjualan` yang sama dengan totalnya, jadi menjumlahkannya
        selalu menghasilkan `omzetBersih`.


        Uang selalu STRING: `bigint` tidak dapat melewati JSON, dan `Number`
        membuang presisi di atas 2^53.
      parameters:
        - name: date
          in: query
          required: false
          description: >-
            Tanggal BISNIS, bentuk YYYY-MM-DD. DIKOSONGKAN berarti hari ini,
            dan yang menghitungnya SERVER -- dari jam database, zona outlet,
            dan jam tutupnya. Jam HP dapat salah (FR-F8 ada justru karena jam
            perangkat berbohong cukup sering untuk perlu dideteksi), dan HP
            yang jamnya maju satu hari akan meminta ringkasan hari yang belum
            terjadi lalu menerima nol transaksi tanpa satu pun error.
            Tanpa `outlet_id`, "hari ini" hanya dapat dijawab bila SELURUH
            outlet aktif sepakat zona waktu dan jam tutupnya -- kalau tidak,
            400 BUSINESS_DATE_AMBIGUOUS.
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { description: "Ringkasan satu hari" }
        "400":
          description: >-
            Tanggal tidak valid (VALIDATION_ERROR), atau "hari ini" tidak dapat
            diputuskan karena outlet memakai zona atau jam tutup berbeda
            (BUSINESS_DATE_AMBIGUOUS).
        "403": { description: "Tidak berhak" }
        "404": { description: "Outlet tidak ditemukan" }

  /printer-profiles:
    get:
      operationId: listPrinterProfiles
      summary: Daftar profil printer. Data referensi hardware global.
      description: >-
        `ERD:445`: `printer_profile` adalah "data, bukan kode -- menambah model
        printer = menambah baris". Tabelnya DIKECUALIKAN dari RLS: ia tidak
        punya `tenant_id`, dan tidak satu pun kolomnya menyebut merchant mana
        pun. Konsekuensinya dinyatakan -- setiap merchant dapat membacanya.


        ⛔ `ORDER BY name` dinyatakan di query. Daftar tanpa urutan adalah
        tepat cacat yang endpoint ini ada untuk memperbaikinya: sebelum ini,
        K-09 dan K-15 memilih profil dengan `p[0]` dari query yang tidak punya
        `ORDER BY` sama sekali.
      responses:
        "200": { description: "Daftar profil, urut nama" }
        "404": { description: "Aktor tidak ditemukan" }

  /peripherals:
    get:
      operationId: listPeripherals
      summary: Peripheral yang terpasang, per outlet atau per perangkat.
      parameters:
        - name: device_id
          in: query
          required: false
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { description: "Daftar peripheral" }
        "404": { description: "Aktor tidak ditemukan" }
    post:
      operationId: configurePeripheral
      summary: Mendaftarkan atau mengonfigurasi ulang satu peripheral.
      description: >-
        Menutup lubang TERAKHIR audit trail FR-F6 (`peripheral_configured`).


        ⛔ Yang sebenarnya rusak sebelum ini: `printer_profile` sudah turun ke
        perangkat, dan K-09/K-15 memilih profil dengan `p[0]` -- baris PERTAMA
        yang query kembalikan, dari query tanpa `ORDER BY`. Merchant dengan
        tiga model printer mencetak dengan profil yang dipilih urutan baris,
        bukan dengan printer yang benar-benar tercolok. Tidak ada satu pun
        error: struk 80 mm dipotong di kolom 32, atau perintah potong tercetak
        sebagai karakter sampah.


        ⛔ Pengiriman ulang dengan `id` yang sama MEMPERBARUI barisnya, bukan
        ditolak ID_ALREADY_EXISTS. Kasir mengubah profil printernya berkali-kali
        sampai strukanya benar, dan setiap perubahan adalah konfigurasi ULANG
        peripheral yang sama. Invariant #2 menjaga transaksi selesai dan
        katalog, bukan setelan perangkat -- dan riwayat perubahannya ada di
        `audit_event`, dengan `before` memuat keadaan sebelumnya.


        ⛔ Perintah printer TIDAK diterima dari klien, hanya
        `printerProfileId`. Perangkat yang dapat mengarang perintahnya sendiri
        adalah perangkat yang dapat mengirim byte apa pun ke printer merchant.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, type, connection]
              properties:
                id: { type: string, description: "ULID/UUIDv7 di-generate klien." }
                deviceId: { type: string, nullable: true }
                outletId: { type: string }
                type: { type: string, enum: [printer, drawer, scanner, display] }
                connection: { type: string, enum: [usb, bluetooth, network] }
                address: { type: string, nullable: true }
                printerProfileId: { type: string, nullable: true }
                hlc: { type: string }
                occurredAt: { type: string }
      responses:
        "201":
          description: >-
            Tersimpan. `baru` membedakan pendaftaran pertama dari konfigurasi
            ulang -- keduanya 201, dan perbedaannya kalimat yang berbeda di
            layar.
          content:
            application/json:
              schema:
                type: object
                required: [id, outletId, type, connection, baru]
                properties:
                  id: { type: string }
                  deviceId: { type: string, nullable: true }
                  outletId: { type: string }
                  type: { type: string }
                  connection: { type: string }
                  address: { type: string, nullable: true }
                  printerProfileId: { type: string, nullable: true }
                  baru: { type: boolean }
        "400": { description: "Muatan tidak valid, atau Idempotency-Key hilang" }
        "403": { description: "Tidak berhak" }
        "404":
          description: >-
            Outlet, perangkat, atau profil printer tidak ditemukan
            (OUTLET_NOT_FOUND / DEVICE_NOT_FOUND / PRINTER_PROFILE_NOT_FOUND).

  /reports/needs-attention:
    get:
      operationId: getNeedsAttention
      summary: M-01/M-02 -- hal yang perlu diperiksa, untuk Owner mobile.
      description: >-
        `IA:§8` mendaftarkan oversell terdeteksi dan pembayaran
        `pending_confirmation` lebih dari 24 jam sebagai isi bagian "perlu
        diperiksa" di Owner mobile; `spec-g:231` menggambar selisih kas di
        wireframe M-01 yang sama.


        ⛔ Ia TERTUNGGAK, bukan "terjadi hari ini", dan karena itu tidak
        disaring per tanggal. Oversell yang belum ditindaklanjuti tiga hari
        lalu masih perlu ditindaklanjuti malam ini, dan pembayaran yang
        menggantung 48 jam lebih mendesak daripada yang 25 jam. Daftar yang
        hanya memuat temuan hari ini mengosongkan dirinya setiap tengah malam.


        ⛔ `jumlah` adalah TOTAL, bukan panjang `temuan`. M-01 hanya
        menampilkan tiga (IA:373); tiga dari sembilan yang tidak menyebut
        sembilan mengecilkan apa yang menunggu.


        ⛔ Yang dikirim DATA, bukan kalimat. Tanpa skor, tanpa label, tanpa
        kata yang menyalahkan siapa pun (spec-g:168) -- kalimatnya disusun di
        klien, tempat yang sama yang menyusun kalimat lain di layar itu.


        Uang dan kuantitas selalu STRING.
      parameters:
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Daftar tertunggak, terbaru lebih dulu.
          content:
            application/json:
              schema:
                type: object
                required: [outletId, jumlah, temuan]
                properties:
                  outletId: { type: string, nullable: true }
                  jumlah: { type: integer }
                  temuan:
                    type: array
                    items:
                      type: object
                      required: [jenis, id, outletId, outletNama, nilai, terjadiPada, keterangan]
                      properties:
                        jenis:
                          type: string
                          enum: [oversell, selisih_kas, pembayaran_menggantung]
                        id: { type: string }
                        outletId: { type: string }
                        outletNama: { type: string, nullable: true }
                        nilai: { type: string }
                        terjadiPada: { type: string }
                        keterangan: { type: string, nullable: true }
        "403": { description: "Tidak berhak" }
        "404": { description: "Outlet tidak ditemukan" }

  /reports/stale-price-devices:
    get:
      operationId: getStalePriceDevices
      summary: FR-A7 -- perangkat yang belum menerima perubahan harga terakhir.
      description: >-
        `spec-a:220` menyatakan bahwa perangkat offline yang memakai harga lama
        adalah BENAR: itulah harga yang tercetak dan dibayar pelanggan. Yang
        TIDAK benar adalah merchant yang menaikkan harga lalu tidak tahu bahwa
        satu kasirnya masih menjual dengan harga lama -- berhari-hari, tanpa
        satu pun error di mana pun.


        ⛔ "Terakhir terlihat" adalah PROKSI, bukan bukti, dan arahnya SATU
        ARAH. Checkpoint PowerSync hidup di tabel `ps_*` MILIK PERANGKAT dan
        server kami tidak dapat membacanya; yang server tahu hanya kapan
        perangkat terakhir meminta token sinkronisasi.


        - `last_seen_at < effective_from` → perangkat PASTI belum menerimanya.

        - `last_seen_at >= effective_from` → BELUM TENTU sudah; replikasinya
          mungkin masih berjalan.


        Layar wajib menyatakan asimetri itu. Merchant yang membaca daftar
        kosong sebagai "semua perangkat sudah memakai harga baru" menyimpulkan
        lebih dari yang datanya dukung -- karena itu `jumlahDiperiksa` ikut di
        respons: daftar kosong dari NOL perangkat berarti hal yang sangat
        berbeda dari daftar kosong dari sepuluh perangkat.


        ⛔ Harga ber-`effective_from` di MASA DEPAN tidak dihitung tertinggal.
        Harga terjadwal memang belum berlaku untuk siapa pun, dan perangkat
        yang belum menerimanya belum kehilangan apa pun.


        ⛔ RBAC `price_edit`, bukan operasi baru: yang bertanya "perangkat mana
        yang belum menerima harga baru" adalah orang yang baru mengubah harga
        itu.
      parameters:
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Perangkat yang tertinggal, paling lama tidak terlihat lebih dulu.
        "403": { description: "Tidak berhak mengubah harga" }
        "404": { description: "Outlet tidak ditemukan" }

  /audit-events:
    get:
      operationId: getAuditEvents
      summary: >-
        B-22 Audit & Aktivitas -- satu halaman audit trail, terbaru lebih
        dulu. FR-F6, FR-F7.
      description: >-
        ⛔ Paginasi KEYSET, bukan offset. Perangkat yang antreannya terkuras
        menyisipkan baris ber-`occurred_at` historis DI TENGAH urutan; offset
        akan melewatkan atau menggandakan baris tepat saat antrean bergerak,
        dan baris audit yang terlewat tidak meninggalkan lubang yang terlihat.
        Kursornya pasangan `(occurred_at, id)` -- sama dengan primary key
        tabel -- dan klien memperlakukannya sebagai nilai buram.


        ⛔ Rentang memakai `occurred_at`, bukan `business_date` sebuah order.
        Sebagian besar peristiwa di sini tidak menempel pada order mana pun,
        dan yang menempel pun tidak boleh hilang dari trail karena ordernya
        bertanggal bisnis lain.


        ⛔ `before`/`after` TIDAK dikembalikan. Keduanya muatan bebas yang pada
        `item_updated` akan memuat `cost`, dan FR-F5 melarang HPP sampai ke
        mata yang tidak berhak. Detail perubahan punya layarnya sendiri (B-03
        untuk transaksi, B-13 untuk stok) dengan batasnya masing-masing.


        ⛔ Jenis peristiwa yang tidak dikenal DITOLAK, bukan dijawab nol baris.
        Nol baris terlihat persis seperti "tidak ada yang melakukannya", dan
        salah ketik pada saringan audit adalah cara paling mudah menyimpulkan
        hal yang salah tentang seseorang.


        ⛔ Setiap saringan yang dipakai ikut dikembalikan. Daftar audit yang
        tidak menyebut apa yang sedang disaring terbaca seperti daftar lengkap.


        RBAC `report_exception`. Matriks spec-f:38-53 tidak punya baris untuk
        audit trail; himpunan peran `report_exception` (owner, manajer area,
        manajer outlet, akuntan) sama persis dengan minimum IA:201, dan isi
        trail adalah superset dari X1 yang matriks sudah berikan kepada
        keempatnya. [ASUMSI] yang dinyatakan, bukan operasi karangan baru.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: event_type
          in: query
          required: false
          description: Satu nilai dari daftar tertutup; yang asing ditolak 400.
          schema: { type: string }
        - name: actor_user_id
          in: query
          required: false
          schema: { type: string }
        - name: entity_id
          in: query
          required: false
          description: Menelusuri satu objek -- mis. seluruh peristiwa satu order.
          schema: { type: string }
        - name: support_only
          in: query
          required: false
          description: >-
            F.5 -- hanya tindakan yang dilakukan selama sesi akses support.
            Hanya nilai `true` yang menyalakannya; apa pun selain itu tidak
            menyaring, sehingga form yang belum diisi tidak diam-diam
            menyembunyikan seluruh audit non-support.


            ⛔ TIDAK ADA kebalikannya. "Sembunyikan tindakan support" adalah
            saringan yang membuat audit dapat menyembunyikan sebagian dirinya,
            dan yang paling ingin memakainya adalah pihak yang tindakannya
            sedang diperiksa.


            Penandanya (`supportSessionId` dan `supportAdmin`) ikut di SETIAP
            baris apa pun saringannya: baris yang dilakukan support terlihat
            sama persis dengan baris yang orang merchant lakukan sendiri kalau
            penandanya tidak dibawa.
          schema: { type: string, enum: ["true"] }
        - name: cursor
          in: query
          required: false
          description: Nilai buram dari `kursorBerikut` halaman sebelumnya.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Dijepit ke 200; bukan ditolak.
          schema: { type: string }
      responses:
        '200':
          description: Satu halaman audit trail.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, batas, peristiwa, belumDipancarkan]
                properties:
                  from: { type: string }
                  to: { type: string }
                  outletId: { type: string, nullable: true }
                  eventType: { type: string, nullable: true }
                  actorUserId: { type: string, nullable: true }
                  entityId: { type: string, nullable: true }
                  hanyaSupport:
                    type: boolean
                    description: >-
                      Saringan yang sedang aktif. Ia ikut dikembalikan karena
                      daftar audit yang tidak menyebut apa yang disaring
                      terbaca seperti daftar lengkap.
                  batas: { type: integer }
                  kursorBerikut:
                    type: string
                    nullable: true
                    description: >-
                      `null` berarti halaman terakhir. Server mengambil satu
                      baris lebih banyak daripada yang diminta justru supaya
                      halaman penuh yang kebetulan pas tidak menghasilkan
                      tombol yang membuka halaman kosong.
                  belumDipancarkan:
                    type: array
                    description: >-
                      Peristiwa yang spec-f:288 sebut dan kode belum pancarkan,
                      diturunkan di domain. FR-F6 AC pertama menuntut setiap
                      event dalam daftar menghasilkan record; ini jarak yang
                      tersisa ke sana. Layar menyebutkannya -- trail berlubang
                      yang terlihat lengkap adalah bentuk paling berbahaya dari
                      trail yang tidak lengkap.
                    items: { type: string }
                  peristiwa:
                    type: array
                    items:
                      type: object
                      required:
                        [id, occurredAt, recordedAt, eventType, aktorId, aktorNama]
                      properties:
                        id: { type: string }
                        occurredAt: { type: string }
                        recordedAt: { type: string }
                        eventType: { type: string }
                        kelompok:
                          type: string
                          nullable: true
                          description: >-
                            Kelompok pada tabel spec-f:288. `null` untuk nama
                            yang tidak lagi dipancarkan siapa pun -- baris lama
                            tidak dapat ditulis ulang (invariant #2).
                        entityType: { type: string, nullable: true }
                        entityId: { type: string, nullable: true }
                        aktorId: { type: string }
                        aktorNama: { type: string }
                        penyetujuId:
                          type: string
                          nullable: true
                          description: >-
                            FR-F7 -- identitas kedua. `null` bermakna: operasi
                            ini memang tidak menuntut persetujuan.
                        penyetujuNama: { type: string, nullable: true }
                        outletId: { type: string, nullable: true }
                        outletNama: { type: string, nullable: true }
                        deviceId: { type: string, nullable: true }
                        deviceKode: { type: string, nullable: true }
                        reasonCode: { type: string, nullable: true }
                        reasonNote: { type: string, nullable: true }
                        supportSessionId:
                          type: string
                          nullable: true
                          description: >-
                            F.5 -- PENANDA sesi akses support. `null` berarti
                            tindakan ini dilakukan langsung oleh orang
                            merchant.


                            ⛔ Ia ikut di SETIAP baris, bukan hanya saat
                            disaring: `aktorId` pada baris support adalah OWNER
                            YANG MENYETUJUI akses itu -- nama yang benar secara
                            faktual, dan yang akan dibaca sebagai "owner
                            melakukannya sendiri" oleh siapa pun yang tidak
                            melihat penanda ini.
                        supportAdmin:
                          type: string
                          nullable: true
                          description: >-
                            Nama petugas support sebagaimana merchant
                            menuliskannya saat menyetujui.
        '400':
          description: >-
            Rentang, kursor, batas, atau jenis peristiwa tidak valid
            (VALIDATION_ERROR / INVALID_CURSOR / UNKNOWN_EVENT_TYPE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak melihat audit trail (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reports/exceptions/voids:
    get:
      operationId: getVoidExceptionReport
      summary: >-
        FR-G5 X1 -- void & refund per PELAKU, pada rentang tanggal bisnis.
      description: >-
        ⛔ Menjawab pertanyaan yang `/reports/cashiers` sengaja TIDAK jawab.
        Laporan kasir melekatkan `voidAmount` pada kasir yang PENJUALANNYA
        dibatalkan -- supaya jumlah seluruh kasir sama dengan laporan global.
        Di sini yang dilacak adalah yang MENEKAN TOMBOL
        (`audit_event.actor_user_id`).


        Keduanya benar untuk pertanyaan berbeda. Sejak keputusan 1 Agustus 2026
        menghapus PIN manajer dari void, ini satu-satunya kontrol yang tersisa
        terhadap penyalahgunaannya.


        ⛔ SATU-SATUNYA endpoint laporan yang menuntut operasi RBAC eksplisit
        (`report_exception`). Keempat laporan lain hanya menuntut sesi yang
        sah, dan itu benar: omzet outletnya sendiri bukan rahasia dari kasir.
        Daftar siapa-membatalkan-apa adalah. AC spec-g: "Kasir tidak dapat
        mengakses laporan exception".


        ⛔ Nilai uang datang dari `order.total` lewat JOIN, BUKAN dari
        `audit_event.before`. Payload audit sempat menulis `Number(total)`
        atas bigint; baris lama tidak di-backfill, jadi laporan tidak boleh
        mempercayainya.


        ⛔ Tanpa bahasa menuduh: tidak ada skor, tidak ada label. `rasio`
        dibandingkan terhadap RATA-RATA seluruh pelaku pada periode ini, sebagai
        STRING satu angka desimal -- ia satu-satunya angka yang diurutkan, dan
        urutan yang berpindah antar-muat adalah laporan yang tidak dapat
        dipercaya.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            Ringkasan per pelaku (terurut tingkat anomali) beserta daftar
            peristiwa untuk drill-down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanException'
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Aktor tidak berhak melihat laporan exception (FORBIDDEN). Kasir
            selalu mendarat di sini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/transactions/{order_id}:
    get:
      operationId: getTransactionDetail
      summary: B-03 -- detail satu transaksi, digabung dari empat modul.
      description: >-
        Dilayani modul reporting, satu-satunya modul yang boleh MEMBACA lintas
        domain: satu struk menurut definisi menggabungkan order (ordering),
        pembayaran (payment), nama kasir (identity), dan refund. Modul itu
        tidak memiliki satu tabel pun dan tidak menulis apa pun -- kedua sifat
        itulah yang membuat izin bacanya aman.


        Uang seluruhnya STRING. tenderedAmount dan changeAmount boleh null
        untuk metode non-tunai, dan null DIPERTAHANKAN: "Tunai diterima:
        Rp 0" adalah pernyataan yang salah, bukan sekadar kosong.


        quantityMilli adalah kuantitas x1000.


        404 dipakai untuk transaksi yang tidak ada MAUPUN milik tenant lain,
        dengan pesan yang sama persis.
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detail transaksi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailTransaksi'
        '404':
          description: Transaksi tidak ditemukan, atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/cleanup-abandoned:
    post:
      operationId: cleanupAbandonedOrders
      summary: Menutup keranjang mati dan membebaskan stok yang dikuncinya.
      description: >-
        Movement sale ditulis saat order DIBUAT, bukan saat dibayar. Order yang
        dibuat lalu ditinggalkan karena itu memegang stok selamanya, dan
        keputusan B-02 menyembunyikan keranjang open dari daftar transaksi --
        jadi stok berkurang karena order yang tidak dapat dilihat siapa pun.


        Endpoint ini mencari order berstatus open yang recorded_at-nya lebih
        tua dari 24 jam, membalik movement sale-nya, dan mengubah statusnya
        menjadi abandoned. Ambangnya memakai recorded_at (jam database), BUKAN
        occurred_at (jam perangkat, yang dapat menyimpang dan mundur).


        Aman dijalankan berulang: putaran kedua tidak menemukan order yang sama
        karena statusnya sudah bukan open.


        Menuntut operasi stock_adjust -- efeknya membebaskan stok, dan itu
        tingkat manajer.
      responses:
        '200':
          description: Ringkasan pembersihan.
          content:
            application/json:
              schema:
                type: object
                required:
                  [jamKedaluwarsa, jumlahDibersihkan, movementDitulis,
                   totalStokDikembalikan, orderIds]
                properties:
                  jamKedaluwarsa: { type: integer }
                  jumlahDibersihkan: { type: integer }
                  movementDitulis: { type: integer }
                  totalStokDikembalikan:
                    type: string
                    description: Kuantitas x1000, STRING.
                  orderIds:
                    type: array
                    items: { type: string }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/movements:
    post:
      operationId: createStockMovement
      summary: B-13 -- mencatat barang masuk atau koreksi stok.
      description: >-
        Satu-satunya jalan MEMASUKKAN stok ke sistem. Hanya menerima tipe
        receipt dan adjustment; sale, void, dan refund lahir dari transaksi
        penjualan di transaksi database yang sama dengannya, dan menerimanya
        di sini membuka jalan menulis pergerakan penjualan tanpa penjualannya.


        adjustment WAJIB menyertakan reasonCode (AC FR-E2). receipt wajib
        positif -- tanpa aturan itu, receipt negatif menjadi cara mengurangi
        stok tanpa alasan, persis yang adjustment diwajibkan menyertakannya.


        delta adalah kuantitas x1000 bertanda, dikirim sebagai STRING.


        Menuntut operasi stock_adjust.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId, variationId, type, delta]
              properties:
                id: { type: string }
                outletId: { type: string }
                variationId: { type: string }
                type:
                  type: string
                  description: 'receipt | adjustment'
                delta:
                  type: string
                  description: Kuantitas x1000, bertanda.
                reasonCode: { type: string, nullable: true }
                note: { type: string, nullable: true }
                unitCost: { type: string, nullable: true }
      responses:
        '201':
          description: Movement tercatat.
          content:
            application/json:
              schema:
                type: object
                required: [id, outletId, variationId, type, delta]
                properties:
                  id: { type: string }
                  outletId: { type: string }
                  variationId: { type: string }
                  type: { type: string }
                  delta: { type: string }
                  reasonCode: { type: string, nullable: true }
        '400':
          description: Tipe, delta, atau alasan tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Outlet atau variation tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/sold-out:
    post:
      operationId: markSoldOut
      summary: FR-E5 -- menandai (atau membatalkan penandaan) produk habis.
      description: >-
        `spec-e:203`: *"Barista tahu kopi habis sebelum sistem tahu. Alur ini
        lebih andal daripada hitungan otomatis dan wajib ada."*


        ⛔ Penandaan sudah berjalan di perangkat sejak F3, tapi LOKAL SAJA --
        endpoint ini yang menutup jalur naiknya. Tanpa itu, barista yang
        menandai kopi habis di terminal 1 tidak menghentikan kasir di terminal
        2 menerima pesanannya.


        ⛔ Jalur PERANGKAT: dipanggil relay outbox, yang tidak mengirim
        `Authorization` sama sekali. Ia karena itu ada di `RUTE_TERBUKA`
        bersama `/orders` dan `/shifts`.


        ⛔ Tabel LOG, tanpa `UPDATE`. Dua perangkat yang menandai produk yang
        sama saat offline sama-sama menulis, dan yang menang ditentukan HLC --
        bukan baris yang kebetulan tiba belakangan. Server hanya menyisipkan;
        siapa yang menang dijawab saat DIBACA.


        ⛔ Penandaan habis TIDAK PERNAH menyimpulkan stok, dan stok tidak
        pernah menyimpulkan penandaan (`spec-e:220`). Endpoint ini tidak
        menyentuh `stock_movement` sama sekali.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: >-
            WAJIB, dan sengaja tidak ditandai `required` -- validator menjawab
            `400 VALIDATION_ERROR`, sementara yang dimaksud adalah
            `MISSING_IDEMPOTENCY_KEY`. Pola yang sama dengan endpoint idempoten
            lain di API ini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId, variationId, isSoldOut]
              properties:
                id:
                  type: string
                  description: Di-generate klien. Dikosongkan berarti server yang membuatnya.
                outletId: { type: string, minLength: 1 }
                variationId: { type: string, minLength: 1 }
                isSoldOut:
                  type: boolean
                  description: >-
                    ⛔ Membatalkan penandaan adalah baris tersendiri bernilai
                    `false`, bukan penghapusan. Kalau hanya baris bernilai
                    `true` yang pernah ditulis, produk yang sudah tersedia lagi
                    tetap terlihat habis selamanya.
                hlc:
                  type: string
                  description: >-
                    HLC perangkat, string bilangan bulat desimal. Klien yang
                    tidak mengirimnya memakai jam server.
                occurredAt:
                  type: string
                  description: Waktu perangkat. Dikosongkan berarti jam database.
      responses:
        '201':
          description: Penandaan tercatat.
          content:
            application/json:
              schema:
                type: object
                required: [id, outletId, variationId, isSoldOut, hlc]
                properties:
                  id: { type: string }
                  outletId: { type: string }
                  variationId: { type: string }
                  isSoldOut: { type: boolean }
                  hlc: { type: string }
        '400':
          description: Payload tidak valid atau Idempotency-Key hilang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            Aktor, outlet, atau variation tidak ditemukan (VARIATION_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Idempotency-Key sedang diproses (IDEMPOTENCY_KEY_CONFLICT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/inventory/stocks:
    get:
      operationId: getInventoryStocks
      summary: B-12 -- saldo stok per varian, dari SUM(delta).
      description: >-
        Dilayani modul reporting: saldo butuh stock_movement (milik inventory)
        DAN nama produk (milik catalog), dan modul itu satu-satunya yang boleh
        membaca lintas domain.


        Saldo dihitung SUM(delta), bukan dibaca dari stock_snapshot -- tabel
        itu ada di skema server dan kosong, dan memakainya berarti membangun
        keadaan kedua yang dapat basi untuk mempercepat sesuatu yang belum
        pernah diukur lambat.


        saldoMilli adalah kuantitas x1000 sebagai STRING; saldo adalah bentuk
        terbacanya, dihitung dari bilangan bulat. Pembagian 1000 TIDAK
        dilakukan di SQL -- pembagian integer atas bigint membuat 2500 menjadi
        2, dan setengah kilogram menghilang tanpa error.


        include_zero=true menyertakan varian yang belum punya movement sama
        sekali, dan hanya berlaku bila outlet_id diberikan -- tanpa outlet yang
        jelas, saldo nol tidak dapat dibentuk. Varian itu justru yang paling
        perlu terlihat: barang baru yang stoknya belum pernah dimasukkan.
      parameters:
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: only_negative
          in: query
          required: false
          schema: { type: string }
        - name: include_zero
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Saldo stok per varian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarStok'
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/{shiftId}/count-attempts:
    post:
      operationId: recordCountAttempt
      summary: FR-D2/FR-D3 -- satu percobaan hitungan kas, jalur tulis tersendiri.
      description: >-
        `spec-d:127`: *"Kasir tidak dapat mengubah hitungan fisik setelah
        melihat selisih. Untuk mengoreksi, kasir memasukkan hitungan ulang yang
        tercatat sebagai PERCOBAAN KEDUA di audit trail."*


        ⛔ Endpoint TERSENDIRI, dan itu inti persoalannya. Percobaan yang
        DITOLAK -- selisih melewati ambang tanpa penyetuju -- dilempar
        `closeShift` SEBELUM satu pun UPDATE, dan seluruh transaksinya
        di-rollback. Mencatatnya dari sana berarti tidak mencatatnya sama
        sekali. Dan justru percobaan yang gagal itulah yang spec ingin
        buktikan tidak dapat diulang diam-diam: kasir yang mencoba
        Rp 2.450.000, melihat selisihnya, lalu mengetik Rp 2.485.000 supaya
        cocok, meninggalkan jejak NOL di jalur tutup kas.


        ⛔ Ia TIDAK menyentuh `cash_drawer_shift` sama sekali, dan itu yang
        membuatnya aman. Endpoint yang menulis percobaan DAN memperbarui shift
        akan menjadi jalan kedua menuju penutupan -- tanpa pemeriksaan ambang,
        tanpa penyetuju, tanpa buku kas. Yang ditulis di sini hanya JEJAK.


        ⛔ Shift yang sudah TERTUTUP tetap menerima percobaan. Yang dikirim
        terlambat -- perangkat yang antreannya baru terkuras -- adalah jejak
        dari SEBELUM penutupan, dan menolaknya menghapus jejak justru pada
        perangkat yang paling lama offline.
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, countedAmount, attemptNumber]
              properties:
                id: { type: string }
                countedAmount:
                  type: string
                  description: Rupiah utuh sebagai STRING, konvensi jalur kas.
                attemptNumber: { type: integer, minimum: 1 }
                occurredAt: { type: string }
      responses:
        "201": { description: "Percobaan tercatat di audit" }
        "400": { description: "Muatan tidak valid" }
        "403": { description: "Tidak berhak" }
        "404": { description: "Shift tidak ditemukan" }

  /shifts/{shiftId}/cash-movements:
    post:
      operationId: recordCashMovement
      summary: FR-D5 -- kas masuk / kas keluar di luar penjualan.
      description: >-
        ⛔ Ketiadaannya adalah cacat yang menghasilkan SELISIH PALSU. Saldo laci
        adalah `saldo_awal + SUM(cash_movement.delta)` (spec-d:14); owner yang
        mengambil Rp 500.000 dari laci untuk membayar pemasok tanpa cara
        mencatatnya membuat tutup kas melaporkan kekurangan Rp 500.000,
        menuntut otorisasi manajer untuk selisih yang sepenuhnya dapat
        dijelaskan, dan laporan exception FR-G5 menandai kasirnya.


        ⛔ TANPA PIN manajer, ditiru dari keputusan void 1 Agustus 2026 --
        alasan daftar tertutup + audit sebagai kontrolnya. Orang yang mengambil
        uang dari laci sering satu-satunya orang yang ada, dan ia pemiliknya;
        penyetuju yang wajib berbeda dari aktor (CHECK di audit_event) membuat
        fiturnya mustahil dipakai justru oleh yang paling membutuhkannya, dan
        yang tidak dapat mencatat tetap mengambil uangnya. [ASUMSI] -- spec-d
        hanya menyatakan alasannya wajib, bukan siapa yang boleh.


        ⛔ `jumlah` selalu POSITIF dan `arah` yang menentukan tandanya. Klien
        yang mengirim -50000 untuk kas MASUK akan mengurangi laci yang
        seharusnya bertambah, dan tidak ada apa pun di layar yang berbeda.


        ⛔ `counterpart_type` diturunkan dari ALASANNYA, bukan dari arahnya
        (FR-D6). "Ambil pemilik" dan "bayar pemasok" keduanya paid_out dengan
        jumlah yang sama, tapi yang pertama `owner_draw` dan yang kedua
        `expense` -- pembukuan yang menyamakannya melaporkan biaya operasional
        yang tidak pernah terjadi.


        ⛔ Shift yang sudah TERTUTUP menolak movement baru: saldo dan
        selisihnya sudah dihitung dan disetujui, dan menambahkan baris
        sesudahnya mengubah angka yang seseorang sudah tanda tangani.
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: >-
            WAJIB, dan sengaja TIDAK ditandai `required` -- pola yang sama
            dengan setiap endpoint idempoten lain di kontrak ini. Validator
            menjawab `400 VALIDATION_ERROR`, sementara yang dimaksud adalah
            `MISSING_IDEMPOTENCY_KEY`; "muatan Anda cacat" mengirim klien
            memeriksa body yang sebenarnya benar. Menandainya `required` juga
            membuat penjaga di handler tidak dapat dibedakan dari luar --
            bentuk guard-yang-tidak-teruji yang `CLAUDE.md` catat pada
            penyetuju refund.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, arah, jumlah, reasonCode]
              properties:
                id:
                  type: string
                  description: ULID/UUIDv7 dari klien; juga id `cash_movement`-nya.
                arah: { type: string, enum: [masuk, keluar] }
                jumlah:
                  type: string
                  description: >-
                    Rupiah utuh POSITIF sebagai string. String, bukan number:
                    rupiah melampaui 2^53 pada nilai yang masih mungkin di
                    gudang uang.
                reasonCode:
                  type: string
                  description: Daftar tertutup, berbeda per arah.
                reasonNote:
                  type: string
                  nullable: true
                  description: WAJIB bila `reasonCode` = `lainnya`.
                hlc: { type: string }
                occurredAt: { type: string }
      responses:
        '201':
          description: Movement tercatat.
          content:
            application/json:
              schema:
                type: object
                required: [id, shiftId, arah, delta, counterpartType]
                properties:
                  id: { type: string }
                  shiftId: { type: string }
                  arah: { type: string }
                  delta:
                    type: string
                    description: BERTANDA. Negatif untuk kas keluar.
                  counterpartType: { type: string }
        '400':
          description: >-
            Alasan tidak dikenal (REASON_INVALID), catatan wajib untuk
            `lainnya` (REASON_NOTE_REQUIRED), atau muatan cacat
            (VALIDATION_ERROR / MISSING_IDEMPOTENCY_KEY).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Shift tidak ditemukan (SHIFT_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Shift sudah tertutup (SHIFT_NOT_OPEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /shifts/{shiftId}/no-sale:
    post:
      operationId: recordNoSale
      summary: FR-D7 -- membuka laci tanpa transaksi (no-sale).
      description: >-
        `spec-d:229`: membuka laci tanpa transaksi adalah pola fraud kasir
        paling dasar. Yang ditulis endpoint ini adalah KONTROLNYA — alasan dari
        daftar tertutup, ambang frekuensi, dan jejak audit — bukan perintah ke
        lacinya, yang merupakan efek samping di perangkat.


        ⛔ Yang dicatat adalah PERINTAH sistem, BUKAN bukti laci terbuka.
        `spec-d:231`: sinyalnya satu arah. Sistem tidak dapat mengetahui apakah
        laci benar-benar terbuka, dan tidak dapat mendeteksi laci yang dibuka
        manual dengan kunci. Ini harus dinyatakan ke merchant.


        ⛔ Ambang dihitung dari `audit_event`, bukan dari kolom hitungan: kolom
        hitungan adalah angka kedua yang harus dijaga sepakat dengan jejaknya,
        dan yang menyimpang di antaranya tidak dapat diputuskan mana yang benar.


        Pembukaan ke-4 dan seterusnya dalam satu shift menuntut
        `X-Approver-Id` (403 APPROVAL_REQUIRED tanpa itu). Shift yang sudah
        ditutup menolak dengan 409.


        TIDAK menulis `cash_movement`: no-sale tidak memindahkan uang.
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, reasonCode]
              properties:
                id:
                  type: string
                  description: ULID/UUIDv7 dari klien; juga id `audit_event`-nya.
                reasonCode:
                  type: string
                  # SENGAJA tanpa `enum`: handler adalah satu-satunya sumber
                  # kebenaran, dan pesannya MENYEBUT pilihan yang sah.
                reasonNote: { type: string, nullable: true }
                hlc: { type: string, nullable: true }
                occurredAt: { type: string, nullable: true }
      responses:
        '201':
          description: Pembukaan tercatat.
          content:
            application/json:
              schema:
                type: object
                required: [id, shiftId, urutan, butuhPenyetuju]
                properties:
                  id: { type: string }
                  shiftId: { type: string }
                  urutan:
                    type: integer
                    description: Pembukaan ke berapa dalam shift ini.
                  butuhPenyetuju: { type: boolean }
        '400':
          description: Alasan tidak dikenal, atau Idempotency-Key hilang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Ambang terlampaui tanpa X-Approver-Id (APPROVAL_REQUIRED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Shift, aktor, atau penyetuju tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Shift sudah ditutup (SHIFT_NOT_OPEN), atau id sudah ada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/{shiftId}/close:
    post:
      operationId: closeShift
      summary: Menutup shift, mencatat hitungan fisik dan selisihnya.
      description: >-
        Sampai endpoint ini ada, tutup kas hanya terjadi di perangkat dan
        hasilnya tidak pernah sampai ke server -- setiap shift berstatus open
        selamanya, dengan counted_amount, difference, dan closed_at permanen
        NULL. Itu yang memblokir B-04 dan B-05.


        Saldo seharusnya dihitung dari cash_movement (spec-d:14), BUKAN dari
        payment, dan opening_float dikecualikan dari penjumlahan karena ia
        sudah menjadi saldo awal -- menjumlahkan keduanya menghitung modal awal
        dua kali.


        Selisih yang melewati ambang FR-D4 menuntut alasan DAN penyetuju yang
        berbeda dari yang menghitung. Ambangnya dipakai bersama dengan aplikasi
        kasir lewat packages/domain.


        Yang boleh menutup: kasir yang membuka shift itu, atau manajer
        (operasi approve_cash_variance). Kasir lain ditolak 403 -- shift
        memegang uang yang dipertanggungjawabkan satu orang.


        Percobaan hitungan DITAMBAHKAN, tidak pernah menimpa.
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedAmount]
              properties:
                countedAmount:
                  type: string
                  description: Hitungan fisik laci, rupiah utuh. Tidak boleh negatif.
                varianceReasonCode: { type: string, nullable: true }
                varianceNote: { type: string, nullable: true }
      responses:
        '200':
          description: Shift tertutup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilTutupShift'
        '400':
          description: >-
            Hitungan tidak valid, atau selisih melewati ambang tanpa alasan /
            penyetuju yang sah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Bukan pemilik shift dan bukan manajer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Shift tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Shift sudah ditutup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/shifts:
    get:
      operationId: getShiftReport
      summary: B-04 -- daftar shift beserta selisih kasnya.
      description: >-
        Bawaan hanya shift yang sudah DITUTUP. Shift berjalan tidak punya angka
        selisih, dan menampilkannya kosong di kolom uang membuat manajer
        mengira hitungannya nol; include_open=true menyertakannya secara
        eksplisit.


        expectedAmount dan difference DIBACA dari kolom yang ditulis saat
        penutupan, tidak dihitung ulang saat laporan dibaca -- movement yang
        tiba terlambat dari perangkat offline akan mengubah selisih shift yang
        sudah ditandatangani manajer, tanpa satu pun jejak.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: include_open
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Daftar shift.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarShift'
        '400':
          description: Rentang tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/shifts/{shift_id}:
    get:
      operationId: getShiftDetail
      summary: B-05 -- rincian satu shift.
      description: >-
        Menggabungkan cash_drawer_shift (cash), nama kasir (identity), dan
        rincian pembayaran per metode (payment). Hanya pembayaran confirmed
        yang dihitung.


        gerakanKas memuat pergerakan NON-penjualan -- setoran bank,
        pengeluaran, koreksi. opening_float dan sale dikecualikan: yang pertama
        sudah menjadi saldo awal, yang kedua sudah terwakili rincian per
        metode.
      parameters:
        - name: shift_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detail shift.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailShift'
        '404':
          description: Shift tidak ditemukan, atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/inventory/oversells:
    get:
      operationId: getInventoryOversells
      summary: B-15 "Perlu Diperiksa" -- oversell dan selisih kas.
      description: >-
        Dua daftar dalam satu respons, karena IA menamai layarnya "Perlu
        Diperiksa (oversell + selisih)". Mengirimnya terpisah berarti layar
        harus menjahitnya sendiri, dan ringkasan "berapa yang perlu diperiksa"
        jadi punya dua sumber.


        ⛔ Oversell BUKAN kesalahan. Pencegahannya saat offline adalah non-goal
        PERMANEN (konsekuensi teorema CAP): dua perangkat yang menjual barang
        terakhir saat offline sama-sama benar, dan keduanya harus berhasil.
        Yang dilakukan sistem adalah membuat konsekuensinya terlihat dan
        tertangani sebagai proses bisnis. Bahasanya karena itu deskriptif --
        perangkat yang TERLIBAT, bukan pelaku.


        Rentang oversell dihitung atas detected_at (waktu server menyadarinya),
        bukan tanggal bisnis penjualannya: oversell lahir saat perangkat kedua
        tersinkronisasi, dan itu dapat berhari-hari kemudian.


        Selisih kas hanya memuat shift TERTUTUP yang selisihnya bukan nol.
        Shift yang cocok bukan "perlu diperiksa", dan difference NULL berarti
        belum dihitung -- bukan selisih nol.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: include_resolved
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Oversell dan selisih kas pada rentang ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerluDiperiksa'
        '400':
          description: Rentang tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes:
    post:
      operationId: createStocktake
      summary: B-14 -- memulai opname. Waktu T dibekukan di sini.
      description: >-
        snapshot_at diisi jam DATABASE dan menjadi waktu T untuk seluruh opname
        ini. Penjualan tetap berjalan selama opname (FR-E7); movement setelah
        waktu T tidak memengaruhi perhitungan selisih.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId]
              properties:
                id: { type: string }
                outletId: { type: string }
      responses:
        '201':
          description: Opname dimulai.
          content:
            application/json:
              schema:
                type: object
                required: [id, outletId, status, snapshotAt, startedBy]
                properties:
                  id: { type: string }
                  outletId: { type: string }
                  status: { type: string }
                  snapshotAt: { type: string, format: date-time }
                  startedBy: { type: string }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listStocktakes
      summary: B-14 -- riwayat opname.
      parameters:
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Daftar opname, terbaru lebih dulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarOpname'
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes/{stocktakeId}:
    get:
      operationId: getStocktake
      summary: B-14 -- rincian satu opname beserta selisih per baris.
      parameters:
        - name: stocktakeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rincian opname.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOpname'
        '404':
          description: Opname tidak ditemukan, atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes/{stocktakeId}/lines:
    put:
      operationId: saveStocktakeLines
      summary: B-14 -- menyimpan hitungan fisik. Dapat dipanggil berulang.
      description: >-
        FR-E7: "Opname dapat dijeda dan dilanjutkan." Menyimpan ulang hitungan
        untuk varian yang sama adalah alur NORMAL, bukan kesalahan.


        ⛔ expected_qty dibekukan pada penyimpanan PERTAMA dan tidak ditulis
        ulang. Ia saldo pada waktu T, dihitung dari movement ber-occurred_at
        <= snapshot_at. Kalau ia ikut diperbarui setiap koreksi hitungan, waktu
        T bergerak dan seluruh alasan aturannya hilang.
      parameters:
        - name: stocktakeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [variationId, countedQty]
                    properties:
                      variationId: { type: string }
                      countedQty:
                        type: string
                        description: Hitungan fisik x1000. Tidak boleh negatif.
                      reasonCode: { type: string, nullable: true }
      responses:
        '200':
          description: Hitungan tersimpan.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, lines]
                properties:
                  id: { type: string }
                  status: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [variationId, expectedQty, countedQty]
                      properties:
                        variationId: { type: string }
                        expectedQty: { type: string }
                        countedQty: { type: string }
        '400':
          description: Baris atau kuantitas tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opname atau variation tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Opname sudah diselesaikan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes/{stocktakeId}/complete:
    post:
      operationId: completeStocktake
      summary: B-14 -- menyelesaikan opname; di sinilah movement lahir.
      description: >-
        ⛔ delta = hitungan_fisik - stok_pada_T, BUKAN hitungan - stok saat ini.
        AC FR-E7 menyebutnya eksplisit: "Selisih dihitung terhadap snapshot
        waktu T, bukan stok saat penyimpanan."


        Kalau selisih dihitung terhadap stok saat penyelesaian, setiap
        penjualan yang terjadi selama petugas menghitung akan TERHAPUS: sistem
        dipaksa sama dengan angka fisik yang dihitung sebelum penjualan itu
        terjadi, dan barang yang benar-benar keluar dari rak kembali muncul di
        catatan.


        ⛔ Tipe movementnya stocktake, BUKAN adjustment. FR-E2 memberi keduanya
        baris tersendiri, dan adjustment WAJIB reason_code -- hasil opname
        tidak selalu punya satu, karena sebab selisihnya justru yang sedang
        dicari.


        Baris yang cocok (selisih nol) tidak menghasilkan movement. Movement
        dan penutupan opname ditulis di transaksi yang SAMA.
      parameters:
        - name: stocktakeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Opname selesai.
          content:
            application/json:
              schema:
                type: object
                required:
                  [id, status, approvedBy, jumlahBaris, jumlahBerselisih,
                   movementDitulis]
                properties:
                  id: { type: string }
                  status: { type: string }
                  snapshotAt: { type: string, nullable: true }
                  approvedBy: { type: string }
                  jumlahBaris: { type: integer }
                  jumlahBerselisih: { type: integer }
                  movementDitulis: { type: integer }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opname tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Opname sudah diselesaikan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: >-
        B-01 -- ringkasan beranda. Omzet, produk terlaris, dan stok.
      description: >-
        ⛔ Endpoint ini tidak menghitung apa pun sendiri. Omzet datang dari
        fungsi yang SAMA dengan GET /reports/sales, produk terlaris dari yang
        sama dengan GET /reports/products, dan stok dari yang sama dengan
        GET /reports/inventory/stocks.


        Alasannya bukan kerapian: dasbor adalah layar yang pertama dilihat
        merchant setiap pagi dan yang paling jarang diperiksa ulang. Angka di
        sini yang berbeda dari laporan akan dipercaya lebih dulu, dan spec-g:29
        menyebut akibatnya -- kepercayaan merchant hilang lebih cepat daripada
        karena fitur yang tidak ada.


        Ringkasan stok hanya dibentuk bila outlet_id diberikan. Stok bersifat
        per outlet, dan satu angka gabungan lintas outlet tidak dapat dipakai
        memutuskan apa pun: kekurangan di satu cabang tertutup kelebihan di
        cabang lain. Tanpa outlet_id, field stok bernilai null.


        Ketiga agregasi berjalan bersamaan di dalam satu transaksi, dan
        seluruhnya menyaring business_date yang punya index.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Ringkasan dasbor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasanDasbor'
        '400':
          description: Rentang tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    HasilGambarProduk:
      type: object
      required: [itemId, byte, batasByte, batasBase64]
      additionalProperties: false
      properties:
        itemId: { type: string }
        byte:
          type: integer
          description: Ukuran gambar setelah decode.
        batasByte:
          type: integer
          description: >-
            Batas per gambar SEBELUM base64. ⛔ Dikembalikan supaya layar tidak
            menyalin angkanya — salinan di klien akan menyimpang pada hari
            batasnya berubah, dan merchant melihat sisa kuota yang salah.
        batasBase64:
          type: integer
          description: >-
            Batas panjang teks yang MELINTAS jaringan. Anggaran armada dihitung
            dari angka ini, bukan dari `batasByte`: yang diunduh perangkat
            adalah teksnya, dan memakai `batasByte` melaporkan 25% lebih kecil
            daripada kenyataan.
    HasilTutupShift:
      type: object
      required:
        [id, status, countedAmount, expectedAmount, difference, butuhOtorisasi,
         jumlahPercobaan]
      properties:
        id: { type: string }
        status: { type: string }
        countedAmount: { type: string }
        expectedAmount: { type: string }
        difference:
          type: string
          description: 'counted - expected. Negatif berarti kas kurang.'
        butuhOtorisasi: { type: boolean }
        approvedBy: { type: string, nullable: true }
        closedAt: { type: string, nullable: true }
        jumlahPercobaan: { type: integer }

    DaftarShift:
      type: object
      required: [from, to, outletId, items]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required:
              [id, outletId, deviceId, businessDate, status, openingFloat,
               openedBy, openedByNama, openedAt, totalDiterima, jumlahTransaksi]
            properties:
              id: { type: string }
              outletId: { type: string }
              deviceId: { type: string }
              businessDate: { type: string }
              status: { type: string }
              openingFloat: { type: string }
              openedBy: { type: string }
              openedByNama: { type: string }
              openedAt: { type: string, format: date-time }
              closedBy: { type: string, nullable: true }
              closedByNama: { type: string, nullable: true }
              approvedBy: { type: string, nullable: true }
              approvedByNama: { type: string, nullable: true }
              closedAt: { type: string, nullable: true }
              countedAmount: { type: string, nullable: true }
              expectedAmount: { type: string, nullable: true }
              difference: { type: string, nullable: true }
              varianceReasonCode: { type: string, nullable: true }
              varianceNote: { type: string, nullable: true }
              totalDiterima: { type: string }
              jumlahTransaksi: { type: integer }

    DetailShift:
      type: object
      required:
        [id, outletId, deviceId, businessDate, status, openingFloat, openedBy,
         openedByNama, openedAt, totalDiterima, jumlahTransaksi, perMetode,
         gerakanKas, percobaanHitungan]
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        businessDate: { type: string }
        status: { type: string }
        openingFloat: { type: string }
        openedBy: { type: string }
        openedByNama: { type: string }
        openedAt: { type: string, format: date-time }
        closedBy: { type: string, nullable: true }
        closedByNama: { type: string, nullable: true }
        approvedBy: { type: string, nullable: true }
        approvedByNama: { type: string, nullable: true }
        closedAt: { type: string, nullable: true }
        countedAmount: { type: string, nullable: true }
        expectedAmount: { type: string, nullable: true }
        difference: { type: string, nullable: true }
        varianceReasonCode: { type: string, nullable: true }
        varianceNote: { type: string, nullable: true }
        totalDiterima: { type: string }
        jumlahTransaksi: { type: integer }
        perMetode:
          type: array
          items:
            type: object
            required: [method, jumlahTransaksi, total]
            properties:
              method: { type: string }
              jumlahTransaksi: { type: integer }
              total: { type: string }
        gerakanKas:
          type: array
          items:
            type: object
            required: [id, type, delta, occurredAt]
            properties:
              id: { type: string }
              type: { type: string }
              delta: { type: string }
              reasonCode: { type: string, nullable: true }
              note: { type: string, nullable: true }
              occurredAt: { type: string, format: date-time }
        percobaanHitungan:
          type: array
          items:
            type: object
            required: [hitungan]
            properties:
              hitungan: { type: string }
              pada: { type: string, nullable: true }
              oleh: { type: string, nullable: true }
    PerluDiperiksa:
      type: object
      required: [from, to, outletId, oversell, selisihKas]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        oversell:
          type: array
          items:
            type: object
            required:
              [id, outletId, variationId, itemName, variationName, detectedAt,
               quantityOver, devicesInvolved, ordersInvolved]
            properties:
              id: { type: string }
              outletId: { type: string }
              variationId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              detectedAt: { type: string, format: date-time }
              quantityOver:
                type: string
                description: Kuantitas x1000 yang terjual melebihi saldo.
              devicesInvolved:
                type: array
                items: { type: string }
              ordersInvolved:
                type: array
                items: { type: string }
              resolvedBy: { type: string, nullable: true }
              resolvedByNama: { type: string, nullable: true }
              resolvedAt: { type: string, nullable: true }
              resolutionNote: { type: string, nullable: true }
        selisihKas:
          type: array
          items:
            type: object
            required: [shiftId, outletId, businessDate, openedByNama, difference]
            properties:
              shiftId: { type: string }
              outletId: { type: string }
              businessDate: { type: string }
              openedByNama: { type: string }
              closedByNama: { type: string, nullable: true }
              approvedByNama: { type: string, nullable: true }
              closedAt: { type: string, nullable: true }
              difference: { type: string }
              varianceReasonCode: { type: string, nullable: true }
              varianceNote: { type: string, nullable: true }
    DaftarOpname:
      type: object
      required: [outletId, items]
      properties:
        outletId: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required:
              [id, outletId, status, startedBy, startedByNama, jumlahBaris,
               jumlahDihitung, jumlahBerselisih]
            properties:
              id: { type: string }
              outletId: { type: string }
              status: { type: string }
              snapshotAt: { type: string, nullable: true }
              startedBy: { type: string }
              startedByNama: { type: string }
              approvedBy: { type: string, nullable: true }
              approvedByNama: { type: string, nullable: true }
              jumlahBaris: { type: integer }
              jumlahDihitung: { type: integer }
              jumlahBerselisih: { type: integer }

    DetailOpname:
      type: object
      required: [id, outletId, status, startedBy, startedByNama, lines]
      properties:
        id: { type: string }
        outletId: { type: string }
        status: { type: string }
        snapshotAt: { type: string, nullable: true }
        startedBy: { type: string }
        startedByNama: { type: string }
        approvedBy: { type: string, nullable: true }
        approvedByNama: { type: string, nullable: true }
        lines:
          type: array
          items:
            type: object
            required: [variationId, itemName, variationName, expectedQty]
            properties:
              variationId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              expectedQty:
                type: string
                description: Saldo pada waktu T, x1000.
              countedQty:
                type: string
                nullable: true
                description: null berarti belum dihitung -- bukan dihitung nol.
              selisih: { type: string, nullable: true }
              reasonCode: { type: string, nullable: true }
    RingkasanDasbor:
      type: object
      required: [from, to, outletId, penjualan, terlaris, stok, perangkat]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        penjualan:
          type: object
          description: >-
            Bentuk yang SAMA dengan GET /reports/sales -- dihitung fungsi yang
            sama, bukan disalin.
          required:
            [omzetKotor, voidAmount, refundAmount, omzetBersih, pajakTerkumpul,
             jumlahTransaksi, rataRataPerTransaksi]
          properties:
            omzetKotor: { type: string }
            voidAmount: { type: string }
            refundAmount: { type: string }
            omzetBersih: { type: string }
            pajakTerkumpul: { type: string }
            jumlahTransaksi: { type: integer }
            rataRataPerTransaksi: { type: string }
        terlaris:
          type: array
          description: Paling banyak 5, terurut kuantitas menurun.
          items:
            type: object
            required:
              [variationId, itemName, variationName, kuantitas, kuantitasTampil,
               nilaiKotor]
            properties:
              variationId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              kuantitas:
                type: string
                description: Kuantitas x1000.
              kuantitasTampil: { type: string }
              nilaiKotor: { type: string }
        stok:
          type: object
          nullable: true
          description: null bila outlet_id tidak diberikan.
          required: [minus, habis, contoh]
          properties:
            minus: { type: integer }
            habis: { type: integer }
            contoh:
              type: array
              items:
                type: object
                required: [variationId, itemName, variationName, saldo]
                properties:
                  variationId: { type: string }
                  itemName: { type: string }
                  variationName: { type: string }
                  saldo: { type: string }
        perangkat:
          type: object
          description: >-
            FR-H8 sisi OWNER (`spec-h:311` -- "> 24 jam: notifikasi ke owner").


            ⛔ Ini BUKAN umur antrean. Antrean yang menua adalah penjualan yang
            belum pernah sampai ke server, jadi server tidak dapat melihatnya
            sama sekali. Yang dapat dilihatnya adalah perangkat yang berhenti
            menyapa. Keduanya dinamai berbeda di UI; hanya AMBANGNYA yang
            dibagi lewat `packages/domain`.
          required: [total, menua, belumPernah]
          properties:
            total:
              type: integer
              description: Perangkat aktif yang punya kredensial.
            belumPernah:
              type: integer
              description: >-
                Dibuat dan sudah berkredensial, tapi belum sekali pun menyapa
                server. Bukan hal yang sama dengan basi.
            menua:
              type: array
              description: Yang melewati ambang, terlama dulu. Yang sehat tidak ikut.
              items:
                type: object
                required:
                  [deviceId, code, outletId, lastSeenAt, jamSejakTerlihat, tingkat]
                properties:
                  deviceId: { type: string }
                  code: { type: string }
                  outletId: { type: string }
                  lastSeenAt: { type: string, nullable: true }
                  jamSejakTerlihat: { type: integer, nullable: true }
                  tingkat:
                    type: string
                    enum: [peringatan, kritis, darurat]
    DaftarStok:
      type: object
      required: [outletId, items]
      properties:
        outletId: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required:
              [variationId, itemId, itemName, variationName, outletId,
               trackStock, archived, saldoMilli, saldo, jumlahMovement]
            properties:
              variationId: { type: string }
              itemId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              categoryId: { type: string, nullable: true }
              outletId: { type: string }
              trackStock: { type: boolean }
              archived: { type: boolean }
              saldoMilli:
                type: string
                description: Kuantitas x1000, STRING.
              saldo:
                type: string
                description: Bentuk terbaca, dihitung dari bilangan bulat.
              jumlahMovement: { type: integer }
              movementTerakhir: { type: string, nullable: true }
