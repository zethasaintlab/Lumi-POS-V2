  /users:
    get:
      operationId: listUsers
      summary: Daftar pengguna tenant ini, untuk layar B-27 Pengguna & Peran.
      description: >-
        Pengguna yang DINONAKTIFKAN ikut, dengan isActive false -- baris
        "user" tidak pernah dihapus karena audit trail menunjuknya.


        hasPin menyatakan APAKAH PIN sudah disetel, bukan nilainya. Tanpa PIN,
        pengguna tidak dapat membuka aplikasi kasir sama sekali.
      responses:
        '200':
          description: Daftar pengguna, aktif lebih dulu lalu urut nama.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, isActive, hasPin, roles, outletIds]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    email: { type: string, nullable: true }
                    isActive: { type: boolean }
                    hasPin: { type: boolean }
                    roles: { type: array, items: { type: string } }
                    outletIds: { type: array, items: { type: string } }
        '403':
          description: Aktor tidak berhak mengelola pengguna.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createUser
      summary: >-
        FR-F2 -- membuat pengguna beserta peran dan keanggotaan outletnya.
        Ketiganya SATU transaksi: pengguna tanpa peran dan tanpa outlet tidak
        dapat melakukan apa pun dan tidak terlihat perangkat mana pun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, roles, outletIds]
              properties:
                id: { type: string }
                name: { type: string, minLength: 1 }
                email: { type: string, nullable: true }
                birthDate:
                  type: string
                  nullable: true
                  description: >-
                    YYYY-MM-DD. Dipakai menolak PIN berupa tanggal lahir
                    (spec-f:135). Aturannya bersyarat -- tanpa nilai ini,
                    pemeriksaan itu tidak berjalan.
                roles:
                  type: array
                  items:
                    type: object
                    required: [role, scopeType, scopeId]
                    properties:
                      role:
                        type: string
                        enum: [owner, area_manager, outlet_manager, cashier, accountant]
                      scopeType: { type: string, enum: [tenant, outlet] }
                      scopeId: { type: string }
                outletIds:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: >-
            Header X-Tenant-Id / X-Actor-Id hilang, payload tidak valid, atau
            cakupan peran dilampaui (ROLE_SCOPE_TOO_WIDE).


            spec-f:31 dan spec-f:32 memberi Manajer Outlet dan Kasir cakupan
            "Satu outlet". Lebih dari satu outletId untuk peran itu ditolak
            SEBELUM transaksi dibuka -- kasir yang terdaftar di dua outlet
            muncul di layar login kedua tablet dan penjualannya dapat
            dinisbatkan ke outlet yang tidak pernah ia tempati.


            outletId duplikat dihitung SEKALI; `[o1, o1]` adalah satu outlet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Aktor tidak berhak mengelola peran yang diminta. Manajer Outlet
            hanya boleh mengelola Kasir (spec-f:50).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            outletId tidak ditemukan atau bukan milik tenant pemanggil
            (OUTLET_NOT_FOUND) -- divalidasi lewat SELECT tunduk RLS, bukan FK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: id sudah dipakai (ID_ALREADY_EXISTS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}:
    patch:
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                email: { type: string, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            Owner terakhir tidak dapat dinonaktifkan (LAST_OWNER, spec-f:425).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}/pin:
    put:
      operationId: setUserPin
      summary: >-
        FR-F2. PIN di-hash Argon2id dan disimpan dalam format PHC. Keunikan PIN
        per outlet ditegakkan APLIKASI -- UNIQUE(outlet_id, pin_hash) di ERD
        §3 mustahil, karena salt per pengguna membuat PIN identik menghasilkan
        hash berbeda (lihat migrasi 0019).
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string }
                isReset:
                  type: boolean
                  default: false
                  description: >-
                    Reset oleh manajer. Menyalakan pin_must_change: PIN yang
                    diketahui manajer tidak boleh berlaku selamanya
                    (spec-f:420).
      responses:
        '204':
          description: PIN diperbarui. Tanpa body -- tidak ada apa pun tentang PIN yang aman dikembalikan.
        '400':
          description: >-
            Bukan 6 digit (PIN_INVALID_SHAPE) atau termasuk pola lemah
            (PIN_TOO_WEAK -- pesan menyebut pola mana, spec-f:144)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            PIN sudah dipakai pengguna lain di outlet yang sama (PIN_TAKEN).
            Pesan TIDAK menyebut siapa -- itu akan memberi tahu pemanggil PIN
            siapa yang baru saja ia tebak.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{userId}/pin-attempts:
    post:
      operationId: recordPinAttempt
      summary: >-
        FR-F4. Perangkat melaporkan hasil percobaan PIN yang diverifikasinya
        secara LOKAL. Server memegang hitungan dan eskalasi supaya penguncian
        berlaku di seluruh perangkat outlet, bukan hanya di perangkat tempat
        PIN salah diketik.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [failed, succeeded] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [failedAttempts, lockedUntil, lockSeconds]
                properties:
                  failedAttempts: { type: integer }
                  lockedUntil: { type: string, format: date-time, nullable: true }
                  lockSeconds:
                    type: integer
                    nullable: true
                    description: 60 detik, atau 900 pada penguncian ketiga dalam satu jam (spec-f:229)
        '404':
          description: Pengguna tidak ditemukan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /devices:
    get:
      operationId: listDevices
      summary: >-
        Daftar perangkat tenant ini, untuk layar B-28 Perangkat.
      description: >-
        Perangkat yang DICABUT tetap ikut, dengan `revokedAt` terisi.
        Perangkat tidak pernah dihapus -- `order.device_id` menunjuknya, dan
        riwayat penjualan harus tetap dapat menyebut perangkat mana yang
        membuatnya.


        ⛔ `token_hash` TIDAK PERNAH dikirim. Layar hanya perlu tahu APAKAH
        kredensial sudah diterbitkan (`adaKredensial`), bukan nilainya.
      responses:
        '200':
          description: Daftar perangkat, aktif lebih dulu lalu urut kode.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceRingkas' }
        '403':
          description: Aktor tidak berhak mengelola perangkat (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, code]
              properties:
                id: { type: string }
                outletId: { type: string }
                code: { type: string }
                name: { type: string, nullable: true }
                platform: { type: string, nullable: true }
                appVersion: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan atau bukan milik tenant pemanggil
            (OUTLET_NOT_FOUND) -- divalidasi lewat SELECT yang tunduk RLS,
            bukan FK (FK PostgreSQL tidak tunduk RLS, temuan F1 di CLAUDE.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Kode device sudah dipakai device aktif lain di outlet yang sama
            (CODE_TAKEN -- pesan menyebut device pemakai kode, dari SELECT
            tunduk RLS bukan detail error PostgreSQL), atau id sudah dipakai
            device lain (ID_ALREADY_EXISTS -- retry offline dengan id yang
            sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/credentials:
    post:
      operationId: issueDeviceCredentials
      summary: >-
        FR-F12 -- menerbitkan kredensial perangkat. Secret dikembalikan SEKALI;
        yang tersimpan hanya SHA-256-nya. Menerbitkan ulang mematikan yang lama.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, secret, expiresAt]
                properties:
                  deviceId: { type: string }
                  secret:
                    type: string
                    description: Rahasia perangkat. Tidak dapat dibaca lagi setelah respons ini.
                  expiresAt: { type: string, format: date-time }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Device tidak ditemukan atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/sync-token:
    post:
      operationId: issueSyncToken
      summary: >-
        FR-F12 -- menukar kredensial perangkat dengan JWT RS256 berumur pendek
        untuk PowerSync. `tenant_id` dan `outlet_id` adalah klaim TOP-LEVEL:
        `auth.parameter('x')` di sync rules membaca `payload.x`.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: Authorization
          in: header
          required: false
          description: >-
            'Bearer <secret perangkat>'. SENGAJA tidak `required` di skema:
            validator akan menjawab 400 untuk header yang hilang, dan 400
            berarti "permintaan cacat" sementara kredensial yang hilang
            berarti "buktikan siapa kamu". Handler yang menegakkannya, dengan
            401 -- pesan yang sama persis dengan secret yang salah, supaya
            tidak ada yang dapat menebak id perangkat dari beda respons.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, token]
                properties:
                  endpoint: { type: string }
                  token: { type: string }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Kredensial tidak sah, perangkat dicabut, atau kredensial kedaluwarsa
            (DEVICE_CREDENTIALS_EXPIRED). Satu pesan untuk semua sebab kecuali
            kedaluwarsa -- membedakannya memberi tahu penebak bahwa id-nya benar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Kunci penandatangan belum diatur di server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: >-
        Kunci publik untuk memverifikasi token sinkronisasi. Dilayani tanpa
        tenant dan tanpa kredensial -- ia memang publik.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }
        '503':
          description: Kunci penandatangan belum diatur di server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Device tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /shifts:
    post:
      operationId: openShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, deviceId, businessDate, openingFloat]
              properties:
                id: { type: string }
                outletId: { type: string }
                deviceId: { type: string }
                businessDate: { type: string, format: date }
                # openingFloat SENGAJA tidak diberi `type`/`minimum` -- sama
                # seperti PriceInput.price di catalog, assertOpeningFloatValid
                # (apps/server/src/modules/cash/handlers/shifts.ts) adalah
                # satu-satunya sumber kebenaran untuk kode error ini.
                openingFloat: {}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
        '400':
          description: >-
            Header X-Tenant-Id atau X-Actor-Id hilang, atau openingFloat
            tidak valid (bilangan bulat rupiah >= 0, tidak melebihi
            Number.MAX_SAFE_INTEGER -- VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan (OUTLET_NOT_FOUND), deviceId tidak
            ditemukan atau sudah dicabut (DEVICE_NOT_FOUND), atau aktor
            tidak ditemukan/tidak aktif (ACTOR_NOT_FOUND) -- ketiganya
            divalidasi lewat SELECT yang tunduk RLS, bukan FK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Device ini sudah punya shift yang masih terbuka
            (SHIFT_ALREADY_OPEN -- ux_shift_one_open_per_device), atau id
            sudah dipakai shift lain (ID_ALREADY_EXISTS -- retry offline
            dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders:
    get:
      operationId: listOrders
      summary: B-02 -- daftar transaksi pada rentang tanggal bisnis.
      description: >-
        Satu baris per TRANSAKSI, bukan per baris tabel. Penjualan yang
        dibatalkan menghasilkan dua baris di tabel order (yang asli tetap
        berstatus open selamanya karena AC FR-B7 melarang UPDATE padanya, dan
        pembatalnya baris tersendiri ber-status voided yang nilainya salinan).
        Yang dikembalikan di sini order aslinya, ber-status turunan
        "dibatalkan", dengan penunjuk ke pembatalnya.


        Keranjang yang belum dibayar disembunyikan -- ia bukan transaksi, dan
        belum ada jalan menutupnya. Status yang mungkin muncul hanya terjual,
        dibatalkan, dan direfund.


        Paginasi KEYSET. Order dari perangkat yang baru tersambung membawa
        tanggal bisnis historis dan menyisip di TENGAH urutan; dengan OFFSET
        satu sisipan membuat satu transaksi terlewat tanpa error. Kirim
        cursorBerikut dari respons sebelumnya apa adanya -- ia buram dan tidak
        untuk disusun klien.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: created_by
          in: query
          required: false
          description: Id kasir pembuat order.
          schema: { type: string }
        - name: receipt_number
          in: query
          required: false
          description: >-
            Pencarian SEBAGIAN dan tidak peka huruf besar-kecil. Karakter
            wildcard yang diketik pengguna dicari harfiah.
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: 'terjual | dibatalkan | direfund'
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          description: cursorBerikut dari respons sebelumnya, apa adanya.
          schema: { type: string }
      responses:
        '200':
          description: Satu halaman transaksi, terbaru lebih dulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarTransaksi'
        '400':
          description: Rentang, limit, status, atau cursor tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, outletId, deviceId, shiftId, receiptNumber, businessDate, sequence, channel, checkId, lines]
              properties:
                id: { type: string }
                outletId: { type: string }
                deviceId: { type: string }
                shiftId: { type: string }
                receiptNumber:
                  type: string
                  pattern: '^[A-Za-z0-9]+-\d{8}-\d+$'
                businessDate: { type: string, format: date }
                sequence: { type: integer, minimum: 1 }
                channel: { type: string, enum: [dine_in, takeaway] }
                # hlc SENGAJA type: string, bukan integer -- ia bilangan
                # 57-bit (packages/domain/src/hlc.ts) yang melebihi presisi
                # double JSON/JS. assertHlcValid (handlers/orders.ts) adalah
                # satu-satunya sumber kebenaran untuk bentuknya.
                hlc: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time, nullable: true }
                checkId: { type: string }
                # FR-H6 -- total yang DIHITUNG KLIEN. Opsional, dan tidak
                # pernah dipercaya: server tetap menghitung sendiri dan
                # menyimpan hitungannya. Nilai ini hanya dibandingkan, dan
                # selisihnya ditandai. Sengaja tanpa `type` --
                # assertClientTotalValid (handlers/orders.ts) satu-satunya
                # sumber kebenaran, pola sama dengan quantityMilli.
                #
                # Klien versi N-1 tidak mengirimnya, dan tidak boleh patah.
                total: {}
                lines:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OrderLineInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: >-
            Header X-Tenant-Id atau X-Actor-Id hilang; lines kosong (order
            DRAFT tidak pernah tersimpan, minItems: 1); quantityMilli,
            discountAmount, atau harga/quantityMilli modifier tidak valid;
            hlc bukan string bilangan bulat desimal; receiptNumber tidak
            cocok format PREFIX-YYYYMMDD-URUTAN; atau sequence bukan
            bilangan bulat positif (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            outletId tidak ditemukan (OUTLET_NOT_FOUND), deviceId tidak
            ditemukan/sudah dicabut (DEVICE_NOT_FOUND), aktor tidak
            ditemukan/tidak aktif (ACTOR_NOT_FOUND), shiftId tidak ditemukan
            (SHIFT_NOT_FOUND), atau variationId salah satu baris tidak
            ditemukan (VARIATION_NOT_FOUND) -- kelimanya divalidasi lewat
            SELECT yang tunduk RLS, bukan FK (FK PostgreSQL tidak tunduk
            RLS, temuan F1 di CLAUDE.md)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            shiftId ditemukan tapi sudah tidak berstatus open
            (SHIFT_NOT_OPEN), shiftId bukan milik deviceId yang dikirim
            (SHIFT_DEVICE_MISMATCH), nomor struk bentrok untuk device dan
            tanggal bisnis yang sama (RECEIPT_SEQUENCE_TAKEN), atau id
            (order/check/salah satu line/salah satu modifier) sudah dipakai
            baris lain (ID_ALREADY_EXISTS -- termasuk checkId yang sudah
            dipakai order lain, FR-B12)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Order beserta check, seluruh order_line (snapshot item_name/
            variation_name/unit_price/cost_at_sale -- FR-B3, tidak
            terpengaruh perubahan katalog setelahnya), dan modifier
            bertingkat per line.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhooks/midtrans:
    post:
      operationId: midtransNotification
      summary: Notifikasi pembayaran dari Midtrans
      description: >-
        FR-C14. Satu-satunya endpoint di API ini yang TIDAK membawa
        `X-Tenant-Id` — Midtrans tidak tahu apa-apa soal tenant kami, dan
        tidak boleh tahu.


        Signature diverifikasi LEBIH DULU, sebelum satu query pun dijalankan:
        `SHA512(order_id + status_code + gross_amount + ServerKey)`. Tanpa itu
        siapa pun yang menemukan URL ini dapat menandai order mana pun lunas.


        Tenant dibaca dari `custom_field1` yang kami titipkan sendiri saat
        charge, lalu dipakai sebagai `app.tenant_id` — sehingga pencarian
        payment tetap tunduk RLS dan tenant yang dipalsukan tidak menemukan
        apa pun.


        Selalu dijawab `200` bila notifikasinya sah, termasuk saat tidak
        mengubah apa pun: Midtrans mengirim ulang notifikasi yang tidak
        dijawab 200, jadi menjawab error hanya membuatnya mengulang tanpa
        akhir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, status_code, gross_amount, signature_key]
              properties:
                # `order_id` di Midtrans adalah id PAYMENT kami, bukan id
                # order: satu order dapat dibayar beberapa kali, dan memakai id
                # order akan membuat pembayaran kedua ditolak sebagai duplikat.
                order_id: { type: string }
                status_code: { type: string }
                gross_amount: { type: string }
                signature_key: { type: string }
                transaction_status: { type: string }
                custom_field1: { type: string }
      responses:
        '200':
          description: Notifikasi sah dan diproses (atau sudah pernah diproses).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean }
        '401':
          description: >-
            Signature tidak sah (INVALID_SIGNATURE). Pesannya sengaja tidak
            menjelaskan bagian mana yang tidak cocok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Pembayaran tidak ditemukan (PAYMENT_NOT_FOUND). Termasuk
            notifikasi bertanda tangan sah yang tenant-nya tidak cocok —
            pencariannya tunduk RLS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: >-
            Kunci webhook tidak dikonfigurasi (WEBHOOK_NOT_CONFIGURED).
            Endpoint yang menerima notifikasi tanpa verifikasi jauh lebih
            berbahaya daripada endpoint yang mati.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payments/{paymentId}/check-status:
    post:
      operationId: checkPaymentStatus
      summary: Tanyakan status pembayaran ke gateway
      description: >-
        FR-C14. Ini SATU-SATUNYA jalan sebuah payment QRIS menjadi
        `confirmed` — spec-c:320 melarang sistem menandai lunas tanpa
        konfirmasi gateway, dan tidak ada jalur lain yang boleh melakukannya.


        POST, bukan GET: memanggilnya mengubah keadaan (status payment, dan
        — bila pembayaran melunasi — status order).


        Penjadwalan polling (tiap 2 detik, maksimal 5 menit) adalah perilaku
        KLIEN. Server hanya menyediakan pintunya. Payment yang statusnya sudah
        final dijawab tanpa menyentuh gateway sama sekali.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: >-
            Keadaan payment setelah ditanyakan. `gatewayStatus` adalah jawaban
            gateway apa adanya dan `null` bila gateway tidak ditanyai;
            `expired` dan `failed` sama-sama tersimpan sebagai payment
            `failed`, jadi field ini yang memungkinkan klien mengatakan "QR
            kedaluwarsa" alih-alih "pembayaran gagal".
          content:
            application/json:
              schema:
                type: object
                required: [payment, order, outstanding]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  gatewayStatus:
                    type: string
                    nullable: true
                    enum: [pending, confirmed, failed, expired]
                  order:
                    type: object
                    required: [id, status, total]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      total: { type: integer }
                  outstanding: { type: integer }
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            paymentId tidak ditemukan (PAYMENT_NOT_FOUND) — lewat SELECT yang
            tunduk RLS, jadi payment milik tenant lain juga menjawab ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Payment bukan metode gateway (PAYMENT_NOT_GATEWAY). Pembayaran
            tunai tidak punya gateway untuk ditanyai.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/cancel:
    post:
      operationId: cancelOrder
      summary: Batalkan transaksi — sistem menentukan void atau refund
      description: >-
        FR-B7. Kasir tidak memilih "void" atau "refund" (spec-b:235) —
        body TIDAK memuat nama operasi sama sekali. Server membacanya dari
        status order lewat `decideCancellation` (packages/domain), dan
        menyebutkan hasilnya di field `operation` supaya UI dapat
        menjelaskannya ke kasir.


        Order asli TIDAK di-UPDATE (AC FR-B7 pertama). Void menambah baris
        `order` berstatus `voided` yang `voidedByOrderId`-nya menunjuk order
        yang dibatalkan.


        Void berjalan TANPA X-Approver-Id — keputusan produk 1 Agustus 2026,
        override eksplisit terhadap research/08 §3. Header itu diabaikan bila
        dikirim. Refund (order CLOSED) akan menuntutnya, dan belum tersedia.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Hanya `id` dan `reasonCode` yang wajib di KONTRAK. Field mana
              # lagi yang wajib bergantung pada operasi yang DIPILIH SERVER
              # dari status order, dan JSON Schema tidak bisa menyatakan
              # "wajib bila server memutuskan X". Void menuntut
              # receiptNumber + sequence; refund menuntut amount + header
              # X-Approver-Id. Keduanya divalidasi di handler, pola yang sama
              # dengan seluruh validasi uang/kuantitas di repo ini.
              required: [id, reasonCode]
              properties:
                id:
                  type: string
                  description: >-
                    Id order PEMBATAL (void) atau id baris `refund` (refund),
                    di-generate klien (ULID/UUIDv7).
                receiptNumber:
                  type: string
                  pattern: '^[A-Za-z0-9]+-\d{8}-\d+$'
                  description: Void saja.
                sequence: { type: integer, minimum: 1, description: Void saja. }
                amount:
                  description: >-
                    Refund saja — nominal rupiah utuh yang dikembalikan.
                    Sengaja tanpa `type`: assertRefundAmountValid (handler)
                    satu-satunya sumber kebenaran, sama seperti
                    quantityMilli/discountAmount di POST /orders.
                lines:
                  type: array
                  description: >-
                    Refund parsial — baris mana yang dikembalikan stoknya
                    (spec-b:233). Dikosongkan berarti seluruh order.
                  items:
                    type: object
                    required: [lineId, quantityMilli]
                    properties:
                      lineId: { type: string }
                      quantityMilli: {}
                # Daftar TERTUTUP (spec-b:290) -- free text tidak dapat
                # diagregasi menjadi laporan fraud.
                #
                # Enum di sini adalah GABUNGAN daftar void dan refund, dan itu
                # sengaja lebih longgar daripada aturan sebenarnya: endpoint-nya
                # satu, sementara operasinya baru diketahui server dari status
                # order. Yang menolak `barang_rusak` pada void dan
                # `salah_input` pada refund adalah assertCancellationReason
                # (packages/domain) -- satu-satunya sumber kebenaran, dan yang
                # juga berlaku saat klien offline.
                reasonCode:
                  type: string
                  enum:
                    - salah_input
                    - pelanggan_batal
                    - item_habis
                    - uji_coba
                    - barang_rusak
                    - pesanan_salah
                    - pelanggan_tidak_puas
                    - kelebihan_bayar
                    - lainnya
                # Wajib >= 10 karakter bila reasonCode = lainnya (spec-b:296).
                # Aturan bersyarat itu tidak dinyatakan di sini -- ia ada di
                # domain, sama seperti seluruh validasi uang/kuantitas di repo
                # ini.
                reasonNote: { type: string, nullable: true }
                hlc: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: >-
            Order pembatal dibuat. `operation` menyebut operasi yang
            DIPILIH SERVER.
          content:
            application/json:
              schema:
                type: object
                required: [operation, cancelledOrderId]
                properties:
                  # `operation` menentukan field mana yang ada: `order` untuk
                  # void (baris order pembatal), `refund` untuk refund (baris
                  # refund). Refund TIDAK membuat order baru, dan TIDAK
                  # membuat payment negatif -- keputusan user 7 Agu 2026.
                  operation: { type: string, enum: [void, refund] }
                  cancelledOrderId: { type: string }
                  order: { $ref: '#/components/schemas/CancelledOrder' }
                  refund: { $ref: '#/components/schemas/Refund' }
        '400':
          description: >-
            Header X-Tenant-Id/X-Actor-Id atau Idempotency-Key hilang;
            reasonCode di luar daftar tertutup; reasonCode `lainnya` tanpa
            catatan minimal 10 karakter; atau hlc bukan string bilangan bulat
            desimal (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            orderId tidak ditemukan (NOT_FOUND) atau aktor tidak
            ditemukan/tidak aktif (ACTOR_NOT_FOUND) — keduanya lewat SELECT
            yang tunduk RLS, bukan FK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Order sudah pernah dibatalkan (ORDER_ALREADY_VOIDED); status
            order tidak mengizinkan pembatalan (ORDER_NOT_CANCELLABLE);
            nomor struk pembatal bentrok (RECEIPT_SEQUENCE_TAKEN); id
            pembatal sudah dipakai (ID_ALREADY_EXISTS); atau request dengan
            Idempotency-Key yang sama sedang diproses (IDEMPOTENCY_KEY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Idempotency-Key sudah dipakai untuk body yang berbeda
            (IDEMPOTENCY_KEY_HASH_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: >-
            Order berstatus CLOSED, jadi operasinya refund — belum tersedia
            (NOT_IMPLEMENTED). Menolak lebih baik daripada mem-void
            penjualan sah dan mengeluarkannya dari omzet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/payments:
    post:
      operationId: createPayment
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              # Hanya `id` yang wajib di KONTRAK. Field mana lagi yang wajib
              # bergantung pada METODE, dan JSON Schema tidak bisa menyatakan
              # "wajib bila method = X" tanpa oneOf yang justru mengaburkan
              # pesan errornya. Tunai menuntut tenderedAmount; QRIS dinamis
              # menuntut amount. Keduanya divalidasi di handler, pola yang
              # sama dengan POST /orders/{orderId}/cancel.
              required: [id]
              properties:
                id: { type: string }
                method:
                  type: string
                  # Daftar TERTUTUP. `other` (voucher fisik, transfer) belum
                  # dibangun -- FR-C2 menuntut catatan wajib untuknya, dan
                  # menerimanya sebelum itu ada berarti membangun separuh
                  # FR-C2 tanpa pengaman yang menyertainya.
                  enum: [cash, qris_dynamic, qris_static, card_edc]
                  default: cash
                # tenderedAmount = uang yang DISERAHKAN pelanggan (tunai
                # saja), bukan yang terpakai. Server yang menghitung amount
                # dan changeAmount, karena keduanya bergantung pada pembulatan
                # tunai (FR-C9) yang ditentukan rounding_increment/
                # rounding_mode outlet. Tanpa `type` -- assertTenderedAmountValid
                # satu-satunya sumber kebenaran, pola sama dengan
                # PriceInput.price.
                tenderedAmount: {}
                # amount = nominal yang diminta ke gateway (QRIS dinamis).
                # Tidak ada uang yang diserahkan di tangan, jadi tidak ada
                # tendered maupun kembalian.
                amount: {}
                # --- QRIS statis (FR-C2) ---
                # WAJIB. Kontrol anti-fraud, bukan formalitas: QRIS statis
                # dikonfirmasi kasir TANPA verifikasi sistem apa pun, dan
                # berfungsi offline. Isinya nominal + 4 digit terakhir nomor
                # referensi, atau catatan.
                #
                # Ditolak bila memuat 13-19 digit berurutan (AC FR-C5 keempat)
                # -- itu bentuk nomor kartu.
                reference: { type: string, nullable: true }
                # --- EDC (FR-C4) ---
                # approvalCode WAJIB; cardLast4 opsional dan maksimal 4 DIGIT.
                # Tidak ada field mana pun di kontrak ini yang menerima nomor
                # kartu lengkap, dan itu permanen.
                approvalCode: { type: string, nullable: true }
                cardLast4: { type: string, nullable: true, maxLength: 4 }
                acquirer: { type: string, nullable: true }
                terminalReference: { type: string, nullable: true }
                occurredAt: { type: string, format: date-time }
                hlc: { type: string }
      responses:
        '201':
          description: >-
            Pembayaran tercatat. Order berpindah ke CLOSED bila lunas
            (OPEN -> PAID -> CLOSED); tetap OPEN bila kurang bayar, dengan
            sisa tagihan di .
          content:
            application/json:
              schema:
                type: object
                required: [payment, order, outstanding]
                properties:
                  payment: { $ref: '#/components/schemas/Payment' }
                  order:
                    type: object
                    required: [id, status, total, taxAmount, roundingAdjustment, amountDue]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      total: { type: integer }
                      taxAmount: { type: integer }
                      roundingAdjustment: { type: integer }
                      amountDue: { type: integer }
                  outstanding: { type: integer }
                  # --- QRIS dinamis saja (FR-C2, FR-C14) ---
                  # Wajib dideklarasikan di sini: serializer Fastify MEMBUANG
                  # properti yang tidak ada di skema, jadi field yang lupa
                  # ditulis akan hilang diam-diam dari respons -- bukan gagal,
                  # yang jauh lebih sulit dilacak.
                  #
                  # Kosong untuk pembayaran tunai.
                  qrString:
                    type: string
                    nullable: true
                    description: >-
                      Isi QR untuk dirender klien. `null` bila gateway tidak
                      dapat dihubungi — payment tetap tercatat
                      `pending_confirmation` (FR-C14).
                  expiresAt: { type: string, nullable: true }
                  # `false` berarti QR gagal diambil, BUKAN berarti pembayaran
                  # gagal. Pelanggan mungkin sudah membayar; klien menampilkan
                  # "Cek status", bukan "pembayaran gagal".
                  gatewayReachable: { type: boolean }
        '400':
          description: Validation error, metode belum didukung, atau Idempotency-Key hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Order tidak dalam status yang bisa dibayar, id sudah ada, atau key sedang diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /tax-rates:
