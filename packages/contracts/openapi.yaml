  /reports/sales:
    get:
      operationId: getSalesReport
      summary: >-
        FR-G3/FR-G7 -- posisi penjualan untuk rentang tanggal bisnis. Satu
        endpoint untuk seluruh laporan penjualan back-office.
      description: >-
        ## Rentang memakai `business_date`, BUKAN `occurred_at`


        `order.business_date` dihitung SEKALI saat penjualan, dari zona waktu
        outletnya, dan sejak itu hanya DIBACA (CLAUDE.md -- "Tanggal bisnis
        dibaca dari order.business_date, tidak dihitung ulang dari
        occurred_at"). Memfilter `occurred_at` di sini akan menjadikan laporan
        tempat KEDUA yang memutuskan tanggal sebuah penjualan, dan untuk outlet
        di WITA/WIT jawabannya akan berbeda dari tutup kas di outlet itu
        sendiri.


        Tanggal bisnis juga tidak berakhir tengah malam melainkan saat tutup
        shift (default 04:00), jadi `occurred_at` pukul 01:00 milik tanggal
        bisnis SEBELUMNYA.


        ## Angkanya dihitung fungsi yang sama dengan aplikasi kasir


        Handler mengambil baris lalu memanggil `posisiPenjualan()`
        (`packages/domain/src/posisi-penjualan.ts`) -- fungsi yang sama persis
        yang dipakai laporan harian kasir di atas SQLite lokal. Itu yang membuat
        AC FR-G4 ("angka laporan lokal cocok dengan laporan server") dapat
        dipenuhi, dan penjaga `tests/domain/satu-sumber-omzet.test.js` menolak
        agregasi `SUM(...)` atas tabel `order` di berkas mana pun selain
        fungsi itu.


        ## Order pembatal ikut terbawa rentang


        Order pembatal MENYALIN `business_date` order aslinya (`cancel.ts`),
        jadi rentang yang memuat order asli selalu memuat pembatalnya juga --
        dan deteksi "sudah dibatalkan" tidak pernah meleset karena batas
        rentang.


        Refund diambil lewat `business_date` ORDER-nya, sama seperti laporan
        harian kasir. Refund atas transaksi hari lalu karena itu mengurangi
        omzet pada hari transaksi ASLINYA, bukan hari refundnya.
      parameters:
        - name: from
          in: query
          required: true
          description: Tanggal bisnis awal, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: to
          in: query
          required: true
          description: Tanggal bisnis akhir, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          description: >-
            Dikosongkan berarti SELURUH outlet tenant. Lintas-outlet
            diagregasi berdasarkan tanggal bisnis lokal masing-masing outlet --
            itulah yang `business_date` sudah simpan.
          schema: { type: string }
      responses:
        '200':
          description: Posisi penjualan untuk rentang tersebut.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanPenjualan'
        '400':
          description: >-
            Header X-Tenant-Id hilang, `from`/`to` bukan YYYY-MM-DD, atau
            `from` lebih besar dari `to` (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Aktor tidak berhak melihat laporan (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            Aktor tidak ditemukan, atau `outlet_id` bukan milik tenant
            pemanggil (OUTLET_NOT_FOUND) -- divalidasi lewat SELECT yang tunduk
            RLS, bukan FK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/products:
    get:
      operationId: getProductReport
      summary: >-
        FR-G1 -- laporan produk: BARANG yang keluar pada rentang tanggal
        bisnis. Operasional, bukan finansial.
      description: >-
        ## ⛔ Ini BUKAN laporan uang, dan istilahnya sengaja berbeda


        Metriknya `kuantitas` dan `nilaiKotor` -- bukan "omzet". Omzet punya
        satu definisi tunggal di `packages/domain/src/posisi-penjualan.ts`
        (FR-G3), dan angka di sini TIDAK sama dengannya: ia mengagregasi
        `order_line`, tidak mengurangkan refund, dan tidak memakai
        `order.total`.


        `CLAUDE.md`: *"basis laporan per produk adalah sebelum void & refund,
        dan itu bukan kelalaian: baris produk menyatakan barang apa yang
        keluar, dan refund uang tidak selalu mengembalikan barang"*.


        ## Void diabaikan, refund TIDAK


        Pesanan yang dibatalkan tidak pernah menghasilkan barang keluar -- ia
        dikeluarkan. Pesanan yang direfund SUDAH menghasilkan barang keluar;
        uangnya kembali, barangnya belum tentu (`lines: []` pada refund
        berarti uang kembali tanpa barang kembali). Ia tetap dihitung.


        ## ⛔ Dilaporkan per VARIATION, bukan per produk


        `order_line` tidak punya `item_id` sama sekali -- hanya
        `variation_id` beserta snapshot `item_name` dan `variation_name`.
        Menambahkan id produk menuntut join ke `item_variation` yang dimiliki
        modul catalog, dan invariant #4 melarang modul ordering meng-query
        tabel milik modul lain.


        Nama yang dikembalikan adalah SNAPSHOT saat penjualan, bukan nama
        katalog hari ini -- produk yang berganti nama tetap dapat dijelaskan
        di laporan lama.


        ## Kuantitas berskala x1000


        Konvensi repo: `order_line.quantity` adalah INTEGER x1000
        (`0.5 kg` -> `500`). `kuantitas` di sini dikirim apa adanya dalam
        skala itu; `kuantitasTampil` adalah bentuk desimalnya sebagai string.
      parameters:
        - name: from
          in: query
          required: true
          description: Tanggal bisnis awal, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: to
          in: query
          required: true
          description: Tanggal bisnis akhir, inklusif. `YYYY-MM-DD`.
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          description: Dikosongkan berarti seluruh outlet tenant.
          schema: { type: string }
      responses:
        '200':
          description: >-
            Baris per variation, terurut kuantitas menurun lalu nama --
            deterministik.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanProduk'
        '400':
          description: >-
            Header X-Tenant-Id hilang, `from`/`to` bukan YYYY-MM-DD, atau
            `from` lebih besar dari `to` (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            Aktor tidak ditemukan, atau `outlet_id` bukan milik tenant
            pemanggil (OUTLET_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/cashiers:
    get:
      operationId: getCashierReport
      summary: FR-G1 -- posisi penjualan per kasir, pada rentang tanggal bisnis.
      description: >-
        Setiap kasir dihitung lewat `posisiPenjualan()` yang sama dengan
        laporan global (FR-G3), bukan lewat SUM tersendiri. Sifat yang dijaga:
        jumlah seluruh kasir SAMA dengan angka laporan global.


        ⛔ Order pembatal dimasukkan ke kelompok pemilik order ASLINYA, bukan
        pemilik pembatal. Pembatal punya `created_by` sendiri -- orang yang
        menekan tombol void, yang sering bukan kasir yang menjual. Tanpa itu,
        kelompok kasir penjual tidak memuat pembatalnya dan penjualan yang
        sudah dibatalkan tetap masuk omzetnya.


        Konsekuensinya disengaja: `voidAmount` melekat pada kasir yang
        PENJUALANNYA dibatalkan, bukan pada yang menekan tombolnya. Manajer
        yang membatalkan sepuluh transaksi kasir lain tidak muncul dengan void
        sepuluh. Penyalahgunaan void dilacak laporan exception FR-G5 lewat
        `audit_event`, yang memang menyimpan aktornya.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Baris per kasir, terurut omzet bersih menurun lalu nama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanKasir'
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/payments:
    get:
      operationId: getPaymentReport
      summary: FR-G1 -- uang masuk per metode pembayaran.
      description: >-
        ⛔ Rekonsiliasi TIDAK termasuk. `IA:§3.3` menamai layarnya "Laporan
        Pembayaran & Rekonsiliasi", tapi Modul C-3 belum dibangun sama sekali
        (P1). Endpoint ini murni agregasi per metode; batasnya dinyatakan,
        bukan disamarkan dengan field kosong.


        ⛔ Hanya payment `confirmed` (spec-c:223). Yang masih
        `pending_confirmation` (QRIS dinamis) belum boleh dianggap uang
        masuk, dan `failed` jelas bukan.


        ⛔ Ini BERBEDA dari laporan harian di aplikasi kasir
        (`apps/kasir/src/laporan/harian.ts`), yang menjumlahkan payment tanpa
        menyaring status. Selisihnya muncul hanya bila ada payment
        non-confirmed pada hari itu -- dan bila itu terjadi, angka yang benar
        adalah yang di sini.


        `totalDiterima` BUKAN omzet: omzet bersih mengurangkan refund, dan
        refund tidak menghasilkan baris payment negatif (payment.amount punya
        CHECK amount > 0).
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Baris per metode, terurut total menurun.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanPembayaran'
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/export:
    get:
      operationId: getReportExport
      summary: FR-G1 -- keempat laporan sebagai CSV.
      description: >-
        Angkanya datang dari FUNGSI yang sama dengan endpoint JSON
        (`ambilPenjualan`, `ambilProduk`, `ambilKasir`,
        `ambilPembayaran`) -- tidak ada query yang ditulis ulang. CSV adalah
        berkas yang merchant bawa ke akuntannya, dan CSV yang berbeda dari
        layar adalah bentuk terburuk perbedaan angka.


        ⛔ Sel yang diawali `=`, `+`, `-`, `@`, tab, atau CR diawali
        kutip tunggal: Excel dan Google Sheets mengeksekusinya sebagai RUMUS,
        dan nama produk berasal dari input merchant. Korbannya bukan yang
        mengetiknya melainkan akuntan yang membuka berkasnya.


        ⛔ Diawali BOM UTF-8. Tanpanya Excel di Windows membaca CSV sebagai
        ANSI dan setiap nama ber-aksen rusak.


        Uang ditulis apa adanya dari bigint -- tanpa pemisah ribuan dan tanpa
        simbol mata uang, supaya kolomnya dapat dijumlahkan spreadsheet.
      parameters:
        - name: type
          in: query
          required: true
          # SENGAJA tanpa `enum`: handler adalah satu-satunya sumber
          # kebenaran untuk penolakan ini, dan pesannya MENYEBUT pilihan
          # yang sah. AJV menolak lebih dulu dengan "must be equal to one
          # of the allowed values" -- benar, tapi tidak dapat
          # ditindaklanjuti. Pola sama dengan PriceInput.price,
          # TaxRateInput.rate, dan selectionType.
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Berkas CSV. `content-disposition` memuat jenis dan rentangnya.
          content:
            text/csv:
              schema: { type: string }
        '400':
          description: >-
            Parameter `type` atau rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/exceptions/voids:
    get:
      operationId: getVoidExceptionReport
      summary: >-
        FR-G5 X1 -- void & refund per PELAKU, pada rentang tanggal bisnis.
      description: >-
        ⛔ Menjawab pertanyaan yang `/reports/cashiers` sengaja TIDAK jawab.
        Laporan kasir melekatkan `voidAmount` pada kasir yang PENJUALANNYA
        dibatalkan -- supaya jumlah seluruh kasir sama dengan laporan global.
        Di sini yang dilacak adalah yang MENEKAN TOMBOL
        (`audit_event.actor_user_id`).


        Keduanya benar untuk pertanyaan berbeda. Sejak keputusan 1 Agustus 2026
        menghapus PIN manajer dari void, ini satu-satunya kontrol yang tersisa
        terhadap penyalahgunaannya.


        ⛔ SATU-SATUNYA endpoint laporan yang menuntut operasi RBAC eksplisit
        (`report_exception`). Keempat laporan lain hanya menuntut sesi yang
        sah, dan itu benar: omzet outletnya sendiri bukan rahasia dari kasir.
        Daftar siapa-membatalkan-apa adalah. AC spec-g: "Kasir tidak dapat
        mengakses laporan exception".


        ⛔ Nilai uang datang dari `order.total` lewat JOIN, BUKAN dari
        `audit_event.before`. Payload audit sempat menulis `Number(total)`
        atas bigint; baris lama tidak di-backfill, jadi laporan tidak boleh
        mempercayainya.


        ⛔ Tanpa bahasa menuduh: tidak ada skor, tidak ada label. `rasio`
        dibandingkan terhadap RATA-RATA seluruh pelaku pada periode ini, sebagai
        STRING satu angka desimal -- ia satu-satunya angka yang diurutkan, dan
        urutan yang berpindah antar-muat adalah laporan yang tidak dapat
        dipercaya.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            Ringkasan per pelaku (terurut tingkat anomali) beserta daftar
            peristiwa untuk drill-down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaporanException'
        '400':
          description: Rentang tidak valid (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Aktor tidak berhak melihat laporan exception (FORBIDDEN). Kasir
            selalu mendarat di sini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/transactions/{order_id}:
    get:
      operationId: getTransactionDetail
      summary: B-03 -- detail satu transaksi, digabung dari empat modul.
      description: >-
        Dilayani modul reporting, satu-satunya modul yang boleh MEMBACA lintas
        domain: satu struk menurut definisi menggabungkan order (ordering),
        pembayaran (payment), nama kasir (identity), dan refund. Modul itu
        tidak memiliki satu tabel pun dan tidak menulis apa pun -- kedua sifat
        itulah yang membuat izin bacanya aman.


        Uang seluruhnya STRING. tenderedAmount dan changeAmount boleh null
        untuk metode non-tunai, dan null DIPERTAHANKAN: "Tunai diterima:
        Rp 0" adalah pernyataan yang salah, bukan sekadar kosong.


        quantityMilli adalah kuantitas x1000.


        404 dipakai untuk transaksi yang tidak ada MAUPUN milik tenant lain,
        dengan pesan yang sama persis.
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detail transaksi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailTransaksi'
        '404':
          description: Transaksi tidak ditemukan, atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /orders/cleanup-abandoned:
    post:
      operationId: cleanupAbandonedOrders
      summary: Menutup keranjang mati dan membebaskan stok yang dikuncinya.
      description: >-
        Movement sale ditulis saat order DIBUAT, bukan saat dibayar. Order yang
        dibuat lalu ditinggalkan karena itu memegang stok selamanya, dan
        keputusan B-02 menyembunyikan keranjang open dari daftar transaksi --
        jadi stok berkurang karena order yang tidak dapat dilihat siapa pun.


        Endpoint ini mencari order berstatus open yang recorded_at-nya lebih
        tua dari 24 jam, membalik movement sale-nya, dan mengubah statusnya
        menjadi abandoned. Ambangnya memakai recorded_at (jam database), BUKAN
        occurred_at (jam perangkat, yang dapat menyimpang dan mundur).


        Aman dijalankan berulang: putaran kedua tidak menemukan order yang sama
        karena statusnya sudah bukan open.


        Menuntut operasi stock_adjust -- efeknya membebaskan stok, dan itu
        tingkat manajer.
      responses:
        '200':
          description: Ringkasan pembersihan.
          content:
            application/json:
              schema:
                type: object
                required:
                  [jamKedaluwarsa, jumlahDibersihkan, movementDitulis,
                   totalStokDikembalikan, orderIds]
                properties:
                  jamKedaluwarsa: { type: integer }
                  jumlahDibersihkan: { type: integer }
                  movementDitulis: { type: integer }
                  totalStokDikembalikan:
                    type: string
                    description: Kuantitas x1000, STRING.
                  orderIds:
                    type: array
                    items: { type: string }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/movements:
    post:
      operationId: createStockMovement
      summary: B-13 -- mencatat barang masuk atau koreksi stok.
      description: >-
        Satu-satunya jalan MEMASUKKAN stok ke sistem. Hanya menerima tipe
        receipt dan adjustment; sale, void, dan refund lahir dari transaksi
        penjualan di transaksi database yang sama dengannya, dan menerimanya
        di sini membuka jalan menulis pergerakan penjualan tanpa penjualannya.


        adjustment WAJIB menyertakan reasonCode (AC FR-E2). receipt wajib
        positif -- tanpa aturan itu, receipt negatif menjadi cara mengurangi
        stok tanpa alasan, persis yang adjustment diwajibkan menyertakannya.


        delta adalah kuantitas x1000 bertanda, dikirim sebagai STRING.


        Menuntut operasi stock_adjust.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId, variationId, type, delta]
              properties:
                id: { type: string }
                outletId: { type: string }
                variationId: { type: string }
                type:
                  type: string
                  description: 'receipt | adjustment'
                delta:
                  type: string
                  description: Kuantitas x1000, bertanda.
                reasonCode: { type: string, nullable: true }
                note: { type: string, nullable: true }
                unitCost: { type: string, nullable: true }
      responses:
        '201':
          description: Movement tercatat.
          content:
            application/json:
              schema:
                type: object
                required: [id, outletId, variationId, type, delta]
                properties:
                  id: { type: string }
                  outletId: { type: string }
                  variationId: { type: string }
                  type: { type: string }
                  delta: { type: string }
                  reasonCode: { type: string, nullable: true }
        '400':
          description: Tipe, delta, atau alasan tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Outlet atau variation tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/inventory/stocks:
    get:
      operationId: getInventoryStocks
      summary: B-12 -- saldo stok per varian, dari SUM(delta).
      description: >-
        Dilayani modul reporting: saldo butuh stock_movement (milik inventory)
        DAN nama produk (milik catalog), dan modul itu satu-satunya yang boleh
        membaca lintas domain.


        Saldo dihitung SUM(delta), bukan dibaca dari stock_snapshot -- tabel
        itu ada di skema server dan kosong, dan memakainya berarti membangun
        keadaan kedua yang dapat basi untuk mempercepat sesuatu yang belum
        pernah diukur lambat.


        saldoMilli adalah kuantitas x1000 sebagai STRING; saldo adalah bentuk
        terbacanya, dihitung dari bilangan bulat. Pembagian 1000 TIDAK
        dilakukan di SQL -- pembagian integer atas bigint membuat 2500 menjadi
        2, dan setengah kilogram menghilang tanpa error.


        include_zero=true menyertakan varian yang belum punya movement sama
        sekali, dan hanya berlaku bila outlet_id diberikan -- tanpa outlet yang
        jelas, saldo nol tidak dapat dibentuk. Varian itu justru yang paling
        perlu terlihat: barang baru yang stoknya belum pernah dimasukkan.
      parameters:
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: only_negative
          in: query
          required: false
          schema: { type: string }
        - name: include_zero
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Saldo stok per varian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarStok'
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shifts/{shiftId}/close:
    post:
      operationId: closeShift
      summary: Menutup shift, mencatat hitungan fisik dan selisihnya.
      description: >-
        Sampai endpoint ini ada, tutup kas hanya terjadi di perangkat dan
        hasilnya tidak pernah sampai ke server -- setiap shift berstatus open
        selamanya, dengan counted_amount, difference, dan closed_at permanen
        NULL. Itu yang memblokir B-04 dan B-05.


        Saldo seharusnya dihitung dari cash_movement (spec-d:14), BUKAN dari
        payment, dan opening_float dikecualikan dari penjumlahan karena ia
        sudah menjadi saldo awal -- menjumlahkan keduanya menghitung modal awal
        dua kali.


        Selisih yang melewati ambang FR-D4 menuntut alasan DAN penyetuju yang
        berbeda dari yang menghitung. Ambangnya dipakai bersama dengan aplikasi
        kasir lewat packages/domain.


        Yang boleh menutup: kasir yang membuka shift itu, atau manajer
        (operasi approve_cash_variance). Kasir lain ditolak 403 -- shift
        memegang uang yang dipertanggungjawabkan satu orang.


        Percobaan hitungan DITAMBAHKAN, tidak pernah menimpa.
      parameters:
        - name: shiftId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countedAmount]
              properties:
                countedAmount:
                  type: string
                  description: Hitungan fisik laci, rupiah utuh. Tidak boleh negatif.
                varianceReasonCode: { type: string, nullable: true }
                varianceNote: { type: string, nullable: true }
      responses:
        '200':
          description: Shift tertutup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HasilTutupShift'
        '400':
          description: >-
            Hitungan tidak valid, atau selisih melewati ambang tanpa alasan /
            penyetuju yang sah.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Bukan pemilik shift dan bukan manajer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Shift tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Shift sudah ditutup.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/shifts:
    get:
      operationId: getShiftReport
      summary: B-04 -- daftar shift beserta selisih kasnya.
      description: >-
        Bawaan hanya shift yang sudah DITUTUP. Shift berjalan tidak punya angka
        selisih, dan menampilkannya kosong di kolom uang membuat manajer
        mengira hitungannya nol; include_open=true menyertakannya secara
        eksplisit.


        expectedAmount dan difference DIBACA dari kolom yang ditulis saat
        penutupan, tidak dihitung ulang saat laporan dibaca -- movement yang
        tiba terlambat dari perangkat offline akan mengubah selisih shift yang
        sudah ditandatangani manajer, tanpa satu pun jejak.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: include_open
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Daftar shift.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarShift'
        '400':
          description: Rentang tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/shifts/{shift_id}:
    get:
      operationId: getShiftDetail
      summary: B-05 -- rincian satu shift.
      description: >-
        Menggabungkan cash_drawer_shift (cash), nama kasir (identity), dan
        rincian pembayaran per metode (payment). Hanya pembayaran confirmed
        yang dihitung.


        gerakanKas memuat pergerakan NON-penjualan -- setoran bank,
        pengeluaran, koreksi. opening_float dan sale dikecualikan: yang pertama
        sudah menjadi saldo awal, yang kedua sudah terwakili rincian per
        metode.
      parameters:
        - name: shift_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Detail shift.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailShift'
        '404':
          description: Shift tidak ditemukan, atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/inventory/oversells:
    get:
      operationId: getInventoryOversells
      summary: B-15 "Perlu Diperiksa" -- oversell dan selisih kas.
      description: >-
        Dua daftar dalam satu respons, karena IA menamai layarnya "Perlu
        Diperiksa (oversell + selisih)". Mengirimnya terpisah berarti layar
        harus menjahitnya sendiri, dan ringkasan "berapa yang perlu diperiksa"
        jadi punya dua sumber.


        ⛔ Oversell BUKAN kesalahan. Pencegahannya saat offline adalah non-goal
        PERMANEN (konsekuensi teorema CAP): dua perangkat yang menjual barang
        terakhir saat offline sama-sama benar, dan keduanya harus berhasil.
        Yang dilakukan sistem adalah membuat konsekuensinya terlihat dan
        tertangani sebagai proses bisnis. Bahasanya karena itu deskriptif --
        perangkat yang TERLIBAT, bukan pelaku.


        Rentang oversell dihitung atas detected_at (waktu server menyadarinya),
        bukan tanggal bisnis penjualannya: oversell lahir saat perangkat kedua
        tersinkronisasi, dan itu dapat berhari-hari kemudian.


        Selisih kas hanya memuat shift TERTUTUP yang selisihnya bukan nol.
        Shift yang cocok bukan "perlu diperiksa", dan difference NULL berarti
        belum dihitung -- bukan selisih nol.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
        - name: include_resolved
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Oversell dan selisih kas pada rentang ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerluDiperiksa'
        '400':
          description: Rentang tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes:
    post:
      operationId: createStocktake
      summary: B-14 -- memulai opname. Waktu T dibekukan di sini.
      description: >-
        snapshot_at diisi jam DATABASE dan menjadi waktu T untuk seluruh opname
        ini. Penjualan tetap berjalan selama opname (FR-E7); movement setelah
        waktu T tidak memengaruhi perhitungan selisih.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outletId]
              properties:
                id: { type: string }
                outletId: { type: string }
      responses:
        '201':
          description: Opname dimulai.
          content:
            application/json:
              schema:
                type: object
                required: [id, outletId, status, snapshotAt, startedBy]
                properties:
                  id: { type: string }
                  outletId: { type: string }
                  status: { type: string }
                  snapshotAt: { type: string, format: date-time }
                  startedBy: { type: string }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listStocktakes
      summary: B-14 -- riwayat opname.
      parameters:
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Daftar opname, terbaru lebih dulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaftarOpname'
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes/{stocktakeId}:
    get:
      operationId: getStocktake
      summary: B-14 -- rincian satu opname beserta selisih per baris.
      parameters:
        - name: stocktakeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Rincian opname.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailOpname'
        '404':
          description: Opname tidak ditemukan, atau milik tenant lain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes/{stocktakeId}/lines:
    put:
      operationId: saveStocktakeLines
      summary: B-14 -- menyimpan hitungan fisik. Dapat dipanggil berulang.
      description: >-
        FR-E7: "Opname dapat dijeda dan dilanjutkan." Menyimpan ulang hitungan
        untuk varian yang sama adalah alur NORMAL, bukan kesalahan.


        ⛔ expected_qty dibekukan pada penyimpanan PERTAMA dan tidak ditulis
        ulang. Ia saldo pada waktu T, dihitung dari movement ber-occurred_at
        <= snapshot_at. Kalau ia ikut diperbarui setiap koreksi hitungan, waktu
        T bergerak dan seluruh alasan aturannya hilang.
      parameters:
        - name: stocktakeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    required: [variationId, countedQty]
                    properties:
                      variationId: { type: string }
                      countedQty:
                        type: string
                        description: Hitungan fisik x1000. Tidak boleh negatif.
                      reasonCode: { type: string, nullable: true }
      responses:
        '200':
          description: Hitungan tersimpan.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, lines]
                properties:
                  id: { type: string }
                  status: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [variationId, expectedQty, countedQty]
                      properties:
                        variationId: { type: string }
                        expectedQty: { type: string }
                        countedQty: { type: string }
        '400':
          description: Baris atau kuantitas tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opname atau variation tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Opname sudah diselesaikan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /inventory/stocktakes/{stocktakeId}/complete:
    post:
      operationId: completeStocktake
      summary: B-14 -- menyelesaikan opname; di sinilah movement lahir.
      description: >-
        ⛔ delta = hitungan_fisik - stok_pada_T, BUKAN hitungan - stok saat ini.
        AC FR-E7 menyebutnya eksplisit: "Selisih dihitung terhadap snapshot
        waktu T, bukan stok saat penyimpanan."


        Kalau selisih dihitung terhadap stok saat penyelesaian, setiap
        penjualan yang terjadi selama petugas menghitung akan TERHAPUS: sistem
        dipaksa sama dengan angka fisik yang dihitung sebelum penjualan itu
        terjadi, dan barang yang benar-benar keluar dari rak kembali muncul di
        catatan.


        ⛔ Tipe movementnya stocktake, BUKAN adjustment. FR-E2 memberi keduanya
        baris tersendiri, dan adjustment WAJIB reason_code -- hasil opname
        tidak selalu punya satu, karena sebab selisihnya justru yang sedang
        dicari.


        Baris yang cocok (selisih nol) tidak menghasilkan movement. Movement
        dan penutupan opname ditulis di transaksi yang SAMA.
      parameters:
        - name: stocktakeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Opname selesai.
          content:
            application/json:
              schema:
                type: object
                required:
                  [id, status, approvedBy, jumlahBaris, jumlahBerselisih,
                   movementDitulis]
                properties:
                  id: { type: string }
                  status: { type: string }
                  snapshotAt: { type: string, nullable: true }
                  approvedBy: { type: string }
                  jumlahBaris: { type: integer }
                  jumlahBerselisih: { type: integer }
                  movementDitulis: { type: integer }
        '403':
          description: Aktor tidak berhak (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opname tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Opname sudah diselesaikan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /reports/dashboard/summary:
    get:
      operationId: getDashboardSummary
      summary: >-
        B-01 -- ringkasan beranda. Omzet, produk terlaris, dan stok.
      description: >-
        ⛔ Endpoint ini tidak menghitung apa pun sendiri. Omzet datang dari
        fungsi yang SAMA dengan GET /reports/sales, produk terlaris dari yang
        sama dengan GET /reports/products, dan stok dari yang sama dengan
        GET /reports/inventory/stocks.


        Alasannya bukan kerapian: dasbor adalah layar yang pertama dilihat
        merchant setiap pagi dan yang paling jarang diperiksa ulang. Angka di
        sini yang berbeda dari laporan akan dipercaya lebih dulu, dan spec-g:29
        menyebut akibatnya -- kepercayaan merchant hilang lebih cepat daripada
        karena fitur yang tidak ada.


        Ringkasan stok hanya dibentuk bila outlet_id diberikan. Stok bersifat
        per outlet, dan satu angka gabungan lintas outlet tidak dapat dipakai
        memutuskan apa pun: kekurangan di satu cabang tertutup kelebihan di
        cabang lain. Tanpa outlet_id, field stok bernilai null.


        Ketiga agregasi berjalan bersamaan di dalam satu transaksi, dan
        seluruhnya menyaring business_date yang punya index.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: outlet_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Ringkasan dasbor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RingkasanDasbor'
        '400':
          description: Rentang tidak valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau outlet tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  schemas:
    HasilTutupShift:
      type: object
      required:
        [id, status, countedAmount, expectedAmount, difference, butuhOtorisasi,
         jumlahPercobaan]
      properties:
        id: { type: string }
        status: { type: string }
        countedAmount: { type: string }
        expectedAmount: { type: string }
        difference:
          type: string
          description: 'counted - expected. Negatif berarti kas kurang.'
        butuhOtorisasi: { type: boolean }
        approvedBy: { type: string, nullable: true }
        closedAt: { type: string, nullable: true }
        jumlahPercobaan: { type: integer }

    DaftarShift:
      type: object
      required: [from, to, outletId, items]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required:
              [id, outletId, deviceId, businessDate, status, openingFloat,
               openedBy, openedByNama, openedAt, totalDiterima, jumlahTransaksi]
            properties:
              id: { type: string }
              outletId: { type: string }
              deviceId: { type: string }
              businessDate: { type: string }
              status: { type: string }
              openingFloat: { type: string }
              openedBy: { type: string }
              openedByNama: { type: string }
              openedAt: { type: string, format: date-time }
              closedBy: { type: string, nullable: true }
              closedByNama: { type: string, nullable: true }
              approvedBy: { type: string, nullable: true }
              approvedByNama: { type: string, nullable: true }
              closedAt: { type: string, nullable: true }
              countedAmount: { type: string, nullable: true }
              expectedAmount: { type: string, nullable: true }
              difference: { type: string, nullable: true }
              varianceReasonCode: { type: string, nullable: true }
              varianceNote: { type: string, nullable: true }
              totalDiterima: { type: string }
              jumlahTransaksi: { type: integer }

    DetailShift:
      type: object
      required:
        [id, outletId, deviceId, businessDate, status, openingFloat, openedBy,
         openedByNama, openedAt, totalDiterima, jumlahTransaksi, perMetode,
         gerakanKas, percobaanHitungan]
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        businessDate: { type: string }
        status: { type: string }
        openingFloat: { type: string }
        openedBy: { type: string }
        openedByNama: { type: string }
        openedAt: { type: string, format: date-time }
        closedBy: { type: string, nullable: true }
        closedByNama: { type: string, nullable: true }
        approvedBy: { type: string, nullable: true }
        approvedByNama: { type: string, nullable: true }
        closedAt: { type: string, nullable: true }
        countedAmount: { type: string, nullable: true }
        expectedAmount: { type: string, nullable: true }
        difference: { type: string, nullable: true }
        varianceReasonCode: { type: string, nullable: true }
        varianceNote: { type: string, nullable: true }
        totalDiterima: { type: string }
        jumlahTransaksi: { type: integer }
        perMetode:
          type: array
          items:
            type: object
            required: [method, jumlahTransaksi, total]
            properties:
              method: { type: string }
              jumlahTransaksi: { type: integer }
              total: { type: string }
        gerakanKas:
          type: array
          items:
            type: object
            required: [id, type, delta, occurredAt]
            properties:
              id: { type: string }
              type: { type: string }
              delta: { type: string }
              reasonCode: { type: string, nullable: true }
              note: { type: string, nullable: true }
              occurredAt: { type: string, format: date-time }
        percobaanHitungan:
          type: array
          items:
            type: object
            required: [hitungan]
            properties:
              hitungan: { type: string }
              pada: { type: string, nullable: true }
              oleh: { type: string, nullable: true }
    PerluDiperiksa:
      type: object
      required: [from, to, outletId, oversell, selisihKas]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        oversell:
          type: array
          items:
            type: object
            required:
              [id, outletId, variationId, itemName, variationName, detectedAt,
               quantityOver, devicesInvolved, ordersInvolved]
            properties:
              id: { type: string }
              outletId: { type: string }
              variationId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              detectedAt: { type: string, format: date-time }
              quantityOver:
                type: string
                description: Kuantitas x1000 yang terjual melebihi saldo.
              devicesInvolved:
                type: array
                items: { type: string }
              ordersInvolved:
                type: array
                items: { type: string }
              resolvedBy: { type: string, nullable: true }
              resolvedByNama: { type: string, nullable: true }
              resolvedAt: { type: string, nullable: true }
              resolutionNote: { type: string, nullable: true }
        selisihKas:
          type: array
          items:
            type: object
            required: [shiftId, outletId, businessDate, openedByNama, difference]
            properties:
              shiftId: { type: string }
              outletId: { type: string }
              businessDate: { type: string }
              openedByNama: { type: string }
              closedByNama: { type: string, nullable: true }
              approvedByNama: { type: string, nullable: true }
              closedAt: { type: string, nullable: true }
              difference: { type: string }
              varianceReasonCode: { type: string, nullable: true }
              varianceNote: { type: string, nullable: true }
    DaftarOpname:
      type: object
      required: [outletId, items]
      properties:
        outletId: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required:
              [id, outletId, status, startedBy, startedByNama, jumlahBaris,
               jumlahDihitung, jumlahBerselisih]
            properties:
              id: { type: string }
              outletId: { type: string }
              status: { type: string }
              snapshotAt: { type: string, nullable: true }
              startedBy: { type: string }
              startedByNama: { type: string }
              approvedBy: { type: string, nullable: true }
              approvedByNama: { type: string, nullable: true }
              jumlahBaris: { type: integer }
              jumlahDihitung: { type: integer }
              jumlahBerselisih: { type: integer }

    DetailOpname:
      type: object
      required: [id, outletId, status, startedBy, startedByNama, lines]
      properties:
        id: { type: string }
        outletId: { type: string }
        status: { type: string }
        snapshotAt: { type: string, nullable: true }
        startedBy: { type: string }
        startedByNama: { type: string }
        approvedBy: { type: string, nullable: true }
        approvedByNama: { type: string, nullable: true }
        lines:
          type: array
          items:
            type: object
            required: [variationId, itemName, variationName, expectedQty]
            properties:
              variationId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              expectedQty:
                type: string
                description: Saldo pada waktu T, x1000.
              countedQty:
                type: string
                nullable: true
                description: null berarti belum dihitung -- bukan dihitung nol.
              selisih: { type: string, nullable: true }
              reasonCode: { type: string, nullable: true }
    RingkasanDasbor:
      type: object
      required: [from, to, outletId, penjualan, terlaris, stok]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        penjualan:
          type: object
          description: >-
            Bentuk yang SAMA dengan GET /reports/sales -- dihitung fungsi yang
            sama, bukan disalin.
          required:
            [omzetKotor, voidAmount, refundAmount, omzetBersih, pajakTerkumpul,
             jumlahTransaksi, rataRataPerTransaksi]
          properties:
            omzetKotor: { type: string }
            voidAmount: { type: string }
            refundAmount: { type: string }
            omzetBersih: { type: string }
            pajakTerkumpul: { type: string }
            jumlahTransaksi: { type: integer }
            rataRataPerTransaksi: { type: string }
        terlaris:
          type: array
          description: Paling banyak 5, terurut kuantitas menurun.
          items:
            type: object
            required:
              [variationId, itemName, variationName, kuantitas, kuantitasTampil,
               nilaiKotor]
            properties:
              variationId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              kuantitas:
                type: string
                description: Kuantitas x1000.
              kuantitasTampil: { type: string }
              nilaiKotor: { type: string }
        stok:
          type: object
          nullable: true
          description: null bila outlet_id tidak diberikan.
          required: [minus, habis, contoh]
          properties:
            minus: { type: integer }
            habis: { type: integer }
            contoh:
              type: array
              items:
                type: object
                required: [variationId, itemName, variationName, saldo]
                properties:
                  variationId: { type: string }
                  itemName: { type: string }
                  variationName: { type: string }
                  saldo: { type: string }
    DaftarStok:
      type: object
      required: [outletId, items]
      properties:
        outletId: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            required:
              [variationId, itemId, itemName, variationName, outletId,
               trackStock, archived, saldoMilli, saldo, jumlahMovement]
            properties:
              variationId: { type: string }
              itemId: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              categoryId: { type: string, nullable: true }
              outletId: { type: string }
              trackStock: { type: boolean }
              archived: { type: boolean }
              saldoMilli:
                type: string
                description: Kuantitas x1000, STRING.
              saldo:
                type: string
                description: Bentuk terbaca, dihitung dari bilangan bulat.
              jumlahMovement: { type: integer }
              movementTerakhir: { type: string, nullable: true }
    DetailTransaksi:
      type: object
      required:
        [id, receiptNumber, businessDate, sequence, outletId, deviceId, channel,
         status, createdBy, createdByNama, occurredAt, recordedAt, subtotal,
         orderDiscount, serviceChargeAmount, taxAmount, roundingAdjustment,
         total, amountDue, hasCalculationVariance, dibatalkanOleh, lines,
         payments, refunds, totalDibayar, totalRefund]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        businessDate: { type: string }
        sequence: { type: integer }
        outletId: { type: string }
        deviceId: { type: string }
        channel: { type: string }
        status: { type: string }
        createdBy: { type: string }
        createdByNama: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        subtotal: { type: string }
        orderDiscount: { type: string }
        serviceChargeAmount: { type: string }
        taxAmount: { type: string }
        roundingAdjustment: { type: string }
        total: { type: string }
        amountDue: { type: string }
        hasCalculationVariance: { type: boolean }
        varianceAmount: { type: string, nullable: true }
        dibatalkanOleh: { type: string, nullable: true }
        dibatalkanPada: { type: string, nullable: true }
        totalDibayar: { type: string }
        totalRefund: { type: string }
        lines:
          type: array
          items:
            type: object
            required:
              [id, itemName, variationName, unitPrice, quantityMilli,
               discountAmount, taxAmount, isTaxInclusive, lineTotal, modifiers]
            properties:
              id: { type: string }
              itemName: { type: string }
              variationName: { type: string }
              unitPrice: { type: string }
              quantityMilli: { type: integer }
              discountAmount: { type: string }
              taxAmount: { type: string }
              isTaxInclusive: { type: boolean }
              lineTotal: { type: string }
              modifiers:
                type: array
                items:
                  type: object
                  required: [id, name, price, quantityMilli]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    price: { type: string }
                    quantityMilli: { type: integer }
        payments:
          type: array
          items:
            type: object
            required: [id, method, amount, status, confirmedManually, occurredAt]
            properties:
              id: { type: string }
              method: { type: string }
              amount: { type: string }
              tenderedAmount: { type: string, nullable: true }
              changeAmount: { type: string, nullable: true }
              status: { type: string }
              confirmedManually: { type: boolean }
              cardLast4: { type: string, nullable: true }
              occurredAt: { type: string, format: date-time }
        refunds:
          type: array
          items:
            type: object
            required:
              [id, amount, reasonCode, createdBy, createdByNama, approvedBy,
               approvedByNama, occurredAt]
            properties:
              id: { type: string }
              amount: { type: string }
              method: { type: string, nullable: true }
              reasonCode: { type: string }
              reasonNote: { type: string, nullable: true }
              createdBy: { type: string }
              createdByNama: { type: string }
              approvedBy: { type: string }
              approvedByNama: { type: string }
              occurredAt: { type: string, format: date-time }
    DaftarTransaksi:
      type: object
      required: [from, to, outletId, items, cursorBerikut]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        cursorBerikut:
          type: string
          nullable: true
          description: null berarti halaman terakhir.
        items:
          type: array
          items:
            type: object
            required:
              [id, receiptNumber, businessDate, sequence, outletId, deviceId,
               createdBy, occurredAt, total, status, dibatalkanOleh,
               nilaiRefund, hasCalculationVariance]
            properties:
              id: { type: string }
              receiptNumber: { type: string }
              businessDate: { type: string }
              sequence: { type: integer }
              outletId: { type: string }
              deviceId: { type: string }
              createdBy: { type: string }
              occurredAt: { type: string, format: date-time }
              total: { type: string }
              status:
                type: string
                enum: [terjual, dibatalkan, direfund]
              dibatalkanOleh: { type: string, nullable: true }
              nilaiRefund: { type: string }
              hasCalculationVariance: { type: boolean }
    LaporanException:
      type: object
      required: [from, to, outletId, perAktor, peristiwa]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        perAktor:
          type: array
          items:
            type: object
            required:
              [userId, name, jumlahVoid, nilaiVoid, jumlahRefund, nilaiRefund,
               jumlahTotal, rasio, alasan]
            properties:
              userId: { type: string }
              name: { type: string }
              jumlahVoid: { type: integer }
              nilaiVoid: { type: string }
              jumlahRefund: { type: integer }
              nilaiRefund: { type: string }
              jumlahTotal: { type: integer }
              rasio:
                type: string
                description: >-
                  Terhadap rata-rata seluruh pelaku pada periode ini. Satu
                  angka desimal, STRING.
              alasan:
                type: array
                items:
                  type: object
                  required: [reasonCode, jumlah]
                  properties:
                    reasonCode: { type: string }
                    jumlah: { type: integer }
        peristiwa:
          type: array
          items:
            type: object
            required:
              [auditId, occurredAt, recordedAt, jenis, aktorId, aktorNama,
               orderId, receiptNumber, nilai]
            properties:
              auditId: { type: string }
              occurredAt: { type: string, format: date-time }
              recordedAt: { type: string, format: date-time }
              jenis: { type: string, enum: [void, refund] }
              aktorId: { type: string }
              aktorNama: { type: string }
              penyetujuId: { type: string, nullable: true }
              penyetujuNama: { type: string, nullable: true }
              orderId: { type: string }
              receiptNumber: { type: string }
              nilai:
                type: string
                description: Dari `order.total`, bukan dari payload audit.
              reasonCode: { type: string, nullable: true }
              reasonNote: { type: string, nullable: true }
              outletId: { type: string, nullable: true }
    LaporanKasir:
      type: object
      required: [from, to, outletId, kasir]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        kasir:
          type: array
          items:
            type: object
            required: [userId, name, penjualan]
            properties:
              userId: { type: string }
              name: { type: string }
              penjualan:
                $ref: '#/components/schemas/PosisiPenjualan'
    LaporanPembayaran:
      type: object
      required: [from, to, outletId, metode, totalDiterima]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        totalDiterima:
          type: string
          description: Rupiah utuh sebagai STRING -- bigint, bukan number.
        metode:
          type: array
          items:
            type: object
            required: [method, jumlahTransaksi, totalDiterima]
            properties:
              method:
                type: string
                enum: [cash, qris_dynamic, qris_static, card_edc, other]
              jumlahTransaksi: { type: integer }
              totalDiterima: { type: string }
    LaporanProduk:
      type: object
      required: [from, to, outletId, produk]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        produk:
          type: array
          items:
            $ref: '#/components/schemas/BarisProduk'
    BarisProduk:
      type: object
      required:
        [variationId, itemName, variationName, kuantitas, kuantitasTampil, nilaiKotor]
      description: >-
        ⛔ `nilaiKotor` BUKAN omzet. Ia `SUM(quantity x unit_price)` sebelum
        diskon baris, sebelum pajak, dan sebelum refund -- nilai barang yang
        keluar, bukan uang yang masuk. Omzet punya satu definisi tunggal di
        `posisi-penjualan.ts`, dan angka ini tidak akan sama dengannya.
      properties:
        variationId: { type: string }
        itemName:
          type: string
          description: Snapshot saat penjualan, bukan nama katalog hari ini.
        variationName: { type: string }
        kuantitas:
          type: string
          description: >-
            INTEGER x1000 (konvensi repo), dikirim sebagai STRING karena ia
            `bigint` di database.
        kuantitasTampil:
          type: string
          description: Bentuk desimal dari `kuantitas`, mis. `"2"` atau `"0,5"`.
        nilaiKotor:
          type: string
          description: Rupiah utuh sebagai STRING -- `bigint`, bukan `number`.
    LaporanPenjualan:
      type: object
      required: [from, to, outletId, penjualan]
      properties:
        from: { type: string }
        to: { type: string }
        outletId:
          type: string
          nullable: true
          description: >-
            `null` berarti seluruh outlet tenant.
        penjualan:
          $ref: '#/components/schemas/PosisiPenjualan'
    PosisiPenjualan:
      type: object
      required:
        [omzetKotor, voidAmount, refundAmount, omzetBersih, pajakTerkumpul,
         jumlahTransaksi, rataRataPerTransaksi]
      description: >-
        Bentuknya satu-satu dengan `PosisiPenjualan` di
        `packages/domain/src/posisi-penjualan.ts`.


        ⛔ Seluruh nilai uang dikirim sebagai STRING desimal rupiah utuh, bukan
        `number`. Nilainya `bigint` di domain, dan JSON.parse mengubah
        bilangan besar menjadi double -- pola yang sama dengan `TaxRate.rate`.


        `omzetBersih` BOLEH negatif dan tidak pernah dijepit ke nol
        (spec-g:283): refund yang melebihi penjualan menghasilkan hari yang
        justru paling perlu dilihat.
      properties:
        omzetKotor: { type: string }
        voidAmount: { type: string }
        refundAmount: { type: string }
        omzetBersih: { type: string }
        pajakTerkumpul: { type: string }
        jumlahTransaksi: { type: integer }
        rataRataPerTransaksi: { type: string }
    Payment:
      type: object
      required: [id, orderId, checkId, method, amount, status]
      properties:
        id: { type: string }
        orderId: { type: string }
        checkId: { type: string }
        method: { type: string }
        amount: { type: integer }
        tenderedAmount: { type: integer, nullable: true }
        changeAmount: { type: integer, nullable: true }
        status: { type: string }
        confirmedManually: { type: boolean }
        # Terisi hanya untuk metode yang lewat gateway (QRIS dinamis).
        # `providerReference` bisa NULL walau provider terisi: payment ditulis
        # SEBELUM gateway dipanggil, supaya ia tetap ada bila gateway tidak
        # menjawab (FR-C14).
        provider: { type: string, nullable: true }
        providerReference: { type: string, nullable: true }
        tenderedAt: { type: string, format: date-time }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        hlc: { type: string }
    TaxRate:
      type: object
      required: [id, name, type, rate, isInclusive, phase, channel, appliesTo, appliesToIds, effectiveFrom]
      properties:
        id: { type: string }
        outletId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string, enum: [pbjt, ppn, service_charge, none] }
        # `rate` adalah STRING desimal, bukan number. numeric(6,4) dikirim dan
        # diterima sebagai teks supaya tidak pernah melewati IEEE754 double di
        # sisi klien maupun server -- lihat packages/domain/src/numeric.ts.
        rate: { type: string }
        isInclusive: { type: boolean }
        phase: { type: string, enum: [subtotal, total] }
        jurisdiction: { type: string, nullable: true }
        channel: { type: string, enum: [all, dine_in, takeaway] }
        appliesTo: { type: string, enum: [all_items, category, item] }
        appliesToIds:
          type: array
          items: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
    TaxRateInput:
      type: object
      required: [id, name, type, rate]
      properties:
        id: { type: string }
        outletId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string }
        # SENGAJA tanpa `type` di sini: assertRateValid (lewat
        # parseRateToScaled) adalah satu-satunya sumber kebenaran, dan ia harus
        # bisa MENOLAK number. Mendeklarasikan `type: string` membuat AJV
        # menolaknya lebih dulu dengan jalur error yang berbeda; pola sama
        # dengan PriceInput.price.
        rate: {}
        isInclusive: { type: boolean }
        phase: { type: string }
        jurisdiction: { type: string, nullable: true }
        channel: { type: string }
        appliesTo: { type: string }
        appliesToIds:
          type: array
          items: { type: string }
        effectiveFrom: { type: string, format: date-time }
    User:
      type: object
      required: [id, name, isActive, roles, outletIds]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        isActive: { type: boolean }
        pinMustChange: { type: boolean }
        hasPin:
          type: boolean
          description: >-
            Apakah pengguna punya PIN. Hash-nya sendiri TIDAK pernah keluar
            lewat endpoint ini -- ia hanya turun lewat replikasi ke perangkat
            outlet tempat pengguna terdaftar (spec-f:124).
        roles:
          type: array
          items:
            type: object
            required: [role, scopeType, scopeId]
            properties:
              role: { type: string }
              scopeType: { type: string }
              scopeId: { type: string }
        outletIds:
          type: array
          items: { type: string }
    Device:
      type: object
      required: [id, outletId, code]
      properties:
        id: { type: string }
        outletId: { type: string }
        code: { type: string }
        name: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    Shift:
      type: object
      required: [id, outletId, deviceId, businessDate, status, openingFloat, openedBy, openedAt]
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [open, counting, closed] }
        openingFloat: { type: integer, minimum: 0 }
        openedBy: { type: string }
        openedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        colorHint: { type: string, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true }
    ItemVariation:
      type: object
      required: [id, itemId, name, price, sortOrder]
      properties:
        id: { type: string }
        itemId: { type: string }
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0 }
        stockingUnit: { type: string }
        sellingUnit: { type: string }
        conversionFactor: { type: number }
        trackStock: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
    Item:
      type: object
      required: [id, name, variations, modifierLists]
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string, nullable: true }
        description: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
        variations:
          type: array
          items:
            $ref: '#/components/schemas/ItemVariation'
        # FIX 5 (whole-branch review): attachModifierList/detachModifierList
        # existed with no way to read the relation back. Nests the full
        # ModifierList shape (including its own `modifiers`) -- K-04 "Pilih
        # Modifier (modal)" needs both which lists apply AND what each list's
        # choices are. Archived attached lists are not filtered out (same as
        # `variations` on this schema and `modifiers` on ModifierList) -- they
        # carry their own archivedAt instead of disappearing from this array.
        modifierLists:
          type: array
          items:
            $ref: '#/components/schemas/ModifierList'
    ImportResult:
      type: object
      required: [dryRun, jumlahBaris, diimpor, dilewati, masalah, kategoriBaru]
      properties:
        dryRun: { type: boolean }
        jumlahBaris:
          type: integer
          description: >-
            Baris DATA yang dibaca. `diimpor + dilewati + masalah` harus sama
            dengan angka ini -- tidak ada impor parsial diam-diam (spec-a:287).
        diimpor: { type: integer }
        dilewati: { type: integer }
        kategoriBaru:
          type: array
          items: { type: string }
        masalah:
          type: array
          items:
            type: object
            required: [baris, alasan]
            properties:
              baris:
                type: integer
                description: Nomor baris di BERKAS, 1-based, header terhitung.
              alasan: { type: string }
    ItemVariationInput:
      type: object
      required: [id, price]
      properties:
        id: { type: string }
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0 }
        stockingUnit: { type: string }
        sellingUnit: { type: string }
        conversionFactor: { type: number }
        trackStock: { type: boolean }
    Price:
      type: object
      required: [id, variationId, price, effectiveFrom, changedBy]
      properties:
        id: { type: string }
        variationId: { type: string }
        outletId: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        changedBy: { type: string }
        reason: { type: string, nullable: true }
    PriceInput:
      type: object
      required: [id, price]
      properties:
        id: { type: string }
        # price SENGAJA tidak diberi `type`/`minimum` di sini -- assertPriceValid
        # (apps/server/src/modules/catalog/handlers/prices.ts) adalah
        # satu-satunya sumber kebenaran untuk kode error ini, termasuk kasus
        # yang tidak bisa dinyatakan lewat JSON Schema (di atas
        # Number.MAX_SAFE_INTEGER). Pola sama dengan selectionType di
        # modifier-lists.ts: AJV/fastify-openapi-glue tidak diam-diam
        # menolak nilai salah lebih dulu lewat jalur error yang tidak
        # menghasilkan envelope {error:{code,message}} yang konsisten.
        price: {}
        outletId: { type: string, nullable: true }
        effectiveFrom: { type: string, format: date-time }
        reason: { type: string, nullable: true }
    ResolvedPrice:
      type: object
      required: [price, source, outletId, at]
      properties:
        price: { type: integer, minimum: 0 }
        # anak tangga yang menghasilkan `price` -- 'outlet' (tangga 1),
        # 'tenant' (tangga 2, default tenant/outlet=NULL), 'variation'
        # (tangga 3, item_variation.price beku). Lihat resolvePrice di
        # apps/server/src/modules/catalog/handlers/prices.ts.
        source: { type: string, enum: [outlet, tenant, variation] }
        outletId: { type: string, nullable: true }
        at: { type: string, format: date-time }
    OutletResolvedPrice:
      allOf:
        - $ref: '#/components/schemas/ResolvedPrice'
        - type: object
          required: [variationId]
          properties:
            variationId: { type: string }
    ModifierList:
      type: object
      required: [id, name, selectionType, minSelections, modifiers]
      properties:
        id: { type: string }
        name: { type: string }
        selectionType: { type: string, enum: [single, multi] }
        minSelections: { type: integer }
        maxSelections: { type: integer, nullable: true }
        allowDuplicate: { type: boolean }
        isRequired: { type: boolean }
        archivedAt: { type: string, format: date-time, nullable: true }
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/Modifier'
    Modifier:
      type: object
      required: [id, modifierListId, name, price, sortOrder]
      properties:
        id: { type: string }
        modifierListId: { type: string }
        name: { type: string }
        price: { type: integer, minimum: 0 }
        isDefault: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
    OrderLineModifierInput:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        modifierId: { type: string, nullable: true }
        name: { type: string }
        # price/quantityMilli SENGAJA tanpa `type` -- assertModifierPriceValid/
        # assertModifierQuantityMilliValid (handlers/orders.ts) satu-satunya
        # sumber kebenaran, pola sama dengan PriceInput.price.
        price: {}
        quantityMilli: {}
    OrderLineInput:
      type: object
      required: [id, variationId, quantityMilli]
      properties:
        id: { type: string }
        variationId: { type: string }
        quantityMilli: {}
        discountAmount: {}
        # FR-H6 -- harga yang DIPAKAI KLIEN saat penjualan terjadi. Opsional.
        # Ia bukan input perhitungan: server meresolusi harganya sendiri pada
        # `occurred_at`. Gunanya hanya satu -- membedakan klien yang belum
        # tersinkron (memakai harga yang PERNAH berlaku) dari selisih yang
        # tidak dapat dijelaskan.
        unitPrice: {}
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineModifierInput'
    OrderLineModifier:
      type: object
      required: [id, name, price, quantityMilli]
      properties:
        id: { type: string }
        modifierId: { type: string, nullable: true }
        name: { type: string }
        price: { type: integer }
        quantityMilli: { type: integer }
    OrderLine:
      type: object
      required:
        - id
        - variationId
        - itemName
        - variationName
        - unitPrice
        - quantityMilli
        - modifierSnapshot
        - discountAmount
        - taxRate
        - taxAmount
        - isTaxInclusive
        - costAtSale
        - lineTotal
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
        - modifiers
      properties:
        id: { type: string }
        variationId: { type: string }
        # SALINAN NILAI (FR-B3) -- item_name/variation_name/unitPrice/
        # costAtSale diambil saat order dibuat lewat getVariationSnapshot +
        # resolvePrice (catalog/index.ts), TIDAK diperbarui lagi meski
        # katalog berubah setelahnya.
        itemName: { type: string }
        variationName: { type: string }
        unitPrice: { type: integer }
        quantityMilli: { type: integer }
        modifierSnapshot:
          type: array
          items: {}
        discountAmount: { type: integer }
        taxRateId: { type: string, nullable: true }
        taxRate: { type: string }
        taxAmount: { type: integer }
        isTaxInclusive: { type: boolean }
        costAtSale: { type: integer }
        lineTotal: { type: integer }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        # bigint 57-bit -- lihat komentar hlc di createOrder request body.
        hlc: { type: string }
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineModifier'
    # Baris `refund` (FR-B7). Ia yang menyatakan arah berlawanan dari sebuah
    # penjualan — BUKAN payment negatif. `payment.amount` punya
    # CHECK (amount > 0) dan itu dipertahankan (keputusan user 7 Agu 2026),
    # sehingga laporan keuangan tidak perlu membedakan payment yang menambah
    # dari yang mengurangi.
    Refund:
      type: object
      required:
        - id
        - orderId
        - amount
        - reasonCode
        - reasonNote
        - createdBy
        - approvedBy
        - occurredAt
        - recordedAt
        - hlc
      properties:
        id: { type: string }
        orderId: { type: string }
        amount: { type: integer }
        reasonCode:
          type: string
          enum: [barang_rusak, pesanan_salah, pelanggan_tidak_puas, kelebihan_bayar, lainnya]
        reasonNote: { type: string, nullable: true }
        createdBy: { type: string }
        # Selalu terisi dan selalu BERBEDA dari createdBy — refund menuntut
        # persetujuan manajer (spec-b:278, tidak dapat diubah). Yang menegakkan
        # perbedaannya adalah CHECK di audit_event, bukan aplikasi.
        approvedBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }

    # Order PEMBATAL (FR-B7). Bentuknya sengaja BUKAN $ref ke Order: ia tidak
    # punya `checkId` maupun `lines`, karena void tidak menjual apa pun. Nilai
    # uangnya disalin dari order yang dibatalkan supaya baris ini terbaca
    # sendirian ("penjualan sebesar sekian dibatalkan"); laporan penjualan
    # mengecualikannya lewat status = voided, bukan lewat nilai nol.
    CancelledOrder:
      type: object
      required:
        - id
        - outletId
        - deviceId
        - shiftId
        - receiptNumber
        - businessDate
        - sequence
        - status
        - channel
        - subtotal
        - orderDiscount
        - serviceChargeAmount
        - taxAmount
        - roundingAdjustment
        - total
        - amountDue
        - voidedByOrderId
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        shiftId: { type: string }
        receiptNumber: { type: string }
        businessDate: { type: string, format: date }
        sequence: { type: integer }
        status: { type: string, enum: [voided, refunded] }
        channel: { type: string, enum: [dine_in, takeaway] }
        subtotal: { type: integer }
        orderDiscount: { type: integer }
        serviceChargeAmount: { type: integer }
        taxAmount: { type: integer }
        roundingAdjustment: { type: integer }
        total: { type: integer }
        amountDue: { type: integer }
        # Menunjuk order yang DIBATALKAN. Arah ini dipaksa AC FR-B7 pertama:
        # kolom di order asli menunjuk pembatalnya menuntut UPDATE pada order
        # asli, dan itu dilarang. Namanya terbaca terbalik untuk pembacaan yang
        # tersisa ini -- lihat HANDOFF.md.
        voidedByOrderId: { type: string }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }

    Order:
      type: object
      required:
        - id
        - outletId
        - deviceId
        - shiftId
        - receiptNumber
        - businessDate
        - sequence
        - status
        - channel
        - subtotal
        - orderDiscount
        - serviceChargeAmount
        - taxAmount
        - roundingAdjustment
        - total
        - amountDue
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
        - checkId
        - lines
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        shiftId: { type: string }
        receiptNumber: { type: string }
        businessDate: { type: string, format: date }
        sequence: { type: integer }
        status: { type: string, enum: [open, paid, closed, voided, refunded, abandoned] }
        channel: { type: string, enum: [dine_in, takeaway] }
        subtotal: { type: integer }
        orderDiscount: { type: integer }
        serviceChargeAmount: { type: integer }
        # Selalu 0 di sub-project ini -- invariant #7, TaxCalculator adalah
        # Modul C dan belum ada (keputusan Q5, PLAN-ordering-fondasi.md §8.0).
        taxAmount: { type: integer }
        roundingAdjustment: { type: integer }
        total: { type: integer }
        amountDue: { type: integer }
        # FR-H6 -- true bila total klien berbeda dari hitungan server DAN
        # selisihnya tidak dapat dijelaskan riwayat harga. Transaksinya tetap
        # diterima: menolaknya berarti kehilangan penjualan yang uangnya sudah
        # diterima merchant (spec-h:95).
        hasCalculationVariance: { type: boolean }
        varianceAmount: { type: integer, nullable: true }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }
        checkId: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    DeviceRingkas:
      type: object
      required: [id, outletId, code, revokedAt, adaKredensial]
      properties:
        id: { type: string }
        outletId: { type: string }
        code: { type: string }
        name: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        lastSeenAt: { type: string, nullable: true }
        revokedAt:
          type: string
          nullable: true
          description: Terisi berarti perangkat dicabut dan tidak dapat lagi menukar token.
        adaKredensial:
          type: boolean
          description: >-
            Apakah kredensial sudah pernah diterbitkan. BUKAN nilainya --
            secret hanya dapat dibaca sekali, pada respons yang menerbitkannya.
        credentialsExpireAt: { type: string, nullable: true }
    PemakaianKuota:
      type: object
      required: [terpakai, batas]
      properties:
        terpakai:
          type: integer
          description: >-
            Jumlah yang sudah dipakai SEKARANG, dengan aturan arsip milik
            modul pemilik tabelnya: produk & outlet mengecualikan yang
            diarsipkan, pengguna mengecualikan yang nonaktif, device
            mengecualikan yang dicabut.
        batas:
          type: integer
          nullable: true
          description: '`null` = tanpa batas.'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
