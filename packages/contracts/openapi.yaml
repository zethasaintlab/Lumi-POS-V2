      operationId: createTaxRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxRateInput'
      responses:
        '201':
          description: >-
            Tarif pajak dibuat. FR-C6 -- tarif adalah entitas berdata, bukan
            konstanta; perubahan perda menghasilkan record baru, yang lama
            diakhiri lewat POST /tax-rates/{id}/end.
          content:
            application/json:
