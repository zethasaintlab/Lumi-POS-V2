openapi: 3.0.0
info:
  title: Lumi POS API
  version: 0.0.1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string

  /tenants:
    post:
      operationId: registerTenant
      summary: >-
        F5 -- pendaftaran merchant mandiri. Membuat tenant, profil vertikal
        default, outlet pertama, dan pengguna owner beserta passwordnya dalam
        SATU transaksi.
      description: >-
        Endpoint KEDUA di API ini yang tidak menuntut `X-Tenant-Id`, setelah
        webhook Midtrans -- dan alasannya berbeda: tenantnya belum ada, jadi
        tidak ada nilai yang benar untuk header itu. `X-Actor-Id` juga tidak
        diminta; aktor pertama adalah owner yang dibuat request ini.


        Seluruh penulisan tetap terjadi di dalam transaksi ber-`SET LOCAL
        app.tenant_id` -- invariant #8 tidak dilonggarkan. `tenant` adalah
        satu-satunya tabel yang dikecualikan RLS, dan itulah yang membuat
        baris pertama dapat ditulis sebelum ada apa pun untuk di-scope.


        ⛔ Belum ada rate limit maupun verifikasi email. Keduanya wajib
        ditutup sebelum merchant berbayar pertama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, outlet, owner]
              properties:
                tenant:
                  type: object
                  required: [id, name]
                  properties:
                    id:
                      type: string
                      minLength: 1
                      description: >-
                        Di-generate klien (konvensi ID repo ini). Ia sekaligus
                        satu-satunya idempotensi endpoint ini: id yang sama
                        diulang menjawab 409, bukan tenant kedua.
                    name: { type: string, minLength: 1 }
                outlet:
                  type: object
                  required: [id, name, timezone]
                  properties:
                    id: { type: string, minLength: 1 }
                    name: { type: string, minLength: 1 }
                    timezone:
                      type: string
                      enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
                    address: { type: string, nullable: true }
                owner:
                  type: object
                  required: [id, name, email, password]
                  properties:
                    id: { type: string, minLength: 1 }
                    name: { type: string, minLength: 1 }
                    email:
                      type: string
                      minLength: 1
                      description: >-
                        Dipakai `POST /auth/login`. Tidak diverifikasi
                        kepemilikannya -- utang yang dicatat, bukan yang
                        didiamkan.
                    password:
                      type: string
                      description: >-
                        FR-F2b -- minimal 10 karakter, ditolak bila ada di
                        daftar bocor yang di-bundle. Aturannya SATU, dibagi
                        dengan `PATCH /users/{userId}/password` lewat
                        `packages/domain/src/password.ts`.
      responses:
        '201':
          description: Tenant, outlet, dan owner tercipta.
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, outletId, ownerId, plan, kuota]
                properties:
                  tenantId: { type: string }
                  outletId: { type: string }
                  ownerId: { type: string }
                  plan:
                    type: string
                    description: >-
                      SELALU `free`. Paket TIDAK diterima dari body -- endpoint
                      ini tidak terautentikasi, jadi paket yang dapat dipilih
                      pemanggil berarti siapa pun memberi dirinya kuota tanpa
                      batas lewat satu field JSON.
                  kuota:
                    type: object
                    description: >-
                      Kuota yang berlaku, dikembalikan supaya merchant melihat
                      batasnya di layar pertama -- bukan saat operasi ditolak.
                      `null` berarti tanpa batas.
                    properties:
                      maxOutlets: { type: integer, nullable: true }
                      maxDevices: { type: integer, nullable: true }
                      maxUsers: { type: integer, nullable: true }
                      maxProducts: { type: integer, nullable: true }
        '400':
          description: >-
            Payload tidak valid, atau password tidak memenuhi FR-F2b
            (PASSWORD_TOO_SHORT / PASSWORD_BREACHED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            id tenant, outlet, atau owner sudah dipakai (ID_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tenants/usage:
    get:
      operationId: getTenantUsage
      summary: >-
        Pemakaian nyata versus kuota. Data untuk layar B-29 "Langganan &
        Batas" (IA:169).
      description: >-
        `research/09` § "Implikasi untuk IA": peringatan kuota mendekati batas
        harus muncul di dashboard owner, BUKAN hanya saat operasi ditolak.


        ⛔ Setiap angka `terpakai` dihitung fungsi yang SAMA PERSIS dengan
        yang dipakai titik penegakannya. Salinan query akan menyimpang pada
        aturan arsip, dan gejalanya adalah merchant yang melihat "12 dari 200"
        lalu ditolak karena kuota penuh.


        Owner-only: `spec-f:52` menandai "Billing & langganan" hanya untuk
        Owner.
      responses:
        '200':
          description: Pemakaian dan batas per dimensi kuota.
          content:
            application/json:
              schema:
                type: object
                required: [plan, status, merchantCategory, kuota]
                properties:
                  plan:
                    type: string
                    enum: [free, standard, pro, enterprise]
                  status:
                    type: string
                    enum: [active, suspended, cancelled]
                  merchantCategory:
                    type: string
                    enum: [umi, uke, ume, ube]
                    description: >-
                      FR-C12. Menentukan tarif MDR yang dipakai untuk
                      MEMPERKIRAKAN potongan settlement. Bawaan `umi`
                      ([ASUMSI] -- belum divalidasi ke merchant).
                  kuota:
                    type: object
                    description: >-
                      Satu entri per dimensi di `DIMENSI_KUOTA`. Nama
                      dimensinya sengaja SAMA dengan yang dipakai penegakan,
                      supaya layar dan server tidak punya dua kosakata.
                      `batas: null` berarti tanpa batas -- bukan nol, dan
                      bukan angka besar.
                    properties:
                      outlet: { $ref: '#/components/schemas/PemakaianKuota' }
                      device: { $ref: '#/components/schemas/PemakaianKuota' }
                      pengguna: { $ref: '#/components/schemas/PemakaianKuota' }
                      produk: { $ref: '#/components/schemas/PemakaianKuota' }
        '403':
          description: Aktor bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tenants/settings:
    patch:
      operationId: updateTenantSettings
      summary: FR-C12 -- kategori merchant, untuk perkiraan potongan MDR.
      description: >-
        AC FR-C12 ketiga: kategori merchant dapat dikonfigurasi per tenant.
        Kategori ditetapkan penyelenggara QRIS saat merchant didaftarkan; POS
        tidak dapat menurunkannya dari data apa pun yang dimilikinya.


        ⛔ Perubahannya berlaku KE DEPAN saja. `payment.mdr_estimated` adalah
        SNAPSHOT saat transaksi; memperbaiki kategori yang salah tidak
        menghitung ulang baris yang sudah ada. Itu disengaja -- dua ekspor
        untuk periode yang sama tidak boleh berbeda.


        Owner-only (`billing`, `spec-f:52`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantCategory]
              properties:
                merchantCategory:
                  type: string
                  # SENGAJA tanpa `enum`: handler adalah satu-satunya sumber
                  # kebenaran untuk penolakan ini, dan pesannya MENYEBUT
                  # pilihan yang sah. Pola sama dengan reports/export type.
      responses:
        '200':
          description: Kategori setelah perubahan.
          content:
            application/json:
              schema:
                type: object
                required: [merchantCategory]
                properties:
                  merchantCategory:
                    type: string
                    enum: [umi, uke, ume, ube]
        '400':
          description: Kategori tidak dikenal (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Aktor bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tenants/subscription/invoices:
    get:
      operationId: listSubscriptionInvoices
      summary: Riwayat tagihan langganan, terbaru dulu. Daftar di B-29.
      description: >-
        Owner-only (`spec-f:52`). Menyertakan paket yang berlaku sekarang,
        supaya layar tidak perlu memanggil `/tenants/usage` hanya untuk
        menampilkan satu kata.
      responses:
        '200':
          description: Paket saat ini dan riwayat tagihan.
          content:
            application/json:
              schema:
                type: object
                required: [plan, status, invoices]
                properties:
                  plan:
                    type: string
                    enum: [free, standard, pro, enterprise]
                  status:
                    type: string
                    enum: [active, suspended, cancelled]
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/TagihanLangganan' }
        '403':
          description: Aktor bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createSubscriptionInvoice
      summary: >-
        F5 -- minta tagihan untuk MENAIKKAN paket, lalu bayar lewat QRIS.
      description: >-
        ⛔ HANYA naik. Menurunkan paket dan membatalkan langganan tidak
        dibangun di epik ini (keputusan user 21 Agustus 2026), dan itu
        berakibat: kuota naik monoton sepanjang `URUTAN_PAKET`, jadi tidak
        pernah ada keadaan di mana merchant membayar lalu kenaikannya ditolak
        karena pemakaiannya tidak muat.


        ⛔ Paketnya BELUM naik saat endpoint ini menjawab 201. Yang menaikkan
        adalah konfirmasi gateway -- lewat webhook Midtrans atau lewat
        `check-status` (`spec-c:320`: sistem tidak pernah menandai lunas tanpa
        konfirmasi).


        ⛔ Tagihannya bukan `payment`. Tabel `payment` punya empat kolom NOT
        NULL yang tagihan langganan tidak punya (`order_id`, `outlet_id`,
        `device_id`, `check_id`) -- dan itu kabar baik: kalau ia menumpang di
        sana, biaya langganan merchant akan muncul sebagai omzet kafenya
        sendiri di B-19.


        Harga dihitung PER OUTLET per bulan (KEP-38). `outletCount`,
        `unitPrice`, dan `amount` ketiganya SNAPSHOT: menaikkan harga bulan
        depan tidak mengubah arti tagihan yang sudah dibayar.


        Owner-only (`spec-f:52`).
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: >-
            WAJIB, dan sengaja TIDAK ditandai `required` di sini -- pola yang
            sama dengan header `Authorization` (lihat `CLAUDE.md` § FR-F12).
            Validator akan menjawab `400 VALIDATION_ERROR`, sementara yang
            dimaksud adalah `MISSING_IDEMPOTENCY_KEY`: kode yang menyebutkan
            APA yang kurang, bukan "permintaanmu cacat". Penjaganya di handler,
            sama seperti seluruh endpoint idempoten lain di API ini.


            Key yang SAMA diulang tidak membuat tagihan kedua. Ia diselesaikan
            hanya bila gateway menjawab -- retry setelah gateway timeout
            menjalankan ulang panggilan gateway dengan key yang sama alih-alih
            menerima respons "tanpa QR" dari cache selamanya.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, plan]
              properties:
                id:
                  type: string
                  minLength: 1
                  description: Di-generate klien (konvensi ID repo ini).
                plan:
                  type: string
                  enum: [standard, pro]
                  description: >-
                    ⛔ `free` dan `enterprise` sengaja TIDAK ada di sini.
                    `free` tidak berbayar (tidak ada yang dapat ditagih), dan
                    `enterprise` adalah negosiasi -- harga angka untuknya
                    berarti seseorang dapat membelinya sendiri dengan harga
                    yang tidak pernah disepakati siapa pun.
      responses:
        '201':
          description: >-
            Tagihan tercipta. `qrString` kosong bila gateway tidak menjawab --
            tagihannya tetap ada dan dapat dicek ulang.
          content:
            application/json:
              schema:
                type: object
                required: [invoice, qrString, expiresAt, gatewayReachable]
                properties:
                  invoice: { $ref: '#/components/schemas/TagihanLangganan' }
                  qrString: { type: string, nullable: true }
                  expiresAt: { type: string, nullable: true }
                  gatewayReachable:
                    type: boolean
                    description: >-
                      `false` berarti tagihan tersimpan tapi QR belum didapat.
                      Klien menampilkan "Cek status", BUKAN "pembayaran
                      gagal" -- merchant mungkin sudah membayar (FR-C14).
        '400':
          description: Payload tidak valid atau Idempotency-Key hilang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Aktor bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            Bukan kenaikan paket (PLAN_NOT_AN_UPGRADE), paket tidak dapat
            dibeli sendiri (PLAN_NOT_SELF_SERVE / PLAN_NOT_BILLABLE), masih
            ada tagihan terbuka (SUBSCRIPTION_INVOICE_OPEN), id sudah dipakai
            (ID_ALREADY_EXISTS), atau key sedang diproses
            (IDEMPOTENCY_KEY_CONFLICT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau tenant tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tenants/subscription/invoices/{invoiceId}/check-status:
    post:
      operationId: checkSubscriptionInvoiceStatus
      summary: Tanyakan status tagihan ke gateway, dan terapkan hasilnya.
      description: >-
        POST, bukan GET: ia mengubah keadaan. Bersama webhook Midtrans, ia
        satu dari dua jalan sebuah tagihan menjadi `confirmed` -- dan paket
        naik hanya di sana.


        Tagihan yang sudah final TIDAK ditanyakan lagi ke gateway; respons
        memuat `gatewayStatus: null` untuk membedakannya dari "ditanyakan dan
        dijawab pending".
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Keadaan tagihan setelah status gateway diterapkan.
          content:
            application/json:
              schema:
                type: object
                required: [invoice, plan, gatewayStatus]
                properties:
                  invoice: { $ref: '#/components/schemas/TagihanLangganan' }
                  plan:
                    type: string
                    description: Paket tenant SETELAH pemanggilan ini.
                    enum: [free, standard, pro, enterprise]
                  gatewayStatus:
                    type: string
                    nullable: true
                    enum: [pending, confirmed, failed, expired]
        '403':
          description: Aktor bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            Tagihan tidak ditemukan (SUBSCRIPTION_INVOICE_NOT_FOUND), atau
            aktor tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /outlets:
    get:
      operationId: listOutlets
      summary: Daftar outlet tenant ini. Dipakai B-28 dan setiap layar yang memilih outlet.
      description: >-
        Outlet yang DIARSIPKAN ikut, dengan archivedAt terisi -- riwayat
        penjualan menunjuknya, jadi ia tidak pernah benar-benar hilang.
      responses:
        '200':
          description: Daftar outlet, aktif lebih dulu lalu urut nama.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, timezone, archivedAt]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    timezone: { type: string }
                    address: { type: string, nullable: true }
                    archivedAt: { type: string, nullable: true }
        '404':
          description: Aktor tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createOutlet
      summary: >-
        Outlet kedua dan seterusnya. Outlet PERTAMA lahir bersama tenant di
        `POST /tenants` -- tenant tanpa outlet tidak dapat berjualan sama
        sekali, jadi ia tidak pernah ada sebagai keadaan yang sah.
      description: >-
        Titik penegakan `max_outlets` (research/09 § 6). Owner-only:
        `spec-f:29` memberi Owner "membuat outlet" dan `spec-f:30` menaruhnya
        di kolom yang TIDAK BOLEH milik Manajer Area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, timezone]
              properties:
                id: { type: string, minLength: 1 }
                name: { type: string, minLength: 1 }
                timezone:
                  type: string
                  enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
                address: { type: string, nullable: true }
                verticalProfileId:
                  type: string
                  nullable: true
                  description: >-
                    Dikosongkan berarti mewarisi default tenant (OQ-09,
                    resolusi `COALESCE(profil_outlet, default_tenant)`).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  timezone: { type: string }
        '400':
          description: Payload tidak valid, atau zona waktu di luar daftar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Aktor bukan Owner (FORBIDDEN), atau kuota `max_outlets` paket ini
            sudah penuh (QUOTA_EXCEEDED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Aktor atau profil vertikal tidak ditemukan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: id sudah dipakai (ID_ALREADY_EXISTS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                colorHint: { type: string, nullable: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: >-
            Header X-Tenant-Id hilang, parentId tidak valid (mis. string
            kosong), atau X-Tenant-Id tidak dikenal (UNKNOWN_TENANT -- FK ke
            tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: parentId merujuk ke kategori yang tidak ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Kategori tingkat ketiga ditolak, atau id sudah dipakai kategori
            lain (ID_ALREADY_EXISTS -- retry offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listCategories
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}:
    get:
      operationId: getCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: updateCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                parentId: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                colorHint: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang, atau parentId tidak valid (mis. string kosong)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Kategori tingkat ketiga ditolak, atau kategori dijadikan induk dirinya sendiri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/archive:
    post:
      operationId: archiveCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /categories/{categoryId}/restore:
    post:
      operationId: restoreCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  # FR-A8 — impor katalog. `spec-a:254`: fitur AKUISISI, bukan utilitas admin.
  #
  # SATU operasi dengan `dryRun`, bukan dua endpoint. Alurnya di `spec-a:261`
  # menuntut pratinjau SEBELUM impor dijalankan, dan pratinjau yang memakai
  # endpoint berbeda dapat menyimpang dari yang benar-benar dijalankan —
  # merchant menyetujui satu hasil lalu menerima hasil lain.
  /catalog/import:
    post:
      operationId: importCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
                  description: Isi berkas CSV apa adanya, termasuk baris header.
                dryRun:
                  type: boolean
                  default: true
                  description: >-
                    `true` (bawaan) hanya menghitung dan melaporkan; tidak satu
                    baris pun ditulis. Bawaannya sengaja aman: impor yang
                    berjalan karena field lupa diisi tidak dapat dibatalkan.
                bilaSudahAda:
                  type: string
                  enum: [lewati, perbarui]
                  default: lewati
                  description: >-
                    Ditanyakan SEKALI di awal (spec-a:280), bukan per baris.
      responses:
        '200':
          description: >-
            Pratinjau atau ringkasan impor. Selalu 200 walau ada baris
            bermasalah -- baris bermasalah adalah HASIL yang dilaporkan, bukan
            kegagalan permintaan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: >-
            Berkas tidak dapat dibaca sama sekali (IMPORT_FILE_INVALID) --
            misalnya kolom nama/harga tidak ditemukan di baris pertama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Aktor pada X-Actor-Id tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /items:
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, variations]
              properties:
                id: { type: string }
                name: { type: string }
                categoryId: { type: string, nullable: true }
                description: { type: string, nullable: true }
                sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
                variations:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/ItemVariationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          description: >-
            Header X-Tenant-Id hilang, item tanpa variation (ITEM_NO_VARIATION),
            harga/cost variation tidak valid (VALIDATION_ERROR), atau
            X-Tenant-Id tidak dikenal (UNKNOWN_TENANT -- FK ke tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            categoryId tidak ditemukan atau bukan milik tenant pemanggil (RLS
            menyembunyikan kategori tenant lain, bukan hanya menolak akses)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Barcode duplikat, batas 250 variation per item tercapai, atau id
            (item atau variation pertamanya) sudah dipakai (ID_ALREADY_EXISTS
            -- retry offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listItems
      description: >-
        ⛔ TANPA `limit`, SELURUH baris dikembalikan — kompatibilitas klien
        N-1, dan bukan formalitas: `limit` dengan nilai bawaan membuat klien
        lama menerima 100 dari 5.000 produk lalu menampilkan katalog yang
        terpotong TANPA satu pun error. Kasir yang tidak menemukan produknya
        akan menyalahkan katalognya, bukan aplikasinya.


        Paginasi KEYSET, bukan offset. Alasannya berbeda dari riwayat
        transaksi (yang keyset karena perangkat offline menyisipkan baris di
        tengah urutan): di sini alasannya biaya — `OFFSET n` menyuruh
        PostgreSQL memindai lalu MEMBUANG `n` baris. Konsekuensi yang
        dinyatakan: tidak dapat melompat ke halaman 17.
      parameters:
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
          description: >-
            Pencarian pada nama item, deskripsi, dan **nama/SKU/barcode
            varian**. `ILIKE`, tanpa peka huruf besar.


            ⛔ Varian ikut karena `saringProduk` di B-06 sudah mencarinya sejak
            layar itu lahir: merchant mencari produk lewat kode yang tertempel
            di rak. Server yang hanya mencari nama item membuat layar yang
            berpindah ke pencarian sisi server diam-diam berhenti menemukan
            barcode -- kasir memindai, tidak ada yang muncul, tanpa satu pun
            error.


            Bukan full-text: nama produk kafe adalah dua sampai empat kata
            Indonesia, dan yang merchant ketik adalah POTONGAN kata -- "kop"
            untuk "Kopi Susu". `%` dan `_` di masukan di-escape.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
          description: >-
            Dikosongkan berarti TANPA paginasi (perilaku lama). Batas atasnya
            wajib: `limit` yang diteruskan apa adanya membuat satu permintaan
            menarik seluruh katalog ke memori server.
        - name: after
          in: query
          schema: { type: string }
          description: >-
            `nextCursor` dari respons sebelumnya. Bentuknya `sortOrder:id`,
            sengaja TIDAK di-base64: ia tidak membawa kewenangan apa pun --
            hasilnya tetap tunduk RLS, dan kursor yang dipalsukan hanya
            membuat pemanggil melompati barisnya sendiri.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  nextCursor:
                    type: string
                    nullable: true
                    description: >-
                      `null` berarti habis. Kursor yang tetap terisi di halaman
                      terakhir membuat klien meminta halaman kosong selamanya.
        '400':
          description: Header X-Tenant-Id hilang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - name: itemId
