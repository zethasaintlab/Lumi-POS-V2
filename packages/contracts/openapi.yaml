  /items/{itemId}/image:
    # Gambar produk (migrasi 0036).
    #
    # ⛔ Base64 di dalam JSON, BUKAN multipart. Seluruh permukaan REST ini
    # JSON ber-OpenAPI dengan validator AJV di depan setiap rute; satu jalur
    # multipart adalah satu jalur yang melewati validator itu. Ongkosnya
    # dinyatakan: base64 membengkak ~33%, jadi gambar 32 KB menjadi muatan
    # ~43 KB — satu kali saat unggah, bukan per perangkat per sinkronisasi.
    put:
      operationId: putItemImage
      summary: Pasang atau ganti gambar produk
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              additionalProperties: false
              properties:
                data:
                  type: string
                  description: >-
                    WebP hasil kompresi klien, base64. Klien menurunkan kualitas
                    bertahap sampai hasil decode-nya <= 30720 byte.
                  # 40960 = BATAS_BASE64 = 4*ceil(30720/3). ⛔ Server TIDAK
                  # men-decode: panjang byte dihitung dari panjang teksnya,
                  # aritmetika. Itu maksud pencabutan `bytea` — makin sedikit
                  # titik tempat biner dan teks bertukar, makin sedikit tempat
                  # 15 byte dapat menjadi 4 tanpa error.
                  maxLength: 40960
                width:
                  type: integer
                  description: Diisi klien; server memeriksanya bila ada, tidak men-decode gambar.
                height:
                  type: integer
      responses:
        '200':
          description: Gambar diganti
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HasilGambarProduk' }
        '201':
          description: Gambar dipasang pertama kali
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HasilGambarProduk' }
        '400':
          description: >-
            Gambar ditolak. Kode dibedakan: TERLALU_BESAR menuntut merchant
            memotong fotonya, KOSONG menuntut ia mengulang unggahannya.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Item tidak ditemukan atau bukan milik tenant pemanggil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: getItemImage
      summary: Byte gambar produk
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Byte WebP
          content:
            image/webp:
              schema: { type: string, format: binary }
        '404':
          description: Item ini tidak punya gambar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteItemImage
      summary: Hapus gambar produk
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Terhapus
        '404':
          description: >-
            Item ini tidak punya gambar. ⛔ Bukan 204: merchant yang menekan
            Hapus dua kali harus tahu bahwa yang kedua tidak melakukan apa-apa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
