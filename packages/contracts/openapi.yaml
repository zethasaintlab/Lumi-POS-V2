            properties:
              auditId: { type: string }
              occurredAt: { type: string, format: date-time }
              recordedAt: { type: string, format: date-time }
              jenis: { type: string, enum: [void, refund] }
              aktorId: { type: string }
              aktorNama: { type: string }
              penyetujuId: { type: string, nullable: true }
              penyetujuNama: { type: string, nullable: true }
              orderId: { type: string }
              receiptNumber: { type: string }
              nilai:
                type: string
                description: Dari `order.total`, bukan dari payload audit.
              reasonCode: { type: string, nullable: true }
              reasonNote: { type: string, nullable: true }
              outletId: { type: string, nullable: true }
    LaporanKasir:
      type: object
      required: [from, to, outletId, kasir]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        kasir:
          type: array
          items:
            type: object
            required: [userId, name, penjualan]
            properties:
              userId: { type: string }
              name: { type: string }
              penjualan:
                $ref: '#/components/schemas/PosisiPenjualan'
    LaporanPembayaran:
      type: object
      required:
        [from, to, outletId, metode, totalDiterima, totalPerkiraanMdr,
         totalPerkiraanSettlement]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        totalDiterima:
          type: string
          description: Rupiah utuh sebagai STRING -- bigint, bukan number.
        totalPerkiraanMdr:
          type: string
          description: >-
            FR-C12. PERKIRAAN potongan settlement, bukan nilai final. Yang
            menentukan potongan sebenarnya adalah penyelenggara, per
            settlement.
        totalPerkiraanSettlement: { type: string }
        metode:
          type: array
          items:
            type: object
            required:
              [method, jumlahTransaksi, totalDiterima, perkiraanMdr,
               perkiraanSettlement]
            properties:
              method:
                type: string
                enum: [cash, qris_dynamic, qris_static, card_edc, other]
              jumlahTransaksi: { type: integer }
              totalDiterima: { type: string }
              perkiraanMdr:
                type: string
                nullable: true
                description: >-
                  null = metode ini tidak punya perkiraan potongan sama sekali
                  (tunai tidak dipotong; kartu EDC dipotong dengan tarif
                  per-acquirer yang spec tidak berikan angkanya). BERBEDA dari
                  "0", yang berarti diperkirakan tidak ada potongan.
              perkiraanSettlement: { type: string }
              tanpaPerkiraan:
                type: integer
                description: >-
                  Baris yang belum punya perkiraan tersimpan (ditulis sebelum
                  FR-C12).
    LaporanRekap:
      type: object
      required: [from, to, outletId, rekap]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        rekap:
          type: object
          required:
            [jumlahTransaksi, omzetKotor, omzetBersih, pajakTerkumpul, pajak,
             pembayaran, totalDiterima, totalPerkiraanMdr, totalPerkiraanSettlement]
          properties:
            jumlahTransaksi: { type: integer }
            omzetKotor: { type: string }
            voidAmount: { type: string }
            refundAmount: { type: string }
            omzetBersih: { type: string }
            pajakTerkumpul: { type: string }
            rataRataPerTransaksi: { type: string }
            totalDiskonOrder: { type: string }
            totalDiskonBaris: { type: string }
            totalServiceCharge: { type: string }
            totalPembulatan: { type: string }
            totalDiterima: { type: string }
            totalPerkiraanMdr:
              type: string
              description: PERKIRAAN, bukan nilai final (AC FR-C12 kedua).
            totalPerkiraanSettlement: { type: string }
            pajak:
              type: array
              items:
                type: object
                required: [nama, yurisdiksi, total]
                properties:
                  nama:
                    type: string
                    nullable: true
                    description: Snapshot nama tarif. null = ditulis sebelum migrasi 0022.
                  yurisdiksi:
                    type: string
                    nullable: true
                    description: Snapshot yurisdiksi. null = ditulis sebelum migrasi 0028.
                  total: { type: string }
            pembayaran:
              type: array
              items:
                type: object
                required: [method, jumlahTransaksi, totalDiterima, perkiraanMdr, perkiraanSettlement]
                properties:
                  method:
                    type: string
                    enum: [cash, qris_dynamic, qris_static, card_edc, other]
                  jumlahTransaksi: { type: integer }
                  totalDiterima: { type: string }
                  perkiraanMdr:
                    type: string
                    nullable: true
                    description: >-
                      null = metode ini tidak punya perkiraan potongan sama
                      sekali. Berbeda dari "0", yang berarti diperkirakan tidak
                      ada potongan.
                  perkiraanSettlement: { type: string }
                  tanpaPerkiraan:
                    type: integer
                    description: Baris yang belum punya perkiraan tersimpan (ditulis sebelum FR-C12).
    LaporanProduk:
      type: object
      required: [from, to, outletId, margin, produk]
      properties:
        from: { type: string }
        to: { type: string }
        outletId: { type: string, nullable: true }
        margin:
          type: boolean
          description: >-
            Apakah pemanggil berhak melihat kolom margin (`view_margin`).


            ⛔ DINYATAKAN, bukan disimpulkan layar dari ada/tidaknya kunci
            `margin` pada baris pertama: laporan yang KOSONG tidak punya baris
            pertama, dan layar yang menyimpulkan dari sana akan menyembunyikan
            kolomnya untuk owner pada periode tanpa penjualan -- lalu owner
            menyimpulkan haknya dicabut.


            ⛔ `false` TIDAK berarti permintaannya ditolak. `spec-g:99` menulis
            *"kolom margin tidak muncul untuk peran Kasir"*, bukan "laporan
            produk tidak dapat dibuka kasir" -- `spec-g:86` justru menandai
            laporan ini tersedia di perangkat kasir. 403 di sini akan menutup
            seluruh laporan demi satu kolom.
        produk:
          type: array
          items:
            $ref: '#/components/schemas/BarisProduk'
    BarisProduk:
      type: object
      required:
        [variationId, itemName, variationName, kuantitas, kuantitasTampil, nilaiKotor]
      description: >-
        ⛔ `nilaiKotor` BUKAN omzet. Ia `SUM(quantity x unit_price)` sebelum
        diskon baris, sebelum pajak, dan sebelum refund -- nilai barang yang
        keluar, bukan uang yang masuk. Omzet punya satu definisi tunggal di
        `posisi-penjualan.ts`, dan angka ini tidak akan sama dengannya.
      properties:
        variationId: { type: string }
        itemName:
          type: string
          description: Snapshot saat penjualan, bukan nama katalog hari ini.
        variationName: { type: string }
        kuantitas:
          type: string
          description: >-
            INTEGER x1000 (konvensi repo), dikirim sebagai STRING karena ia
            `bigint` di database.
        kuantitasTampil:
          type: string
          description: Bentuk desimal dari `kuantitas`, mis. `"2"` atau `"0,5"`.
        hpp:
          type: string
          description: >-
            FR-A7 AC ketiga. HPP total baris ini, rupiah utuh sebagai STRING.


            ⛔ HANYA ADA bila `margin` bernilai `true`. Kuncinya HILANG untuk
            yang tidak berhak, bukan bernilai `null` -- kolom kosong tetap
            memberi tahu bahwa margin ADA dan tidak boleh dilihat.


            ⛔ Dihitung dari `order_line.cost_at_sale` -- SNAPSHOT saat
            penjualan, bukan `item_variation.cost` hari ini. `spec-a:227`
            menuntutnya persis begitu: merchant yang harga belinya naik pekan
            depan tidak boleh mendapati margin bulan lalu ikut berubah.
        margin:
          type: string
          description: >-
            `nilaiKotor - hpp`, rupiah utuh sebagai STRING. Boleh NEGATIF --
            produk yang dijual rugi itu nyata, dan menjepitnya ke nol
            menyembunyikan baris yang paling perlu dilihat owner. Hanya ada
            bila berhak.
        marginPersen:
          type: number
          nullable: true
          description: >-
            Margin sebagai persen dari nilai kotor, satu digit desimal. `null`
            bila nilai kotornya NOL -- bukan 0%: produk yang seluruhnya
            terjual dengan potongan penuh tidak punya margin persen yang
            berarti. Hanya ada bila berhak.
        barisTanpaHpp:
          type: integer
          description: >-
            ⛔ Berapa baris penjualan produk ini yang `cost_at_sale`-nya NOL.


            Nol dapat berarti dua hal yang sangat berbeda: merchant belum
            mengisi HPP, atau produknya memang tidak berbiaya. Keduanya
            menghasilkan margin 100% yang terlihat meyakinkan, dan yang
            pertama adalah angka karangan. Layar menyebutkannya. Hanya ada
            bila berhak.
        jumlahBaris:
          type: integer
          description: Pembanding untuk `barisTanpaHpp`. Hanya ada bila berhak.
        nilaiKotor:
          type: string
          description: Rupiah utuh sebagai STRING -- `bigint`, bukan `number`.
    LaporanPenjualan:
      type: object
      required: [from, to, outletId, penjualan]
      properties:
        from: { type: string }
        to: { type: string }
        outletId:
          type: string
          nullable: true
          description: >-
            `null` berarti seluruh outlet tenant.
        penjualan:
          $ref: '#/components/schemas/PosisiPenjualan'
    PosisiPenjualan:
      type: object
      required:
        [omzetKotor, voidAmount, refundAmount, omzetBersih, pajakTerkumpul,
         jumlahTransaksi, rataRataPerTransaksi]
      description: >-
        Bentuknya satu-satu dengan `PosisiPenjualan` di
        `packages/domain/src/posisi-penjualan.ts`.


        ⛔ Seluruh nilai uang dikirim sebagai STRING desimal rupiah utuh, bukan
        `number`. Nilainya `bigint` di domain, dan JSON.parse mengubah
        bilangan besar menjadi double -- pola yang sama dengan `TaxRate.rate`.


        `omzetBersih` BOLEH negatif dan tidak pernah dijepit ke nol
        (spec-g:283): refund yang melebihi penjualan menghasilkan hari yang
        justru paling perlu dilihat.
      properties:
        omzetKotor: { type: string }
        voidAmount: { type: string }
        refundAmount: { type: string }
        omzetBersih: { type: string }
        pajakTerkumpul: { type: string }
        jumlahTransaksi: { type: integer }
        rataRataPerTransaksi: { type: string }
    Payment:
      type: object
      required: [id, orderId, checkId, method, amount, status]
      properties:
        id: { type: string }
        orderId: { type: string }
        checkId: { type: string }
        method: { type: string }
        amount: { type: integer }
        tenderedAmount: { type: integer, nullable: true }
        changeAmount: { type: integer, nullable: true }
        status: { type: string }
        confirmedManually: { type: boolean }
        # Terisi hanya untuk metode yang lewat gateway (QRIS dinamis).
        # `providerReference` bisa NULL walau provider terisi: payment ditulis
        # SEBELUM gateway dipanggil, supaya ia tetap ada bila gateway tidak
        # menjawab (FR-C14).
        provider: { type: string, nullable: true }
        providerReference: { type: string, nullable: true }
        tenderedAt: { type: string, format: date-time }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        hlc: { type: string }
    TaxRate:
      type: object
      required: [id, name, type, rate, isInclusive, phase, channel, appliesTo, appliesToIds, effectiveFrom]
      properties:
        id: { type: string }
        outletId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string, enum: [pbjt, ppn, service_charge, none] }
        # `rate` adalah STRING desimal, bukan number. numeric(6,4) dikirim dan
        # diterima sebagai teks supaya tidak pernah melewati IEEE754 double di
        # sisi klien maupun server -- lihat packages/domain/src/numeric.ts.
        rate: { type: string }
        isInclusive: { type: boolean }
        phase: { type: string, enum: [subtotal, total] }
        jurisdiction: { type: string, nullable: true }
        channel: { type: string, enum: [all, dine_in, takeaway] }
        appliesTo: { type: string, enum: [all_items, category, item] }
        appliesToIds:
          type: array
          items: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time, nullable: true }
    TaxRateInput:
      type: object
      required: [id, name, type, rate]
      properties:
        id: { type: string }
        outletId: { type: string, nullable: true }
        name: { type: string }
        type: { type: string }
        # SENGAJA tanpa `type` di sini: assertRateValid (lewat
        # parseRateToScaled) adalah satu-satunya sumber kebenaran, dan ia harus
        # bisa MENOLAK number. Mendeklarasikan `type: string` membuat AJV
        # menolaknya lebih dulu dengan jalur error yang berbeda; pola sama
        # dengan PriceInput.price.
        rate: {}
        isInclusive: { type: boolean }
        phase: { type: string }
        jurisdiction: { type: string, nullable: true }
        channel: { type: string }
        appliesTo: { type: string }
        appliesToIds:
          type: array
          items: { type: string }
        effectiveFrom: { type: string, format: date-time }
    User:
      type: object
      required: [id, name, isActive, roles, outletIds]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        isActive: { type: boolean }
        pinMustChange: { type: boolean }
        hasPin:
          type: boolean
          description: >-
            Apakah pengguna punya PIN. Hash-nya sendiri TIDAK pernah keluar
            lewat endpoint ini -- ia hanya turun lewat replikasi ke perangkat
            outlet tempat pengguna terdaftar (spec-f:124).
        roles:
          type: array
          items:
            type: object
            required: [role, scopeType, scopeId]
            properties:
              role: { type: string }
              scopeType: { type: string }
              scopeId: { type: string }
        outletIds:
          type: array
          items: { type: string }
    Device:
      type: object
      required: [id, outletId, code]
      properties:
        id: { type: string }
        outletId: { type: string }
        code: { type: string }
        name: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    Shift:
      type: object
      required: [id, outletId, deviceId, businessDate, status, openingFloat, openedBy, openedAt]
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [open, counting, closed] }
        openingFloat: { type: integer, minimum: 0 }
        openedBy: { type: string }
        openedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        colorHint: { type: string, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true }
    ItemVariation:
      type: object
      required: [id, itemId, name, price, sortOrder]
      properties:
        id: { type: string }
        itemId: { type: string }
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0 }
        stockingUnit: { type: string }
        sellingUnit: { type: string }
        conversionFactor: { type: number }
        trackStock: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
    Item:
      type: object
      required: [id, name, variations, modifierLists]
      properties:
        id: { type: string }
        name: { type: string }
        categoryId: { type: string, nullable: true }
        description: { type: string, nullable: true }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
        variations:
          type: array
          items:
            $ref: '#/components/schemas/ItemVariation'
        # FIX 5 (whole-branch review): attachModifierList/detachModifierList
        # existed with no way to read the relation back. Nests the full
        # ModifierList shape (including its own `modifiers`) -- K-04 "Pilih
        # Modifier (modal)" needs both which lists apply AND what each list's
        # choices are. Archived attached lists are not filtered out (same as
        # `variations` on this schema and `modifiers` on ModifierList) -- they
        # carry their own archivedAt instead of disappearing from this array.
        modifierLists:
          type: array
          items:
            $ref: '#/components/schemas/ModifierList'
    ImportResult:
      type: object
      required: [dryRun, jumlahBaris, diimpor, dilewati, masalah, kategoriBaru]
      properties:
        dryRun: { type: boolean }
        jumlahBaris:
          type: integer
          description: >-
            Baris DATA yang dibaca. `diimpor + dilewati + masalah` harus sama
            dengan angka ini -- tidak ada impor parsial diam-diam (spec-a:287).
        diimpor: { type: integer }
        dilewati: { type: integer }
        kategoriBaru:
          type: array
          items: { type: string }
        masalah:
          type: array
          items:
            type: object
            required: [baris, alasan]
            properties:
              baris:
                type: integer
                description: Nomor baris di BERKAS, 1-based, header terhitung.
              alasan: { type: string }
    ItemVariationInput:
      type: object
      required: [id, price]
      properties:
        id: { type: string }
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0 }
        stockingUnit: { type: string }
        sellingUnit: { type: string }
        conversionFactor: { type: number }
        trackStock: { type: boolean }
    Price:
      type: object
      required: [id, variationId, price, effectiveFrom, changedBy]
      properties:
        id: { type: string }
        variationId: { type: string }
        outletId: { type: string, nullable: true }
        price: { type: integer, minimum: 0 }
        effectiveFrom: { type: string, format: date-time }
        changedBy: { type: string }
        reason: { type: string, nullable: true }
    PriceInput:
      type: object
      required: [id, price]
      properties:
        id: { type: string }
        # price SENGAJA tidak diberi `type`/`minimum` di sini -- assertPriceValid
        # (apps/server/src/modules/catalog/handlers/prices.ts) adalah
        # satu-satunya sumber kebenaran untuk kode error ini, termasuk kasus
        # yang tidak bisa dinyatakan lewat JSON Schema (di atas
        # Number.MAX_SAFE_INTEGER). Pola sama dengan selectionType di
        # modifier-lists.ts: AJV/fastify-openapi-glue tidak diam-diam
        # menolak nilai salah lebih dulu lewat jalur error yang tidak
        # menghasilkan envelope {error:{code,message}} yang konsisten.
        price: {}
        outletId: { type: string, nullable: true }
        effectiveFrom: { type: string, format: date-time }
        reason: { type: string, nullable: true }
    ResolvedPrice:
      type: object
      required: [price, source, outletId, at]
      properties:
        price: { type: integer, minimum: 0 }
        # anak tangga yang menghasilkan `price` -- 'outlet' (tangga 1),
        # 'tenant' (tangga 2, default tenant/outlet=NULL), 'variation'
        # (tangga 3, item_variation.price beku). Lihat resolvePrice di
        # apps/server/src/modules/catalog/handlers/prices.ts.
        source: { type: string, enum: [outlet, tenant, variation] }
        outletId: { type: string, nullable: true }
        at: { type: string, format: date-time }
    OutletResolvedPrice:
      allOf:
        - $ref: '#/components/schemas/ResolvedPrice'
        - type: object
          required: [variationId]
          properties:
            variationId: { type: string }
    ModifierList:
      type: object
      required: [id, name, selectionType, minSelections, modifiers]
      properties:
        id: { type: string }
        name: { type: string }
        selectionType: { type: string, enum: [single, multi] }
        minSelections: { type: integer }
        maxSelections: { type: integer, nullable: true }
        allowDuplicate: { type: boolean }
        isRequired: { type: boolean }
        archivedAt: { type: string, format: date-time, nullable: true }
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/Modifier'
    Modifier:
      type: object
      required: [id, modifierListId, name, price, sortOrder]
      properties:
        id: { type: string }
        modifierListId: { type: string }
        name: { type: string }
        price: { type: integer, minimum: 0 }
        isDefault: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 2147483647 }
        archivedAt: { type: string, format: date-time, nullable: true }
    OrderLineModifierInput:
      type: object
      required: [id, name, price]
      properties:
        id: { type: string }
        modifierId: { type: string, nullable: true }
        name: { type: string }
        # price/quantityMilli SENGAJA tanpa `type` -- assertModifierPriceValid/
        # assertModifierQuantityMilliValid (handlers/orders.ts) satu-satunya
        # sumber kebenaran, pola sama dengan PriceInput.price.
        price: {}
        quantityMilli: {}
    OrderLineInput:
      type: object
      required: [id, variationId, quantityMilli]
      properties:
        id: { type: string }
        variationId: { type: string }
        quantityMilli: {}
        discountAmount: {}
        # FR-H6 -- harga yang DIPAKAI KLIEN saat penjualan terjadi. Opsional.
        # Ia bukan input perhitungan: server meresolusi harganya sendiri pada
        # `occurred_at`. Gunanya hanya satu -- membedakan klien yang belum
        # tersinkron (memakai harga yang PERNAH berlaku) dari selisih yang
        # tidak dapat dijelaskan.
        unitPrice: {}
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineModifierInput'
    OrderLineModifier:
      type: object
      required: [id, name, price, quantityMilli]
      properties:
        id: { type: string }
        modifierId: { type: string, nullable: true }
        name: { type: string }
        price: { type: integer }
        quantityMilli: { type: integer }
    OrderLine:
      type: object
      required:
        - id
        - variationId
        - itemName
        - variationName
        - unitPrice
        - quantityMilli
        - modifierSnapshot
        - discountAmount
        - taxRate
        - taxAmount
        - isTaxInclusive
        - costAtSale
        - lineTotal
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
        - modifiers
      properties:
        id: { type: string }
        variationId: { type: string }
        # SALINAN NILAI (FR-B3) -- item_name/variation_name/unitPrice/
        # costAtSale diambil saat order dibuat lewat getVariationSnapshot +
        # resolvePrice (catalog/index.ts), TIDAK diperbarui lagi meski
        # katalog berubah setelahnya.
        itemName: { type: string }
        variationName: { type: string }
        unitPrice: { type: integer }
        quantityMilli: { type: integer }
        modifierSnapshot:
          type: array
          items: {}
        discountAmount: { type: integer }
        taxRateId: { type: string, nullable: true }
        taxRate: { type: string }
        taxAmount: { type: integer }
        isTaxInclusive: { type: boolean }
        costAtSale: { type: integer }
        lineTotal: { type: integer }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        # bigint 57-bit -- lihat komentar hlc di createOrder request body.
        hlc: { type: string }
        modifiers:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineModifier'
    # Baris `refund` (FR-B7). Ia yang menyatakan arah berlawanan dari sebuah
    # penjualan — BUKAN payment negatif. `payment.amount` punya
    # CHECK (amount > 0) dan itu dipertahankan (keputusan user 7 Agu 2026),
    # sehingga laporan keuangan tidak perlu membedakan payment yang menambah
    # dari yang mengurangi.
    Refund:
      type: object
      required:
        - id
        - orderId
        - amount
        - reasonCode
        - reasonNote
        - createdBy
        - approvedBy
        - occurredAt
        - recordedAt
        - hlc
      properties:
        id: { type: string }
        orderId: { type: string }
        amount: { type: integer }
        reasonCode:
          type: string
          enum: [barang_rusak, pesanan_salah, pelanggan_tidak_puas, kelebihan_bayar, lainnya]
        reasonNote: { type: string, nullable: true }
        createdBy: { type: string }
        # Selalu terisi dan selalu BERBEDA dari createdBy — refund menuntut
        # persetujuan manajer (spec-b:278, tidak dapat diubah). Yang menegakkan
        # perbedaannya adalah CHECK di audit_event, bukan aplikasi.
        approvedBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }

    # Order PEMBATAL (FR-B7). Bentuknya sengaja BUKAN $ref ke Order: ia tidak
    # punya `checkId` maupun `lines`, karena void tidak menjual apa pun. Nilai
    # uangnya disalin dari order yang dibatalkan supaya baris ini terbaca
    # sendirian ("penjualan sebesar sekian dibatalkan"); laporan penjualan
    # mengecualikannya lewat status = voided, bukan lewat nilai nol.
    CancelledOrder:
      type: object
      required:
        - id
        - outletId
        - deviceId
        - shiftId
        - receiptNumber
        - businessDate
        - sequence
        - status
        - channel
        - subtotal
        - orderDiscount
        - serviceChargeAmount
        - taxAmount
        - roundingAdjustment
        - total
        - amountDue
        - voidedByOrderId
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        shiftId: { type: string }
        receiptNumber: { type: string }
        businessDate: { type: string, format: date }
        sequence: { type: integer }
        status: { type: string, enum: [voided, refunded] }
        channel: { type: string, enum: [dine_in, takeaway] }
        subtotal: { type: integer }
        orderDiscount: { type: integer }
        serviceChargeAmount: { type: integer }
        taxAmount: { type: integer }
        roundingAdjustment: { type: integer }
        total: { type: integer }
        amountDue: { type: integer }
        # Menunjuk order yang DIBATALKAN. Arah ini dipaksa AC FR-B7 pertama:
        # kolom di order asli menunjuk pembatalnya menuntut UPDATE pada order
        # asli, dan itu dilarang. Namanya terbaca terbalik untuk pembacaan yang
        # tersisa ini -- lihat HANDOFF.md.
        voidedByOrderId: { type: string }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }

    Order:
      type: object
      required:
        - id
        - outletId
        - deviceId
        - shiftId
        - receiptNumber
        - businessDate
        - sequence
        - status
        - channel
        - subtotal
        - orderDiscount
        - serviceChargeAmount
        - taxAmount
        - roundingAdjustment
        - total
        - amountDue
        - createdBy
        - occurredAt
        - recordedAt
        - hlc
        - checkId
        - lines
      properties:
        id: { type: string }
        outletId: { type: string }
        deviceId: { type: string }
        shiftId: { type: string }
        receiptNumber: { type: string }
        businessDate: { type: string, format: date }
        sequence: { type: integer }
        status: { type: string, enum: [open, paid, closed, voided, refunded, abandoned] }
        channel: { type: string, enum: [dine_in, takeaway] }
        subtotal: { type: integer }
        orderDiscount: { type: integer }
        serviceChargeAmount: { type: integer }
        # Selalu 0 di sub-project ini -- invariant #7, TaxCalculator adalah
        # Modul C dan belum ada (keputusan Q5, PLAN-ordering-fondasi.md §8.0).
        taxAmount: { type: integer }
        roundingAdjustment: { type: integer }
        total: { type: integer }
        amountDue: { type: integer }
        # FR-H6 -- true bila total klien berbeda dari hitungan server DAN
        # selisihnya tidak dapat dijelaskan riwayat harga. Transaksinya tetap
        # diterima: menolaknya berarti kehilangan penjualan yang uangnya sudah
        # diterima merchant (spec-h:95).
        hasCalculationVariance: { type: boolean }
        varianceAmount: { type: integer, nullable: true }
        createdBy: { type: string }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        hlc: { type: string }
        checkId: { type: string }
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    DeviceRingkas:
      type: object
      required: [id, outletId, code, revokedAt, adaKredensial]
      properties:
        id: { type: string }
        outletId: { type: string }
        code: { type: string }
        name: { type: string, nullable: true }
        platform: { type: string, nullable: true }
        appVersion: { type: string, nullable: true }
        lastSeenAt: { type: string, nullable: true }
        revokedAt:
          type: string
          nullable: true
          description: Terisi berarti perangkat dicabut dan tidak dapat lagi menukar token.
        adaKredensial:
          type: boolean
          description: >-
            Apakah kredensial sudah pernah diterbitkan. BUKAN nilainya --
            secret hanya dapat dibaca sekali, pada respons yang menerbitkannya.
        credentialsExpireAt: { type: string, nullable: true }
    TagihanLangganan:
      type: object
      required:
        [id, plan, outletCount, unitPrice, amount, status, provider,
         providerReference, createdAt, confirmedAt, requestedBy, qrString,
         expiresAt]
      properties:
        id: { type: string }
        plan:
          type: string
          enum: [standard, pro]
          description: >-
            Hanya tier berbayar. `free` tidak perlu dibayar dan `enterprise`
            adalah negosiasi -- keduanya ditolak CHECK constraint tabelnya.
        outletCount:
          type: integer
          description: >-
            SNAPSHOT jumlah outlet aktif saat tagihan dibuat. Harga per outlet
            per bulan (KEP-38), jadi angka ini yang mengalikan.
        unitPrice:
          type: integer
          description: Rupiah utuh per outlet per bulan. SNAPSHOT.
        amount:
          type: integer
          description: >-
            `unitPrice * outletCount`. Konsistensinya ditegakkan CHECK
            constraint di database, bukan hanya di aplikasi.
        status:
          type: string
          enum: [pending_confirmation, confirmed, failed, expired]
          description: >-
            `expired` dibedakan dari `failed` supaya layar dapat berkata "QR
            kedaluwarsa, minta yang baru" alih-alih "pembayaran gagal" -- dua
            kalimat yang menuntut tindakan berbeda.
        provider: { type: string, nullable: true }
        providerReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, nullable: true }
        requestedBy:
          type: string
          description: >-
            Owner yang meminta kenaikan. Kolomnya tanpa FK, jadi yang menjaga
            isinya adalah SELECT yang tunduk RLS di jalur pembuatan -- pola
            yang sama dengan `price_history.changed_by`.
        qrString:
          type: string
          nullable: true
          description: >-
            ⛔ DISIMPAN, bukan hanya dikembalikan sekali saat tagihan dibuat.
            QR yang hanya hidup di respons berarti merchant yang memuat ulang
            halaman kehilangan satu-satunya cara membayar tagihan yang masih
            terbuka -- dan index unik parsial menolak tagihan kedua, jadi ia
            terkunci sampai yang pertama kedaluwarsa sendiri. Menanyakan ulang
            ke gateway tidak menolong: respons status Midtrans tidak memuat
            `actions`.
        expiresAt:
          type: string
          nullable: true
          description: >-
            Kedaluwarsa QR menurut GATEWAY, bukan dihitung dari jam kami.
    PemakaianKuota:
      type: object
      required: [terpakai, batas]
      properties:
        terpakai:
          type: integer
          description: >-
            Jumlah yang sudah dipakai SEKARANG, dengan aturan arsip milik
            modul pemilik tabelnya: produk & outlet mengecualikan yang
            diarsipkan, pengguna mengecualikan yang nonaktif, device
            mengecualikan yang dicabut.
        batas:
          type: integer
          nullable: true
          description: '`null` = tanpa batas.'
    AmbangOutlet:
      type: object
      required: [outletId, tersimpan, berlaku]
      properties:
        outletId: { type: string }
        tersimpan:
          type: object
          description: >-
            Apa yang outlet ini SETEL. `null` berarti belum disetel dan
            bawaannya yang berlaku.
          properties:
            diskonPersenSkala: { type: string, nullable: true }
            diskonNominal: { type: string, nullable: true }
            selisihKas: { type: string, nullable: true }
            noSale: { type: integer, nullable: true }
        berlaku:
          type: object
          description: Apa yang benar-benar menentukan hari ini. Tidak ada null.
          required: [diskonPersenSkala, diskonNominal, selisihKas, noSale]
          properties:
            diskonPersenSkala: { type: string }
            diskonNominal: { type: string }
            selisihKas: { type: string }
            noSale: { type: integer }
    ProfilVertikal:
      type: object
      required: [id, name, allowNegativeStock, isTenantDefault]
      properties:
        id: { type: string }
        name:
          type: string
          description: 'Hanya `fnb` di v1. `retail` menunggu UI-nya (v1.1+).'
        allowNegativeStock:
          type: boolean
          description: >-
            FR-E4. Satu-satunya kolom perilaku yang benar-benar dibaca kode
            hari ini -- dan ia dibaca di PERANGKAT, offline.
        isTenantDefault:
          type: boolean
          description: Diwarisi outlet ber-`vertical_profile_id` NULL.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
