  /vertical-profiles:
    get:
      operationId: listVerticalProfiles
      summary: B-24 -- profil vertikal tenant, dan yang berlaku di tiap outlet.
      description: >-
        ⛔ Resolusi `COALESCE(profil_outlet, profil_default_tenant)` dihitung DI
        SERVER lewat `resolusiProfil` yang SAMA yang perangkat pakai. Layar yang
        menghitungnya sendiri adalah tempat kedua yang memutuskan "profil mana
        yang berlaku di cabang ini", dan yang menyimpang menampilkan aturan yang
        berbeda dari yang kasirnya alami.


        `berlaku.dariBawaan` menandai outlet yang jatuh ke bawaan KERAS domain
        (tenant tanpa profil bawaan sama sekali) -- aturan yang tidak dipilih
        siapa pun.
      responses:
        '200':
          description: Profil dan resolusi per outlet.
          content:
            application/json:
              schema:
                type: object
                required: [profiles, outlets]
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/ProfilVertikal' }
                  outlets:
                    type: array
                    items:
                      type: object
                      required: [id, name, verticalProfileId, berlaku]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        verticalProfileId:
                          type: string
                          nullable: true
                          description: '`null` berarti mengikuti bawaan tenant.'
                        berlaku:
                          type: object
                          required: [id, name, allowNegativeStock, dariBawaan]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            allowNegativeStock: { type: boolean }
                            isTenantDefault: { type: boolean }
                            dariBawaan: { type: boolean }
    post:
      operationId: createVerticalProfile
      summary: B-24 -- membuat profil vertikal baru.
      description: >-
        ⛔ Hanya `fnb`. `retail` ada di CHECK constraint sejak F0 dan ditulis
        IA:291 sebagai kolom v1.3; daftar "jangan bangun" menaruh UI vertikal
        retail di v1.1+. Merchant yang dapat menekan "retail" mendapat aplikasi
        kasir yang dibangun untuk F&B dengan label yang mengatakan sebaliknya --
        layar yang menjanjikan produk yang tidak ada. Ditolak
        `VERTICAL_NOT_AVAILABLE` dengan pesan yang menjelaskan, bukan
        VALIDATION_ERROR generik.


        ⛔ Hanya `allowNegativeStock` yang dapat disetel. Lima kolom perilaku
        lain (`default_channel`, `requires_barcode_flow`, `default_tax_type`,
        `modules_enabled`, dan `name` untuk retail) TIDAK dibaca satu baris kode
        pun di luar pendaftaran tenant -- membukanya di layar adalah setelan
        yang tersimpan dengan benar dan tidak mengubah apa pun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                name:
                  type: string
                  description: 'Hanya `fnb`. Lihat deskripsi.'
                allowNegativeStock: { type: boolean }
      responses:
        '201':
          description: Profil dibuat.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilVertikal' }
        '400':
          description: Vertikal belum tersedia (VERTICAL_NOT_AVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Id sudah dipakai (ID_ALREADY_EXISTS).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /vertical-profiles/{profileId}:
    patch:
      operationId: updateVerticalProfile
      summary: B-24 -- menyetel stok negatif atau memindahkan bawaan tenant.
      description: >-
        ⛔ Bawaan tenant tidak dapat DIKOSONGKAN, hanya DIPINDAHKAN.
        `resolusiProfil` punya bawaan keras (`allowNegativeStock: true`) untuk
        perangkat yang katalognya belum turun; membiarkan merchant menghapus
        bawaan tenantnya berarti setiap outlet ber-override NULL diam-diam jatuh
        ke aturan yang tidak seorang pun pilih, di jalur yang paling tidak
        terlihat. Ditolak DEFAULT_PROFILE_REQUIRED.


        ⛔ Menetapkan bawaan baru MENCABUT yang lama di transaksi yang sama.
        `ux_vertical_profile_tenant_default` adalah index unik parsial:
        menetapkan bawaan kedua tanpa mencabut yang pertama ditolak database
        dengan 23505 -- benar, tapi jawabannya 500 dan pesannya menyebut nama
        index.
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowNegativeStock: { type: boolean }
                isTenantDefault: { type: boolean }
      responses:
        '200':
          description: Profil setelah disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilVertikal' }
        '403':
          description: Bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Profil tidak ditemukan (VERTICAL_PROFILE_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Bawaan tenant tidak dapat dicabut (DEFAULT_PROFILE_REQUIRED).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /outlets/{outletId}/vertical-profile:
    put:
      operationId: setOutletVerticalProfile
      summary: B-24 -- override profil untuk satu outlet.
      description: >-
        `verticalProfileId: null` berarti outlet ini mengikuti bawaan tenant.


        ⛔ BUKAN bagian dari "ubah outlet": endpoint ini tidak menyentuh nama,
        alamat, zona waktu, maupun `archived_at`. B-23 sengaja tidak punya
        ubah/arsip outlet, dan batas itu masih berlaku.


        ⛔ Profilnya divalidasi lewat SELECT yang tunduk RLS sebelum ditulis.
        FK PostgreSQL tidak tunduk RLS (temuan F1) -- ia hanya membuktikan
        barisnya ada di SUATU tenant, dan profil merchant lain akan menentukan
        perilaku stok negatif outlet ini.
      parameters:
        - name: outletId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verticalProfileId: { type: string, nullable: true }
      responses:
        '200':
          description: Override setelah disimpan.
          content:
            application/json:
              schema:
                type: object
                required: [outletId, verticalProfileId]
                properties:
                  outletId: { type: string }
                  verticalProfileId: { type: string, nullable: true }
        '403':
          description: Bukan Owner (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: >-
            Outlet atau profil tidak ditemukan (OUTLET_NOT_FOUND /
            VERTICAL_PROFILE_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /support-sessions:
    post:
      operationId: grantSupportSession
      summary: F.5 -- owner memberi akses support, berbatas waktu.
      description: >-
        `spec-f:393`: *"Untuk mendukung ratusan merchant, akses support
        diperlukan -- tetapi harus menjadi fitur SISTEM, bukan akses database
        langsung."* Alternatif yang tidak dibangun adalah alternatif yang akan
        dipakai: staf yang tidak punya jalan resmi akan diberi kredensial
        database, dan sejak saat itu tidak ada satu pun baris yang mencatat
        siapa membaca apa milik merchant mana.


        ⛔ AC pertama (`spec-f:409`, "akses support tanpa persetujuan merchant
        tidak mungkin") benar karena BENTUKNYA, bukan karena sebuah
        pemeriksaan: token akses hanya ada sebagai keluaran endpoint ini, dan
        tidak ada endpoint mana pun yang menerbitkannya tanpa owner
        menekannya.


        ⛔ Token dikembalikan SEKALI dan tidak pernah dapat dibaca lagi -- yang
        tersimpan hanya SHA-256-nya, sejajar `user_session.token_hash` dan
        `device.token_hash`. Owner yang kehilangannya mengakhiri sesi ini dan
        memberi persetujuan baru.


        ⛔ Read-only adalah BAWAAN (`spec-f:403`). `writeEnabled` harus dikirim
        `true` dengan sengaja; owner yang sedang panik tidak boleh memberikan
        akses tulis tanpa memilihnya.


        ⛔ Durasi bawaan 2 jam, maksimum 24 jam (`spec-f:400`), dan batasnya
        ditegakkan CHECK constraint juga -- aturan yang hanya hidup di aplikasi
        adalah aturan yang hilang pada jalan masuk berikutnya. Yang tidak
        disebut memakai BAWAAN, bukan maksimum.


        ⛔ Sesi aktif yang sudah ada menolak yang baru (409). Dua token hidup
        untuk satu merchant berarti mengakhiri "sesi support" di layar tidak
        benar-benar memutus akses, dan owner tidak punya cara mengetahui ada
        yang kedua.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
          description: "Tidak dipakai endpoint ini; setiap pemberian akses adalah peristiwa tersendiri."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminLabel, reasonCode]
              properties:
                adminLabel:
                  type: string
                  description: >-
                    Siapa dari pihak kami yang meminta, sebagaimana merchant
                    menuliskannya. Teks bebas dan itu DISENGAJA -- ia bukan
                    otentikasi melainkan catatan tentang persetujuan siapa yang
                    diberikan. `spec-f:405` menulis `admin_user_id`, dan kolom
                    itu mengandaikan tabel pengguna STAF yang tidak ada di
                    sistem ini: setiap peran di spec-f adalah peran merchant,
                    dan tabel `user` ber-tenant_id serta tunduk RLS.
                reasonCode:
                  type: string
                  enum:
                    - investigasi_laporan_bug
                    - pemulihan_data
                    - bantuan_konfigurasi
                    - audit_atas_permintaan_merchant
                    - lainnya
                reasonNote:
                  type: string
                  nullable: true
                  description: "Wajib bila reasonCode = lainnya."
                durationMinutes:
                  type: integer
                  minimum: 5
                  maximum: 1440
                  description: "Bawaan 120 (2 jam). Maksimum 1440 (24 jam)."
                writeEnabled:
                  type: boolean
                  default: false
      responses:
        "201":
          description: "Akses diberikan. `token` muncul di sini dan tidak pernah lagi."
        "400": { description: "Muatan tidak valid atau alasan di luar daftar" }
        "403": { description: "Bukan owner" }
        "409": { description: "Sudah ada sesi support yang aktif" }
    get:
      operationId: listSupportSessions
      summary: F.5 -- daftar sesi support, termasuk riwayatnya.
      description: >-
        ⛔ TIDAK dijaga peran. Setiap orang di merchant berhak tahu bahwa pihak
        kami sedang punya akses ke datanya dan kapan itu berakhir; `spec-f:401`
        menuntut banner "terlihat di SELURUH layar", dan banner yang hanya
        muncul untuk owner tidak memenuhi kalimat itu.


        ⛔ Riwayat ikut, bukan hanya yang aktif. "Berapa kali support masuk ke
        data kami, kapan, dan untuk apa" adalah pertanyaan yang merchant berhak
        jawab tanpa meminta siapa pun, dan daftar yang hanya menampilkan sesi
        aktif menjawabnya dengan "tidak pernah".


        `state` diturunkan di SERVER lewat fungsi domain yang sama dengan yang
        menjaga aksesnya -- layar yang menghitungnya dari `expiresAt` sendiri
        akan menampilkan "aktif" untuk sesi yang setiap permintaannya sudah
        ditolak, karena jam browser merchant bukan jam database.
      responses:
        "200": { description: "Daftar sesi, terbaru dulu" }

  /support-sessions/{sessionId}/end:
    post:
      operationId: endSupportSession
      summary: F.5 -- merchant mengakhiri akses support lebih awal.
      description: >-
        ⛔ "Diakhiri" DIBEDAKAN dari "kedaluwarsa", dan perbedaannya dicatat di
        audit. Keduanya berarti akses sudah tidak berlaku, tetapi yang pertama
        berarti merchant merasa perlu memutus akses lebih awal -- dan riwayat
        yang menyamakannya menghapus satu-satunya sinyal itu.


        ⛔ Kedaluwarsa OTOMATIS tidak memakai endpoint ini dan tidak memakai
        pekerjaan terjadwal: ia dihitung saat dibaca. Job pembersih yang tidak
        berjalan -- deploy yang gagal, worker yang mati -- akan membiarkan
        akses hidup melewati batas yang merchant setujui, tanpa siapa pun
        melihatnya.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "Sesi diakhiri" }
        "403": { description: "Bukan owner" }
        "404": { description: "Sesi tidak ditemukan" }
        "409": { description: "Sesi sudah berakhir" }

  /outlets/{outletId}/thresholds:
    get:
      operationId: getOutletThresholds
      summary: B-26 Ambang Otorisasi -- yang disetel dan yang berlaku.
      description: >-
        ⛔ Mengembalikan `tersimpan` DAN `berlaku`, dan itu bukan kelebihan
        data. `tersimpan.selisihKas = null` berarti outlet ini belum menyetel
        apa pun, dan layar harus menampilkan isian KOSONG dengan bawaannya
        sebagai petunjuk -- bukan angka bawaan yang terlihat seperti pilihan
        merchant. `berlaku` adalah yang benar-benar menentukan hari ini.


        Layar yang menebak `tersimpan` dari `berlaku` akan menuliskan bawaan
        sebagai pilihan pada penyimpanan berikutnya, dan sejak saat itu outlet
        berhenti mengikuti perubahan bawaan tanpa siapa pun memutuskannya.


        ⛔ MEMBACA tidak menuntut `threshold_settings`. Kasir yang ditolak
        PIN-nya berhak tahu ambang mana yang menolaknya. Yang dijaga adalah
        menulisnya.
      parameters:
        - name: outletId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ambang outlet ini.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmbangOutlet' }
        '404':
          description: Outlet tidak ditemukan (OUTLET_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      operationId: setOutletThresholds
      summary: B-26 -- menyetel ketiga ambang otorisasi outlet.
      description: >-
        ⛔ PUT, bukan PATCH: bidang yang tidak dikirim menjadi `null`, yaitu
        kembali ke bawaan. Layarnya menampilkan keempat isian sekaligus, dan
        PATCH yang menyimpan sebagian membuat "kosongkan isian ini" tidak dapat
        dinyatakan sama sekali -- padahal mengosongkan adalah satu-satunya cara
        kembali ke bawaan.


        ⛔ `null` BERBEDA dari nol. `selisihKas: "0"` berarti SETIAP selisih
        menuntut otorisasi manajer -- pilihan yang sah untuk merchant yang
        lacinya kecil, dan yang tidak dapat dinyatakan kalau nol diperlakukan
        sebagai "tidak diatur".


        ⛔ TIDAK ADA nilai yang berarti "tidak pernah menuntut otorisasi".
        Ambang yang dapat dimatikan adalah kontrol yang hilang pada hari
        seseorang membutuhkannya, dan yang mematikannya adalah orang yang
        paling ingin ia mati. Merchant yang menginginkan praktis tanpa PIN
        menyetel angkanya tinggi -- terlihat sebagai angka, tercatat di
        `audit_event` sebagai `threshold_changed` dengan nilai lama dan
        barunya.


        RBAC `threshold_settings` = {owner, area_manager}, diturunkan dari
        IA:205. ⛔ Manajer Outlet sengaja di luar: ambang inilah yang
        memutuskan kapan persetujuan MANAJER OUTLET dituntut, dan yang dapat
        menaikkannya dapat menghapus kebutuhan atas persetujuannya sendiri.
      parameters:
        - name: outletId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                diskonPersenSkala:
                  type: string
                  nullable: true
                  description: >-
                    Persen berskala 10.000 sebagai STRING (20% = "2000").
                    String, bukan number: jalur yang memutuskan kapan PIN
                    manajer dituntut tidak menyentuh float.
                diskonNominal: { type: string, nullable: true }
                selisihKas: { type: string, nullable: true }
                noSale:
                  type: integer
                  nullable: true
                  description: >-
                    Berapa pembukaan laci yang BEBAS PIN dalam satu shift.
                    Pembukaan berikutnya menuntut PIN (spec-d:239).
      responses:
        '200':
          description: Ambang setelah disimpan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmbangOutlet' }
        '400':
          description: Nilai di luar batas wajar (VALIDATION_ERROR).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Tidak berhak mengubah ambang otorisasi (FORBIDDEN).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Outlet tidak ditemukan (OUTLET_NOT_FOUND).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /outlets/{outletId}/prices:
    get:
      operationId: listOutletPrices
      parameters:
        - name: outletId
          in: path
          required: true
          schema: { type: string }
        - name: at
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: >-
            Harga efektif seluruh item_variation aktif (archived_at IS NULL)
            di tenant, diselesaikan untuk outlet ini dalam satu query --
            dibutuhkan klien POS saat sinkron turun. Urutan deterministik
            (variationId ASC).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutletResolvedPrice'
        '400':
          description: >-
            Header X-Tenant-Id hilang, atau parameter at bukan timestamp
            ISO 8601 valid (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Outlet tidak ditemukan (OUTLET_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /modifier-lists:
    post:
      operationId: createModifierList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, selectionType]
              properties:
                id: { type: string }
                name: { type: string }
                selectionType: { type: string, enum: [single, multi] }
                minSelections: { type: integer }
                maxSelections: { type: integer, nullable: true }
                allowDuplicate: { type: boolean }
                isRequired: { type: boolean }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierList'
        '400':
          description: >-
            Header X-Tenant-Id hilang, selectionType tidak valid (harus
            'single' atau 'multi', VALIDATION_ERROR), atau X-Tenant-Id tidak
            dikenal (UNKNOWN_TENANT -- FK ke tenant(id) gagal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            id sudah dipakai ModifierList lain (ID_ALREADY_EXISTS -- retry
            offline dengan id yang sama)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      operationId: listModifierLists
      parameters:
        - name: includeArchived
          in: query
