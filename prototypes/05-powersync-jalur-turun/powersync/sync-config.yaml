# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# ⛔ BERKAS INI ADALAH SATU-SATUNYA BATAS TENANT PADA JALUR TURUN.
#
# `powersync_role` punya BYPASSRLS (init/02-powersync-role.sql), dan replikasi
# logis membaca WAL — RLS tidak berlaku sama sekali di sana. Tidak ada lapisan
# kedua di belakang berkas ini. Satu `WHERE tenant_id` yang lupa ditulis
# mengirim katalog satu merchant ke perangkat merchant lain, dan tidak ada
# apa pun di sistem yang akan menahannya.
#
# Itulah kenapa T5 di prototipe ini melepas satu klausa dengan sengaja dan
# mengukur apa yang bocor.
#
# `auth.parameter('tenant_id')` membaca klaim top-level dari JWT yang SUDAH
# diverifikasi terhadap kunci tepercaya. Klaim dari klien yang tidak
# diverifikasi tersedia lewat `subscription.parameter(...)` — JANGAN pakai itu
# untuk batas tenant; namanya sendiri sudah memperingatkan.

config:
  edition: 3

streams:
  # Jalur turun v1 membawa KATALOG saja. Tabel transaksi naik lewat
  # `outbox_local` + REST idempoten dan tidak pernah turun di fase ini —
  # memasukkannya ke sini berarti setiap penjualan melewati WAL decoding
  # tanpa ada yang membutuhkannya.
  katalog:
    auto_subscribe: true
    queries:
      # Konfigurasi outlet — prasyarat FR-D1 ("katalog dan konfigurasi outlet
      # tersedia lokal"). Disaring ke outlet perangkat ini saja: `spec-f:250`
      # menuntut perangkat curian tidak memberi akses ke outlet lain, dan nama
      # serta pengaturan cabang lain tidak dibutuhkan kasir mana pun.
      #
      # Kolom eksplisit. `address` tidak turun — tidak ada layar kasir yang
      # memakainya.
      #
      # `vertical_profile_id` TURUN sejak 14 Agustus 2026: FR-E4 menuntut
      # peringatan stok bekerja offline, jadi perangkat harus meresolusi
      # profilnya sendiri.
      - SELECT id, tenant_id, name, timezone, business_day_ends_at,
               rounding_increment, rounding_mode, service_charge_rate,
               vertical_profile_id, archived_at
          FROM outlet
         WHERE tenant_id = auth.parameter('tenant_id')
           AND id = auth.parameter('outlet_id')
      - SELECT * FROM category WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM item WHERE tenant_id = auth.parameter('tenant_id')
      # ⛔ KOLOM EKSPLISIT, dan `cost` sengaja TIDAK ada — FR-F5.
      # `SELECT *` mengirim HPP ke setiap tablet di setiap outlet, dan
      # `spec-f:57` menyebut alasannya: kasir punya turnover tinggi dan sering
      # pindah ke kompetitor merchant. Klien tidak pernah membutuhkannya —
      # `order_line.cost_at_sale` dihitung SERVER.
      - SELECT id, tenant_id, item_id, name, sku, barcode, price,
               stocking_unit, selling_unit, conversion_factor,
               track_stock, sort_order, archived_at
          FROM item_variation
         WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM modifier_list WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM modifier WHERE tenant_id = auth.parameter('tenant_id')
      - SELECT * FROM item_modifier_list WHERE tenant_id = auth.parameter('tenant_id')
      # FR-A7. Kolom audit (`changed_by`, `reason`) tidak turun — tidak ada
      # layar kasir yang memakainya, dan `changed_by` adalah id pengguna yang
      # bisa saja bukan staf outlet ini.
      - SELECT id, tenant_id, variation_id, outlet_id, price, effective_from
          FROM price_history
         WHERE tenant_id = auth.parameter('tenant_id')
           AND (outlet_id IS NULL OR outlet_id = auth.parameter('outlet_id'))
      - SELECT * FROM tax_rate WHERE tenant_id = auth.parameter('tenant_id')
      # F4 — profil printer. `ERD:445`: "Data, bukan kode — menambah model
      # printer = menambah baris". Tanpa tabel ini, menambah dukungan satu
      # model menuntut perubahan kode lalu rilis ke setiap perangkat merchant.
      #
      # ⛔ SATU-SATUNYA query di berkas ini TANPA klausa tenant, dan itu benar:
      # `db/migrations/0012` menyebutnya "data referensi hardware global" dan
      # membebaskannya dari RLS — ia tidak punya kolom `tenant_id` sama
      # sekali. Tabel tanpa tenant tidak dapat bocor antar tenant.
      #
      # Penjaga `tests/kasir/sync-rules.test.js` membaca daftar tabel
      # ber-tenant dari DDL server, jadi pengecualian ini DITURUNKAN, bukan
      # didaftar tangan.
      - SELECT id, name, paper_width_mm, chars_per_line, codepage,
               has_cutter, init_command, cut_command, drawer_command, image_support
          FROM printer_profile
      # FR-E4 / OQ-09 — `allow_negative_stock` per outlet dengan default tenant.
      #
      # ⛔ Tabelnya diturunkan APA ADANYA, bukan sebagai kolom terhitung di
      # baris `outlet`. PowerSync mereplikasi perubahan per tabel dari WAL:
      # mengubah `vertical_profile` tidak mengubah baris `outlet`, jadi baris
      # itu tidak dipancarkan ulang — dan perangkat memegang nilai basi
      # selamanya, tanpa satu pun error. Resolusinya terjadi di perangkat,
      # lewat `packages/domain/src/profil-vertikal.ts`.
      #
      # Seluruh profil tenant ikut turun, bukan hanya milik outlet ini: yang
      # menjadi default tenant adalah baris LAIN, dan resolusinya
      # membutuhkan keduanya.
      - SELECT id, tenant_id, name, allow_negative_stock, is_tenant_default,
               default_channel, requires_barcode_flow, default_tax_type
          FROM vertical_profile
         WHERE tenant_id = auth.parameter('tenant_id')

  # Identitas — FR-F3 (login offline). Hash PIN harus ADA di perangkat, karena
  # verifikasinya lokal (`spec-f:124-125`).
  #
  # ⛔ KOLOM DIDAFTARKAN SATU PER SATU, dan itu WAJIB — bukan kerapian.
  # `SELECT *` akan mengirim `password_hash`, `mfa_secret`, dan `email` ke
  # setiap tablet di setiap outlet. Permukaan kasir tidak menerima login
  # password sama sekali (`spec-f:150`), jadi ketiganya murni tambahan bahan
  # yang hilang bersama tablet yang dicuri (`spec-f:242`).
  #
  # ⛔ DISARING PER OUTLET, bukan per tenant. `spec-f:250`: "Perangkat hanya
  # mereplikasi data outletnya. Perangkat curian tidak memberi akses ke outlet
  # lain." Tanpa join ke `user_outlet`, satu tablet memegang hash PIN seluruh
  # staf merchant — termasuk cabang yang tidak pernah dilihatnya.
  #
  # Dan ingat batas yang berlaku untuk SELURUH berkas ini: sync rules adalah
  # SATU-SATUNYA batas tenant pada jalur turun. Tidak ada RLS di belakangnya.
  identitas:
    auto_subscribe: true
    queries:
      - SELECT u.id, u.tenant_id, u.name, u.pin_hash, u.pin_algo,
               u.pin_must_change, u.is_active
          FROM "user" u
          JOIN user_outlet uo ON uo.user_id = u.id
         WHERE u.tenant_id = auth.parameter('tenant_id')
           AND uo.outlet_id = auth.parameter('outlet_id')
      - SELECT ur.id, ur.tenant_id, ur.user_id, ur.role, ur.scope_type, ur.scope_id
          FROM user_role ur
          JOIN user_outlet uo ON uo.user_id = ur.user_id
         WHERE ur.tenant_id = auth.parameter('tenant_id')
           AND uo.outlet_id = auth.parameter('outlet_id')
      - SELECT id, tenant_id, user_id, outlet_id
          FROM user_outlet
         WHERE tenant_id = auth.parameter('tenant_id')
           AND outlet_id = auth.parameter('outlet_id')
