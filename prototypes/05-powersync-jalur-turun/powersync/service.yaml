# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

# PostgreSQL, bukan MongoDB. Didukung penuh, dan membuat seluruh stack ini
# satu jenis database.
storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # ⛔ DIUBAH 8 Agustus 2026: dari JWKS inline HS256 menjadi JWKS SUNGGUHAN
  # yang dilayani server Fastify kami (FR-F12).
  #
  # Versi sebelumnya menanam kunci SIMETRIS di berkas ini, dan komentarnya
  # sendiri menyebutnya "bukan pola produksi". Sekarang tidak ada lagi bahan
  # rahasia di sini sama sekali: PowerSync mengambil kunci PUBLIK dari server
  # kami dan memverifikasi RS256 dengannya.
  #
  # `host.docker.internal` -- container berbicara ke host, dan server kami
  # harus mendengarkan di 0.0.0.0, bukan 127.0.0.1.
  jwks_uri: http://host.docker.internal:3000/.well-known/jwks.json

  # Cocok dengan klaim `aud` yang dicetak `tokens.ts`. Tidak cocok -> 401,
  # dan pesannya tidak menyebut audience.
  audience: ["powersync"]

api:
  tokens:
    - prototipe-05-admin-token
