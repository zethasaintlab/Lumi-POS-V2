name: test

# Whole-branch review FIX 8: `push:` (any branch) + `pull_request:` together
# double-ran this workflow on every commit pushed to an open PR branch --
# once for the `push` event, once for the PR's `synchronize` event, both
# checking out the identical commit. `push` is restricted to `main` (so a
# merge/direct-push to main still gets its own run) and `pull_request` keeps
# covering feature-branch commits via the PR's own synchronize event -- one
# run per commit either way, not two.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          # Superuser for the throwaway CI container only — never a production
          # credential. Bootstrap connects with this to create the lumi_owner /
          # lumi_app roles and the lumi database (CLAUDE.md invariant #8).
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The db:* and test:* npm scripts hard-code `--env-file=.env` (see
    # package.json), so they read a .env file rather than process env vars.
    # This step writes that file before any script runs. Passwords below are
    # literal values for a throwaway service container that lives only for
    # this job — not production secrets.
    steps:
      - uses: actions/checkout@v7

      # ⛔ `origin/main` disediakan DI SINI, dan `tests/runtime/ds-bundle-vendor.test.js`
      # menuntutnya.
      #
      # `actions/checkout@v7` memakai `--depth=1`. Pada event `push` ke `main`
      # ref yang diambilnya mendarat sebagai `refs/remotes/origin/main`, jadi
      # penjaga menemukannya; pada event `pull_request` yang diambil hanya
      # `refs/remotes/pull/<n>/merge`, dan `origin/main` tidak pernah ada.
      # Asimetri antara kedua event itu membuat penjaga vendor `ds-bundle/`
      # MERAH di setiap PR dan hijau di setiap push ke main — terukur pada dua
      # commit berbeda di dua PR berbeda (run #126 dan #128).
      #
      # ⛔ Yang diperbaiki RUNNER-nya, bukan penjaganya. Penjaga itu benar:
      # ia menolak hijau tanpa benar-benar membandingkan. Membuatnya melewatkan
      # diri sendiri saat ref hilang berarti ia berhenti menjaga di lingkungan
      # mana pun yang kebetulan tidak menyediakan ref itu, tanpa seorang pun
      # menyadarinya.
      #
      # `--depth=1` cukup: yang dibandingkan `git diff` adalah isi pohon pada
      # kedua ujung, bukan riwayat di antaranya. `fetch-depth: 0` akan
      # mengambil seluruh riwayat repo untuk pertanyaan yang hanya butuh satu
      # commit.
      - name: Sediakan origin/main untuk penjaga vendor
        run: git fetch --depth=1 origin main:refs/remotes/origin/main

      - uses: actions/setup-node@v7
        with:
          # ⛔ 24, bukan 22 — dan itu lantai yang ditegakkan `engines.node`.
          # `crypto.argon2` (modul identity, hash PIN) baru ada sejak Node
          # 24.7.0. Di Node 22 yang muncul adalah tiga test PIN gagal dengan
          # pesan dari dalam `pin-hasher.ts`, tanpa satu kata pun tentang versi
          # Node. `tests/runtime/versi-node.test.js` menjaga ketiga angkanya
          # tetap sepakat.
          node-version: '24'

      - run: npm ci

      - name: Tulis .env untuk CI
        run: |
          cat <<'EOF' > .env
          NODE_ENV=test
          PORT=3000
          DATABASE_URL=postgres://lumi_app:lumi_app_ci@localhost:5432/lumi
          DATABASE_MIGRATION_URL=postgres://lumi_owner:lumi_owner_ci@localhost:5432/lumi
          DATABASE_ADMIN_URL=postgres://postgres:postgres@localhost:5432/postgres
          TENANT_MODE=multi
          LICENSE=cloud
          TELEMETRY=off
          POWERSYNC_URL=http://localhost:8080
          POWERSYNC_TOKEN=
          # FR-F12: sengaja KOSONG. Endpoint token menjawab 503 tanpa kunci,
          # dan test yang membutuhkannya membuat kunci RSA-nya sendiri lalu
          # menyuntikkannya lewat buildApp({ syncJwtPrivateKey }).
          POWERSYNC_JWT_PRIVATE_KEY=
          # Kosong = tidak ada origin browser yang diizinkan. Test CORS
          # menyuntikkan daftarnya sendiri lewat buildApp({ corsOrigins }).
          CORS_ORIGINS=
          MIDTRANS_SERVER_KEY=
          MIDTRANS_CLIENT_KEY=
          MIDTRANS_ENV=sandbox
          EOF

      # PALING DULU, dan itu seluruh gunanya: ia memeriksa bahwa runner ini
      # memenuhi `engines.node`. Kalau tidak, setiap langkah di bawah akan
      # gagal dengan gejala yang menunjuk ke tempat lain -- 14 Agustus 2026
      # gejalanya adalah tiga test PIN merah, bukan satu kalimat tentang versi.
      - run: npm run test:runtime
      # Tanpa database dan tanpa I/O -- dijalankan lebih dulu supaya kesalahan
      # logika domain (state machine, aritmetika uang, HLC) gagal dalam
      # hitungan detik, bukan setelah menunggu seluruh suite ber-database.
      - run: npm run test:domain
      # Gate F2 (ARCH s14): 0 transaksi hilang/duplikat di bawah fault
      # injection, 10.000 iterasi. Tanpa database dan tanpa jaringan, jadi ia
      # berjalan lebih dulu -- kalau protokolnya rusak, sisanya tidak perlu
      # dijalankan.
      - run: npm run test:dst
      # FR-H1 -- antrean upload. Sekelas test:domain dan test:dst: tanpa
      # database dan tanpa jaringan (SQLite in-memory + pengirim yang
      # di-inject), termasuk property test 1.000 item dengan respons yang
      # hilang. Berjalan lebih dulu karena ia cepat dan karena antrean yang
      # rusak membuat sisa suite tidak menarik.
      - run: npm run test:sync-client
      # Pondasi apps/kasir. Semuanya modul murni yang dimuat langsung dengan
      # --experimental-strip-types: tabel rute, skema raw table, keputusan
      # migrasi lokal, adapter DbLokal. Yang TIDAK dapat diuji di sini -- OPFS,
      # Web Worker, writeTransaction PowerSync, watch() -- dijalankan lewat
      # harness browser (`apps/kasir/harness.html`), manual, seperti prototipe.
      - run: npm run test:kasir
      # Sidebar back-office diperiksa terhadap tabel layar di IA §3.3. Tanpa
      # database, sekelas test:kasir.
      - run: npm run test:backoffice
      # Owner mobile (IA §4). Aturan tampilan M-01 sebagai modul murni; sekelas
      # test:backoffice, tanpa database dan tanpa DOM.
      - run: npm run test:hp

      # ⛔ PENJAGA DOM K-06 — enam penjaga atas layar yang memindahkan uang.
      #
      # Ia terpasang 16 September 2026 dan sempat TIDAK ada di daftar ini.
      # Penjaga yang tidak dijalankan CI memberi rasa aman palsu, dan itu lebih
      # buruk daripada tidak punya penjaga sama sekali — bentuk yang sama
      # dengan `test:tenancy`, yang nyaris tertinggal dari daftar ini, dan
      # dengan guard RBAC di `tests/identity/` yang sempat merah berhari-hari
      # tanpa ketahuan.
      #
      # Tiga langkah, dan urutannya bukan selera:
      #
      #   1. Versi Playwright dibaca dari LOCKFILE, bukan dari `package.json`.
      #      `^1.62.1` di `package.json` cocok dengan banyak versi; yang
      #      benar-benar terpasang `npm ci` hanya satu, dan itu yang menentukan
      #      revisi Chromium mana yang dibutuhkan. Kunci cache yang diturunkan
      #      dari rentang akan menyajikan Chromium versi LAMA kepada Playwright
      #      versi baru.
      #
      #   2. Cache di-key PER VERSI, bukan per `hashFiles(package-lock.json)`.
      #      Hash seluruh lockfile gugur pada SETIAP perubahan dependensi —
      #      termasuk yang tidak ada hubungannya dengan peramban — dan setiap
      #      kegugurannya membayar ulang unduhan ~170 MB.
      #
      #   3. `npx playwright install` tetap dijalankan pada cache HIT. Ia
      #      memverifikasi lalu melewati unduhan, jadi yang dihemat cache
      #      adalah unduhannya; yang TIDAK boleh dilewati adalah pemeriksaan
      #      bahwa peramban benar-benar ada. Cache yang rusak sebagian akan
      #      muncul sebagai "Executable doesn't exist" di tengah test, bukan
      #      sebagai langkah yang gagal dengan jelas.
      - name: Versi Playwright dari lockfile
        id: pw
        run: |
          echo "versi=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache peramban Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.versi }}

      # ⛔ TANPA `PLAYWRIGHT_BROWSERS_PATH`, dan itu disengaja.
      #
      # `tests/kasir-dom/k06-penjaga.test.js` menurunkan jalur peramban lewat
      # `chromePath()`: `PLAYWRIGHT_CHROMIUM` → isi `PLAYWRIGHT_BROWSERS_PATH`
      # → `undefined`, yang berarti "biarkan Playwright memilih sendiri".
      # Runner ini mengambil cabang KETIGA, dan itu cabang yang sama yang
      # setiap mesin tanpa konfigurasi khusus ambil.
      #
      # Memaku `PLAYWRIGHT_BROWSERS_PATH` di sini akan memaksa cabang kedua,
      # yang mencari `chromium-<rev>/chrome-linux/chrome` — tata letak build
      # LAMA. Build Chrome for Testing yang Playwright 1.62 unduh memakai tata
      # letak berbeda, jadi cabang kedua akan gagal menemukannya lalu jatuh ke
      # cabang ketiga juga: satu variabel lingkungan yang tidak mengubah apa
      # pun kecuali membuat orang mengira ia mengubah sesuatu.
      - run: npx playwright install --with-deps chromium

      # Harness DOM dibangun terpisah dari `index.html` produksi — config dan
      # direktori keluarannya sendiri (`apps/kasir/vite.k06.config.ts`).
      # Suitenya MENOLAK berjalan tanpa build ini, jadi langkah yang hilang
      # muncul sebagai kegagalan bernama, bukan sebagai nol test yang lewat.
      - run: npm run build:harness-k06
      - run: npm run test:kasir-dom

      - run: npm run db:bootstrap
      - run: npm run db:migrate

      - run: npm run test:isolation
      - run: npm run test:schema
      - run: npm run test:server
      - run: npm run test:identity
      # F5 -- pendaftaran merchant, penegakan kuota, batas laju. Suite ini
      # nyaris tertinggal dari daftar ini, dan konsekuensinya persis kelas
      # cacat yang paling sering ditemukan di repo ini: penjaga yang tidak
      # menjaga apa pun karena tidak pernah dijalankan.
      - run: npm run test:tenancy
      - run: npm run test:catalog
      - run: npm run test:ordering
      # DST terhadap server + database SUNGGUHAN. Iterasinya jauh lebih sedikit
      # daripada gate 10.000 di test:dst -- yang dicari di sini adalah IKATAN:
      # bahwa implementasi mengikuti protokol yang sudah dibuktikan benar.
      - run: npm run test:dst-server
      - run: npm run test:payment

      - run: npm run test:sqlite-local
      - run: npm run test:oxlint-ds-adherence
