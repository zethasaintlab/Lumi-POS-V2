name: lint-ds

on:
  push:
  pull_request:

jobs:
  lint-ds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Mengikuti `engines.node` (>=24.7) — lihat catatan di test.yml.
          node-version: '24'
      - run: npm ci
      - run: npm run lint:ds
      - run: cd apps/server && npx tsc --noEmit
